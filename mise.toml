[tools]
go = "1.27.3"
bun = "1.4.4"
golangci-lint = "2.15.0"

[tasks.build]
description = "Build everything without cgo, plus a race build (mirrors CI)"
run = ["CGO_ENABLED=0 go build ./...", "go build -race ./..."]

[tasks.release]
description = "Build dist/kitsune-server with the web client inside it"
run = "sh scripts/build.sh"

[tasks.nocgo]
description = "Fail if any non-standard package, dependencies and test deps included, uses C interop"
run = "sh scripts/nocgo.sh"

[tasks.test]
description = "Race tests in shuffled order (mirrors CI)"
run = "go test -race -shuffle=on ./..."

[tasks.lint]
description = "Lint config check, go.mod tidiness, golangci-lint (incl. formatters), go vet, go fix modernizers"
run = [
  "golangci-lint config verify",
  "go mod tidy -diff",
  "go -C tools mod tidy -diff",
  "golangci-lint run ./...",
  "go vet ./...",
  "go fix -diff ./...",
]

[tasks.generate]
description = "Regenerate sqlc code with a cgo-free sqlc (tools/go.mod pins it), then the schema snapshot"
run = [
  "CGO_ENABLED=0 go -C tools tool sqlc generate -f ../internal/store/sqlc.yaml",
  "UPDATE_SNAPSHOT=1 go test -count=1 -run '^TestSchemaSnapshot$' ./internal/store",
]

[tasks.fmt]
description = "Apply gofumpt and goimports"
run = "golangci-lint fmt ./..."

[tasks.vuln]
description = "Known-vulnerability scan (CI runs this too)"
run = "go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./..."

[tasks.perf]
description = "Measure how fast Kitsune responds against perf/budgets.json: server speed tests, then the browser suite"
run = "sh scripts/perf.sh"

[tasks."web:dev"]
description = "Run the web client's dev server"
dir = "web"
run = "bun run dev"

[tasks."web:build"]
description = "Build the web client"
dir = "web"
run = "bun run build"

[tasks."web:preview"]
description = "Serve the production build of the web client"
dir = "web"
run = "bun run preview"

[tasks."web:check"]
description = "Web client: locked install, lint, svelte-check, tests, build (mirrors CI)"
dir = "web"
run = [
  "bun install --frozen-lockfile",
  "bun run lint",
  "bun run check",
  "bun run test",
  "bun run build",
]

[tasks."web:e2e"]
description = "Web client in a browser, on its fixtures: fails on any page error"
depends = ["web:check"]
dir = "web"
run = "bun run e2e"

[tasks.check]
description = "Everything CI checks, locally"
depends = ["build", "test", "lint", "nocgo", "vuln", "web:check", "web:e2e"]
