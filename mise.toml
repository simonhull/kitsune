[tools]
go = "1.27.3"
golangci-lint = "2.15.0"

[tasks.build]
description = "Build everything without cgo, plus a race build (mirrors CI)"
run = ["CGO_ENABLED=0 go build ./...", "go build -race ./..."]

[tasks.nocgo]
description = "Fail if any non-standard package, dependencies and test deps included, uses C interop"
run = "sh scripts/nocgo.sh"

[tasks.test]
description = "Race tests in shuffled order (mirrors CI)"
run = "go test -race -shuffle=on ./..."

[tasks.lint]
description = "Lint config check, go.mod tidiness, golangci-lint (incl. formatters), go vet, go fix modernizers"
run = [
  "golangci-lint config verify",
  "go mod tidy -diff",
  "go -C tools mod tidy -diff",
  "golangci-lint run ./...",
  "go vet ./...",
  "go fix -diff ./...",
]

[tasks.generate]
description = "Regenerate sqlc code with a cgo-free sqlc (tools/go.mod pins it)"
run = "CGO_ENABLED=0 go -C tools tool sqlc generate -f ../internal/store/sqlc.yaml"

[tasks.fmt]
description = "Apply gofumpt and goimports"
run = "golangci-lint fmt ./..."

[tasks.vuln]
description = "Known-vulnerability scan (CI runs this too)"
run = "go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./..."

[tasks.check]
description = "Everything CI checks, locally"
depends = ["build", "test", "lint", "nocgo", "vuln"]
