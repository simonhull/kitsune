openapi: 3.1.0
info:
  title: Kitsune
  version: 0.1.0
  description: Native API of the Kitsune music server.
servers:
  - url: /api/v1
security:
  - bearer: []
  - cookie: []
paths:
  /healthz:
    get:
      operationId: getHealth
      summary: Report that the process is up.
      security: []
      responses:
        "204":
          description: The process is up.
  /readyz:
    get:
      operationId: getReady
      summary: Report that the server is ready to serve.
      security: []
      responses:
        "204":
          description: The server is ready.
        "503":
          $ref: "#/components/responses/Problem"
  /auth/login:
    post:
      operationId: login
      summary: Exchange a name and password for a session.
      description: >-
        Failed attempts are rate limited per client IP and per account, with
        exponential backoff after 5 consecutive failures.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LoginRequest" }
      responses:
        "200":
          description: >-
            The session. With `cookie: true` it is also set as the
            kitsune_session cookie and the body carries no token.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Session" }
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "429":
          description: Too many failed logins.
          headers:
            Retry-After:
              description: Seconds to wait before trying again.
              schema: { type: integer }
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
  /auth/reset:
    post:
      operationId: requestPasswordReset
      summary: Ask for a code that sets a new password.
      description: >-
        Kitsune sends no email: for a real account, the server makes a reset
        code and writes it once to its log, at WARN, naming the account, so
        only whoever runs the server can pass it on. The code works once, for
        15 minutes, and asking again replaces it. Codes live in memory, so a
        restart voids them. The answer is the same whether or not the account
        exists. Requests are rate limited per client IP and per name.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ResetRequest" }
      responses:
        "202":
          description: If the account exists, a code is in the server's log.
        "400":
          $ref: "#/components/responses/Problem"
        "429":
          $ref: "#/components/responses/TooManyAttempts"
  /auth/reset/confirm:
    post:
      operationId: confirmPasswordReset
      summary: Set a new password with a reset code, and sign in.
      description: >-
        On success the account's sessions all end and a new one starts, as at
        login. A wrong code counts against the login rate limit, per client IP
        and per account; a wrong code, an expired or used one and an unknown
        name are the same 403.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ResetConfirm" }
      responses:
        "200":
          description: >-
            The new session. With `cookie: true` it is also set as the
            kitsune_session cookie and the body carries no token.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Session" }
        "400":
          $ref: "#/components/responses/Problem"
        "403":
          description: The code is wrong, expired or used, or no account has the name.
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        "429":
          $ref: "#/components/responses/TooManyAttempts"
  /setup:
    get:
      operationId: getSetup
      summary: Say whether the first account is still to be made.
      description: >-
        `needed` is true while the server has no accounts, and false for good
        once one exists. `codeRequired` is true while needed when the caller's
        address is outside the server's network (loopback, private ranges,
        link-local and 100.64.0.0/10), read through trusted proxies only.
      security: []
      responses:
        "200":
          description: Whether setup is needed, and whether it needs the code.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SetupStatus" }
    post:
      operationId: setup
      summary: Make the first account, an administrator, and sign in as it.
      description: >-
        Works only while the server has no accounts; of two racing requests
        exactly one succeeds. From outside the server's network it needs the
        setup code the server logged at startup. Wrong codes count against the
        login rate limit per client IP.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SetupRequest" }
      responses:
        "200":
          description: >-
            The new administrator's session, set as the kitsune_session cookie.
            The body carries no token.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Session" }
        "400":
          $ref: "#/components/responses/Problem"
        "403":
          description: The setup code is missing or wrong.
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        "409":
          description: An account exists, so setup is done.
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        "429":
          description: Too many wrong setup codes.
          headers:
            Retry-After:
              description: Seconds to wait before trying again.
              schema: { type: integer }
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
  /auth/logout:
    post:
      operationId: logout
      summary: End the current session.
      description: Always clears the session cookie, even for a bearer logout.
      parameters:
        - $ref: "#/components/parameters/KitsuneRequest"
      responses:
        "204":
          description: The session has ended.
        "401":
          description: Credentials are missing, invalid or expired.
          headers:
            WWW-Authenticate:
              schema: { type: string }
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        "403":
          $ref: "#/components/responses/Problem"
  /me:
    get:
      operationId: getMe
      summary: Return the authenticated user.
      responses:
        "200":
          description: The authenticated user.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Me" }
        "401":
          description: Credentials are missing, invalid or expired.
          headers:
            WWW-Authenticate:
              schema: { type: string }
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
  /me/plays:
    post:
      operationId: postPlay
      summary: Record that the caller played a track.
      description: >-
        One report per listen that counted, which the client decides. A second
        report with the same `clientId` changes nothing and answers the same, so
        a client can retry whenever it isn't sure. The track may be missing from
        disk, and only one deleted from the library is a 404. A `playedAt` ahead
        of the server's clock is taken as now.
      parameters:
        - $ref: "#/components/parameters/KitsuneRequest"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PlayReport" }
      responses:
        "204":
          description: The play is recorded.
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          description: Credentials are missing, invalid or expired.
          headers:
            WWW-Authenticate:
              schema: { type: string }
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        "403":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
  /me/listens:
    post:
      operationId: postListen
      summary: Record a listen's start, or how it ended.
      description: >-
        Every song a client starts is a listen, whether or not it counts as a
        play: shuffle learns from them. The client sends the start, and later
        the end, under one `clientId`; either may come alone, and a report sent
        again changes nothing. Once a listen has ended, nothing changes how.
        `skipped` means the person moved on before the end, and is the only
        ending that counts against a song: `stopped` (playback stopped or ran
        out) and `interrupted` (an error, or the app closing) never do. A
        `startedAt` ahead of the server's clock is taken as now. Plays and
        Last.fm are unchanged: `POST /me/plays` still reports a listen that
        counted.
      parameters:
        - $ref: "#/components/parameters/KitsuneRequest"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ListenReport" }
      responses:
        "204":
          description: The listen is recorded.
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          description: Credentials are missing, invalid or expired.
          headers:
            WWW-Authenticate:
              schema: { type: string }
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        "403":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
  /me/hearts/{kind}/{id}:
    put:
      operationId: putHeart
      summary: Heart a track, album or artist for the caller.
      description: >-
        Hearting what is already hearted changes nothing and answers the same,
        so a client can retry. A track missing from disk still takes a heart. A
        heart is the caller's own: nobody else sees it.
      parameters:
        - $ref: "#/components/parameters/KitsuneRequest"
        - $ref: "#/components/parameters/HeartKind"
        - $ref: "#/components/parameters/ItemID"
      responses:
        "204":
          description: Done.
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          description: Credentials are missing, invalid or expired.
          headers:
            WWW-Authenticate:
              schema: { type: string }
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        "403":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
    delete:
      operationId: deleteHeart
      summary: Take the caller's heart off a track, album or artist.
      description: >-
        Answers the same whether or not there was a heart, so a client can
        retry. Only an item that isn't in the library is a 404.
      parameters:
        - $ref: "#/components/parameters/KitsuneRequest"
        - $ref: "#/components/parameters/HeartKind"
        - $ref: "#/components/parameters/ItemID"
      responses:
        "204":
          description: Done.
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          description: Credentials are missing, invalid or expired.
          headers:
            WWW-Authenticate:
              schema: { type: string }
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        "403":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
  /me/ratings/tracks/{id}:
    put:
      operationId: putRating
      summary: Rate a track for the caller.
      description: >-
        Gives the track the caller's stars, in place of any it had. An album's
        rating isn't stored: a client works it out from its tracks.
      parameters:
        - $ref: "#/components/parameters/KitsuneRequest"
        - $ref: "#/components/parameters/ItemID"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/Rating" }
      responses:
        "204":
          description: Done.
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          description: Credentials are missing, invalid or expired.
          headers:
            WWW-Authenticate:
              schema: { type: string }
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        "403":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
    delete:
      operationId: deleteRating
      summary: Clear the caller's rating of a track.
      description: >-
        Answers the same whether or not the track was rated, so a client can
        retry.
      parameters:
        - $ref: "#/components/parameters/KitsuneRequest"
        - $ref: "#/components/parameters/ItemID"
      responses:
        "204":
          description: Done.
        "401":
          description: Credentials are missing, invalid or expired.
          headers:
            WWW-Authenticate:
              schema: { type: string }
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        "403":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
  /me/listening:
    get:
      operationId: getListening
      summary: Count the caller's plays, hearts and rated tracks.
      responses:
        "200":
          description: The counts.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Listening" }
        "401":
          description: Credentials are missing, invalid or expired.
          headers:
            WWW-Authenticate:
              schema: { type: string }
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
  /me/password:
    post:
      operationId: changePassword
      summary: Change the caller's password.
      description: >-
        Needs the current password. A wrong one counts against the login rate
        limit, per client IP and per account. The new one follows the same
        rules as everywhere else: at least 8 characters, at most 1024 bytes.
        The session the request used stays signed in; the caller's others end.
      parameters:
        - $ref: "#/components/parameters/KitsuneRequest"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PasswordChange" }
      responses:
        "204":
          description: Changed, and the caller's other sessions ended.
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          description: Credentials are missing, invalid or expired.
          headers:
            WWW-Authenticate:
              schema: { type: string }
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        "403":
          description: >-
            The current password is wrong, or a cookie-authenticated request
            did not send X-Kitsune-Request.
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        "429":
          $ref: "#/components/responses/TooManyAttempts"
  /me/prefs/{key}:
    get:
      operationId: getPref
      summary: Return one of the caller's preferences.
      description: >-
        Preferences are the caller's own, such as the Library list's columns,
        and follow them from browser to browser. Server settings are never
        among them. A key the caller never set is a 404, as is an unknown key,
        and so is a value kept from before its key's rule changed: the client
        uses its defaults.
      parameters:
        - $ref: "#/components/parameters/PrefKey"
      responses:
        "200":
          description: The value, as its key's schema has it.
          headers:
            Cache-Control:
              schema: { type: string }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PrefValue" }
        "401":
          description: Credentials are missing, invalid or expired.
          headers:
            WWW-Authenticate:
              schema: { type: string }
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        "404":
          $ref: "#/components/responses/Problem"
    put:
      operationId: putPref
      summary: Set one of the caller's preferences.
      description: >-
        Replaces the value. Each key has its own schema, and a value that breaks
        it, or is over 4 KiB, is a 400. An unknown key is a 404.
      parameters:
        - $ref: "#/components/parameters/KitsuneRequest"
        - $ref: "#/components/parameters/PrefKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PrefValue" }
      responses:
        "204":
          description: Kept.
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          description: Credentials are missing, invalid or expired.
          headers:
            WWW-Authenticate:
              schema: { type: string }
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        "403":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
  /me/shuffle/rules:
    get:
      operationId: getShuffleRules
      summary: Return the caller's shuffle rules touching some songs.
      description: >-
        Shuffle rules are the caller's own, kept on the server and never in a
        file. A run is songs combined: they always play together in shuffle,
        in its order. An excluded song is one shuffle never picks. Every run
        holding one of the songs comes whole. Unknown songs are ignored.
      parameters:
        - name: tracks
          in: query
          required: true
          description: Track IDs joined by commas, from 1 to 1000.
          style: form
          explode: false
          schema:
            type: array
            minItems: 1
            items: { type: string }
      responses:
        "200":
          description: The runs and the excluded songs.
          headers:
            Cache-Control:
              schema: { type: string }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ShuffleRules" }
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          description: Credentials are missing, invalid or expired.
          headers:
            WWW-Authenticate:
              schema: { type: string }
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
  /me/shuffle/runs:
    put:
      operationId: putShuffleRun
      summary: Combine songs into one of the caller's runs, in order.
      description: >-
        The songs become one run, in the order given. A song already in
        another run leaves it, and a run left with fewer than two songs goes:
        a song is in at most one run, so a cycle can't be made. The run keeps
        the ID of the run its first song was in when that run has gone, so a
        reorder is the same run. Fewer than two songs, or one named twice, is
        a 400; an unknown song is a 404.
      parameters:
        - $ref: "#/components/parameters/KitsuneRequest"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ShuffleTracks" }
      responses:
        "200":
          description: The run.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ShuffleRun" }
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          description: Credentials are missing, invalid or expired.
          headers:
            WWW-Authenticate:
              schema: { type: string }
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        "404":
          $ref: "#/components/responses/Problem"
  /me/shuffle/runs/{id}:
    delete:
      operationId: deleteShuffleRun
      summary: Undo one of the caller's runs.
      description: The songs stay, each on its own. Another person's run is a 404.
      parameters:
        - $ref: "#/components/parameters/KitsuneRequest"
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "204":
          description: Undone.
        "401":
          description: Credentials are missing, invalid or expired.
          headers:
            WWW-Authenticate:
              schema: { type: string }
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        "404":
          $ref: "#/components/responses/Problem"
  /me/shuffle/excluded:
    put:
      operationId: putShuffleExcluded
      summary: Leave songs out of the caller's shuffle.
      description: >-
        Shuffle never picks them. They still play when chosen, when their album
        plays in order, and as part of a run. Excluding one again changes
        nothing. An unknown song is a 404, and nothing changes.
      parameters:
        - $ref: "#/components/parameters/KitsuneRequest"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ShuffleTracks" }
      responses:
        "204":
          description: Left out.
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          description: Credentials are missing, invalid or expired.
          headers:
            WWW-Authenticate:
              schema: { type: string }
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        "404":
          $ref: "#/components/responses/Problem"
    delete:
      operationId: deleteShuffleExcluded
      summary: Let songs back into the caller's shuffle.
      description: The undoing of `PUT`, as idempotent. An unknown song is a 404.
      parameters:
        - $ref: "#/components/parameters/KitsuneRequest"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ShuffleTracks" }
      responses:
        "204":
          description: Let back in.
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          description: Credentials are missing, invalid or expired.
          headers:
            WWW-Authenticate:
              schema: { type: string }
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        "404":
          $ref: "#/components/responses/Problem"
  /me/shuffles:
    post:
      operationId: postShuffle
      summary: Start a shuffle, and return its first page.
      description: >-
        A shuffle is a session the caller can continue on any device: by its
        `id`, `GET /me/shuffles/{id}/next` gives the page after any position it
        has reached. `finite` plays every unit once (a unit is a song, or a run
        of combined songs, which plays whole from its first song); `endless`
        goes on page by page, each worked out from what the caller's listening
        says by then. Songs excluded from shuffle are never picked, but a run
        holding one plays it. A run holding a song in scope plays whole, even
        into another album. `first` leads, even an excluded song: it is the
        song the client chose to start from, and may already be playing. An
        unknown `first` leads nothing. A scope with nothing to pick is a
        session with no picks. An unknown album or artist is a 404.
      parameters:
        - $ref: "#/components/parameters/KitsuneRequest"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ShuffleStart" }
      responses:
        "201":
          description: The session, with its first page.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ShufflePage" }
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          description: Credentials are missing, invalid or expired.
          headers:
            WWW-Authenticate:
              schema: { type: string }
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        "403":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
  /me/shuffles/{id}/next:
    get:
      operationId: getShuffleNext
      summary: Return a shuffle's page after a position.
      description: >-
        `after` is usually the last page's `to`, and then the shuffle moves on:
        an endless page is worked out now, from what the caller's listening
        says. A device that is behind gets what was given from `after` on,
        while the session keeps it (its last few pages); past that, the oldest
        it keeps, whose `from` says where it starts. A position the shuffle
        hasn't reached is a 400. Another person's shuffle is a 404.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
        - name: after
          in: query
          required: true
          schema: { type: integer, format: int64, minimum: 0 }
      responses:
        "200":
          description: The page.
          headers:
            Cache-Control:
              schema: { type: string }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ShufflePage" }
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          description: Credentials are missing, invalid or expired.
          headers:
            WWW-Authenticate:
              schema: { type: string }
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        "404":
          $ref: "#/components/responses/Problem"
  /me/lastfm:
    get:
      operationId: getLastfm
      summary: Report the caller's Last.fm connection.
      description: >-
        Whether the server has a Last.fm key, whether the caller is connected,
        what they send, and how the sending goes. The session key never leaves
        the server.
      responses:
        "200":
          description: The connection.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LastfmStatus" }
        "401":
          description: Credentials are missing, invalid or expired.
          headers:
            WWW-Authenticate:
              schema: { type: string }
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
    patch:
      operationId: patchLastfm
      summary: Change what the caller sends to Last.fm.
      description: >-
        A switch the body leaves out stays as it is. Turning one off sends
        nothing new of its kind; what already waits still goes.
      parameters:
        - $ref: "#/components/parameters/KitsuneRequest"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LastfmSwitches" }
      responses:
        "200":
          description: The connection, changed.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LastfmStatus" }
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          description: Credentials are missing, invalid or expired.
          headers:
            WWW-Authenticate:
              schema: { type: string }
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        "403":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
    delete:
      operationId: deleteLastfm
      summary: Disconnect the caller's Last.fm account.
      description: >-
        Forgets the session and everything waiting to be sent. Answers the same
        when there was nothing to disconnect.
      parameters:
        - $ref: "#/components/parameters/KitsuneRequest"
      responses:
        "204":
          description: Disconnected.
        "401":
          description: Credentials are missing, invalid or expired.
          headers:
            WWW-Authenticate:
              schema: { type: string }
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        "403":
          $ref: "#/components/responses/Problem"
  /me/lastfm/connect:
    post:
      operationId: connectLastfm
      summary: Start connecting the caller's Last.fm account.
      description: >-
        Returns the last.fm page to send the browser to, and sets the
        short-lived kitsune_lastfm_state cookie that the callback checks.
        Last.fm sends the browser back to GET /lastfm/callback.
      parameters:
        - $ref: "#/components/parameters/KitsuneRequest"
      responses:
        "200":
          description: Where to go.
          headers:
            Set-Cookie:
              schema: { type: string }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LastfmConnect" }
        "401":
          description: Credentials are missing, invalid or expired.
          headers:
            WWW-Authenticate:
              schema: { type: string }
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        "403":
          $ref: "#/components/responses/Problem"
        "409":
          description: The server has no Last.fm key.
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
  /lastfm/callback:
    get:
      operationId: lastfmCallback
      summary: Finish connecting a Last.fm account.
      description: >-
        Where last.fm sends the browser back. It needs the session cookie and
        the state cookie from POST /me/lastfm/connect, which must match `state`
        and belong to the same user. It always redirects to the You page, with
        `lastfm` set to `connected`, `refused` or `failed`, and never answers
        with a page.
      security: []
      parameters:
        - name: token
          in: query
          required: false
          description: Last.fm's one-time token; absent when the user said no.
          schema: { type: string }
        - name: state
          in: query
          required: false
          schema: { type: string }
        - name: kitsune_lastfm_state
          in: cookie
          required: false
          description: The value POST /me/lastfm/connect set; it must match `state`.
          schema: { type: string }
      responses:
        "303":
          description: Back to the You page.
          headers:
            Location:
              required: true
              schema: { type: string }
            Set-Cookie:
              description: Clears the state cookie.
              schema: { type: string }
  /me/now-playing:
    post:
      operationId: postNowPlaying
      summary: Say that the caller started a track.
      description: >-
        Tells Last.fm in the background, when the caller is connected and
        shows what's playing. Best effort: nothing is retried, and it answers
        the same whatever happens.
      parameters:
        - $ref: "#/components/parameters/KitsuneRequest"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/NowPlaying" }
      responses:
        "204":
          description: Noted.
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          description: Credentials are missing, invalid or expired.
          headers:
            WWW-Authenticate:
              schema: { type: string }
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        "403":
          $ref: "#/components/responses/Problem"
  /events:
    get:
      operationId: getEvents
      summary: Hear every change, as server-sent events.
      description: >-
        One stream per client, open for as long as it likes. Each event's
        `event:` is its kind and its `data:` one line of JSON; events carry ids
        and versions, never whole objects, and a client fetches what it needs
        through the other routes. Who hears what: `library`
        (`EventLibrary`), `scan` (`ScanStatus`, with the failure's reason for
        administrators only) and `ready`/`resync` (`EventStream`) go to
        everyone; `fingerprints` (`FingerprintStatus`), `loudness`
        (`LoudnessStatus`) and `settings` (`EventSettings`) to administrators; `marks` (`EventMarks`), `prefs`
        (`EventPrefs`), `shuffle-rules` (`EventShuffleRules`), `shuffle`
        (`EventShuffle`), `listening`
        (`EventListening`) and `lastfm` (`EventLastfm`) to the person they are
        about, on every device. The stream opens with `ready`, whose id is
        where it stands. Sent back as `Last-Event-ID`, an id gets what was
        missed since, while the server still has it (5 minutes, or 10,000
        events); otherwise the stream opens with `resync` instead, and the
        client fetches everything again. A client too slow to keep up is
        dropped. A comment line every 25 s keeps proxies from closing it.
      parameters:
        - name: Last-Event-ID
          in: header
          required: false
          description: The id of the last event taken, to resume after it.
          schema: { type: string }
      responses:
        "200":
          description: The stream, until the client or the server ends it.
          headers:
            Cache-Control:
              schema: { type: string, const: no-store }
            X-Accel-Buffering:
              description: "`no`: a proxy must pass each event on at once."
              schema: { type: string, const: "no" }
          content:
            text/event-stream:
              schema: { type: string }
        "401":
          description: Credentials are missing, invalid or expired.
          headers:
            WWW-Authenticate:
              schema: { type: string }
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
  /artwork/{hash}:
    get:
      operationId: getArtwork
      summary: Return a cover rendition.
      description: >-
        Covers are rendered during library scans at three sizes, so this reads
        a file. The hash names the source image, which never changes under it:
        the response is cached for a year and marked immutable. A `size` the
        image has no rendition for gets the largest rendition at or below it,
        or the smallest there is. The image is never upscaled, so a small
        source is returned at its own size. Range requests are not supported.
      parameters:
        - name: hash
          in: path
          required: true
          description: SHA-256 of the source image, as 64 lowercase hex digits.
          schema: { type: string, pattern: "^[0-9a-f]{64}$" }
        - name: size
          in: query
          required: false
          description: Longest side in pixels.
          schema: { type: integer, enum: [128, 512, 1024], default: 512 }
        - name: If-None-Match
          in: header
          required: false
          schema: { type: string }
      responses:
        "200":
          description: The cover, as JPEG.
          headers:
            ETag:
              schema: { type: string }
            Cache-Control:
              schema: { type: string }
          content:
            image/jpeg:
              schema: { type: string, format: binary }
        "304":
          description: The client's copy is current.
          headers:
            ETag:
              schema: { type: string }
            Cache-Control:
              schema: { type: string }
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          description: Credentials are missing, invalid or expired.
          headers:
            WWW-Authenticate:
              schema: { type: string }
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        "404":
          $ref: "#/components/responses/Problem"
  /albums:
    get:
      operationId: getAlbums
      summary: List albums, a page at a time.
      description: >-
        Albums with at least one live track. Paging is by keyset: pass the
        previous page's `nextCursor` as `cursor`. A cursor is opaque and belongs
        to the `sort` that issued it. The `name` sort ignores case and breaks
        ties by the album's internal ID.
      parameters:
        - name: sort
          in: query
          required: false
          description: "`added` lists the newest albums first; `name` sorts by sort name."
          schema: { type: string, enum: [added, name], default: added }
        - name: limit
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 200, default: 60 }
        - name: cursor
          in: query
          required: false
          schema: { type: string }
      responses:
        "200":
          description: A page of albums.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AlbumPage" }
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          description: Credentials are missing, invalid or expired.
          headers:
            WWW-Authenticate:
              schema: { type: string }
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
  /albums/{id}:
    get:
      operationId: getAlbum
      summary: Return an album and its tracks.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: The album.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AlbumDetail" }
        "401":
          description: Credentials are missing, invalid or expired.
          headers:
            WWW-Authenticate:
              schema: { type: string }
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        "404":
          $ref: "#/components/responses/Problem"
  /albums/{id}/tags:
    get:
      operationId: getAlbumTags
      summary: Return every tag of an album, for a tag editor.
      description: >-
        For administrators. Read from the files, not the library, so it shows
        what an edit will change. Field values never name a format's keys.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: The tags of each live track, in album order.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AlbumTags" }
        "401":
          description: Credentials are missing, invalid or expired.
          headers:
            WWW-Authenticate:
              schema: { type: string }
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        "403":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "409":
          description: A file is gone, and a scan has yet to notice.
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
  /albums/{id}/edits:
    post:
      operationId: postAlbumEdit
      summary: Edit the tags of an album's tracks, in their files.
      description: >-
        For administrators, on a server with `library.tag_writes` on: anything
        else is a 403. Files are checked first, then written in track order.
        Each is atomic and the album is not, so a failure partway is reported
        with `changed` and `remaining`: read the tags again and send the same
        edit to finish it. A client that goes away doesn't stop the edit. An
        edit during a scan is a 409 for as long as the scan runs.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
        - name: If-Match
          in: header
          required: false
          description: >-
            The `etag` from the last read or edit, verbatim. A missing one, or
            `*`, is a 428.
          schema: { type: string }
        - $ref: "#/components/parameters/KitsuneRequest"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AlbumEdit" }
      responses:
        "200":
          description: >-
            The album with its new values and ETag. An edit that moved every
            track to another album answers with that album, whose `id` the
            client follows: the old one is gone, merged into it.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AlbumDetail" }
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          description: Credentials are missing, invalid or expired.
          headers:
            WWW-Authenticate:
              schema: { type: string }
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        "403":
          $ref: "#/components/responses/EditFailure"
        "404":
          $ref: "#/components/responses/Problem"
        "409":
          description: A scan or another edit holds the library.
          headers:
            Retry-After:
              description: Seconds to wait before trying again.
              schema: { type: integer }
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        "412":
          $ref: "#/components/responses/EditFailure"
        "422":
          $ref: "#/components/responses/EditFailure"
        "428":
          $ref: "#/components/responses/Problem"
        "500":
          $ref: "#/components/responses/EditFailure"
  /albums/{id}/matches:
    post:
      operationId: postAlbumMatches
      summary: Find the releases an album may be, on MusicBrainz.
      description: >-
        For administrators. Proposes only: nothing is written. Asks for the
        album's own title and album artist, or for the terms in the body, and
        always for the releases its files already name. Each candidate has a
        confidence from 0 to 100 and the evidence it rests on, as facts for the
        client to word. MusicBrainz takes a request a second, so a first ask
        can take seconds; answers are kept for a day. `prefetch` marks work done
        ahead, such as the queue asking for the next albums: it waits behind
        anything a person is waiting on.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
        - $ref: "#/components/parameters/KitsuneRequest"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MatchRequest" }
      responses:
        "200":
          description: The candidates, best first. None is not a failure.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MatchList" }
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          description: Credentials are missing, invalid or expired.
          headers:
            WWW-Authenticate:
              schema: { type: string }
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        "403":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "503":
          description: >-
            MusicBrainz can't be reached, or stayed busy, or matching isn't
            set up here.
          headers:
            Retry-After:
              description: Seconds to wait before trying again.
              schema: { type: integer }
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
  /matches/{id}:
    get:
      operationId: getMatch
      summary: Look at one candidate closely, against its album.
      description: >-
        For administrators. The release's values as fields, what every track
        would take, and which release track each album track pairs with.
        Fields the release has nothing for are left out: matching never
        proposes taking a value away. `albumIds` and each track's `ids` are the
        MusicBrainz IDs, which a client writes with whatever is accepted.
        Applying is `POST /albums/{id}/edits`.
      parameters:
        - name: id
          in: path
          required: true
          description: A candidate's `id`, from `POST /albums/{id}/matches`.
          schema: { type: string }
      responses:
        "200":
          description: The candidate, closely.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MatchReview" }
        "401":
          description: Credentials are missing, invalid or expired.
          headers:
            WWW-Authenticate:
              schema: { type: string }
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        "403":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "503":
          description: >-
            MusicBrainz can't be reached, or stayed busy, or matching isn't
            set up here.
          headers:
            Retry-After:
              description: Seconds to wait before trying again.
              schema: { type: integer }
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
  /matching/queue:
    get:
      operationId: getMatchingQueue
      summary: List the albums to match.
      description: >-
        For administrators. Every album with live songs and no MusicBrainz
        release ID is to do, unless it was skipped; albums matched here stay,
        as matched. In sort order.
      responses:
        "200":
          description: The queue.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MatchQueue" }
        "401":
          description: Credentials are missing, invalid or expired.
          headers:
            WWW-Authenticate:
              schema: { type: string }
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        "403":
          $ref: "#/components/responses/Problem"
  /matching/albums/{id}:
    put:
      operationId: putMatchingAlbum
      summary: Say where an album stands in the matching queue.
      description: >-
        For administrators. `skipped` sets it aside, `matched` records it as
        matched here, and `todo` forgets either.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
        - $ref: "#/components/parameters/KitsuneRequest"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MatchStateChange" }
      responses:
        "204":
          description: Saved.
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          description: Credentials are missing, invalid or expired.
          headers:
            WWW-Authenticate:
              schema: { type: string }
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        "403":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
  /edits:
    post:
      operationId: postEdits
      summary: Edit the tags of tracks that may lie on several albums, in their files.
      description: >-
        For administrators, on a server with `library.tag_writes` on: anything
        else is a 403. A selection's edit: `albums` gives the `etag` of every
        album the tracks are on, as read, and every one is compared, and every
        file checked, before any is written. A stale one is a 412 naming it,
        with nothing written. Then files are written album by album, in the
        order `albums` names them, and each album's in track order. Each is
        atomic and the edit is not, so a failure partway is reported with
        `changed` and `remaining`: read the albums again and send the same edit
        to finish it. Giving tracks another album or album artist moves them,
        keeping their IDs, plays, hearts and ratings, and an album they all
        leave for one other merges into it. A client that goes away doesn't
        stop the edit. An edit during a scan is a 409.
      parameters:
        - $ref: "#/components/parameters/KitsuneRequest"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TracksEdit" }
      responses:
        "200":
          description: Each track and the album it is on now.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EditedTracks" }
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          description: Credentials are missing, invalid or expired.
          headers:
            WWW-Authenticate:
              schema: { type: string }
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        "403":
          $ref: "#/components/responses/EditFailure"
        "404":
          $ref: "#/components/responses/Problem"
        "409":
          description: A scan or another edit holds the library.
          headers:
            Retry-After:
              description: Seconds to wait before trying again.
              schema: { type: integer }
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        "412":
          $ref: "#/components/responses/EditFailure"
        "422":
          $ref: "#/components/responses/EditFailure"
        "500":
          $ref: "#/components/responses/EditFailure"
  /artists:
    get:
      operationId: getArtists
      summary: List the artists who own an album, whole.
      description: >-
        An album belongs to its album artists; with none, to the first artist of
        its tracks, unless it is a compilation. Sorted by sort name, ignoring
        case, then ID: a client orders its copy as it likes. Various Artists is
        never listed. Guests are found through search and links.
      responses:
        "200":
          description: The artists.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ArtistList" }
        "401":
          description: Credentials are missing, invalid or expired.
          headers:
            WWW-Authenticate:
              schema: { type: string }
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
  /artists/{id}:
    get:
      operationId: getArtist
      summary: Return an artist and its albums.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: The artist.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ArtistDetail" }
        "401":
          description: Credentials are missing, invalid or expired.
          headers:
            WWW-Authenticate:
              schema: { type: string }
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        "404":
          $ref: "#/components/responses/Problem"
  /admin/library/scan:
    post:
      operationId: postScan
      summary: Start a scan.
      description: >-
        For administrators. The scan is claimed before this answers, so a 202
        means it is running, and a 409 means another one is. It runs on after the
        response: `GET /library` follows it. A Quick scan reads new and changed
        files, a Full one every file. Neither changes a file.
      parameters:
        - $ref: "#/components/parameters/KitsuneRequest"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ScanRequest" }
      responses:
        "202":
          description: The scan has started.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ScanStatus" }
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          description: Credentials are missing, invalid or expired.
          headers:
            WWW-Authenticate:
              schema: { type: string }
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        "403":
          $ref: "#/components/responses/Problem"
        "409":
          $ref: "#/components/responses/Problem"
        "503":
          $ref: "#/components/responses/Problem"
  /admin/library/issues:
    get:
      operationId: getIssues
      summary: List what scans had trouble with.
      description: >-
        For administrators: `GET /library` gives everyone the counts. Paths are
        relative to their library root, and messages hold no root. A Full scan
        does not clear an issue: a file stays listed until it is readable or
        gone.
      responses:
        "200":
          description: Files that could not be read and tracks read with warnings.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ScanIssues" }
        "401":
          description: Credentials are missing, invalid or expired.
          headers:
            WWW-Authenticate:
              schema: { type: string }
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        "403":
          $ref: "#/components/responses/Problem"
  /admin/users:
    get:
      operationId: getUsers
      summary: List every account.
      description: >-
        For administrators, by name. Each says when its newest live session was
        last used and how many are live; neither ever carries a token.
      responses:
        "200":
          description: Every account.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Accounts" }
        "401":
          description: Credentials are missing, invalid or expired.
          headers:
            WWW-Authenticate:
              schema: { type: string }
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        "403":
          $ref: "#/components/responses/Problem"
  /admin/users/{id}/password:
    post:
      operationId: setUserPassword
      summary: Set someone's password.
      description: >-
        For administrators, for anyone but themselves: their own changes
        through `POST /me/password`, which asks for the current one. Every
        session of the person ends.
      parameters:
        - $ref: "#/components/parameters/KitsuneRequest"
        - name: id
          in: path
          required: true
          description: The user's ID.
          schema: { type: integer, format: int64 }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PasswordSet" }
      responses:
        "204":
          description: Set, and the person's sessions ended.
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          description: Credentials are missing, invalid or expired.
          headers:
            WWW-Authenticate:
              schema: { type: string }
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        "403":
          description: >-
            Not an administrator, the caller's own account, or a
            cookie-authenticated request without X-Kitsune-Request.
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        "404":
          $ref: "#/components/responses/Problem"
  /admin/settings:
    get:
      operationId: getSettings
      summary: Read the server's settings.
      description: >-
        For administrators. Settings live in the database: server.toml, the
        environment and flags only fill a setting that has no value yet, so
        each one says where its value came from. A secret never carries its
        value, only whether it is set.
      responses:
        "200":
          description: Every setting.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ServerSettings" }
        "401":
          description: Credentials are missing, invalid or expired.
          headers:
            WWW-Authenticate:
              schema: { type: string }
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        "403":
          $ref: "#/components/responses/Problem"
    patch:
      operationId: patchSettings
      summary: Change some of the server's settings.
      description: >-
        For administrators. The body names only the settings that change. Every
        value is checked before any is stored, and all are stored together: a
        400 names the first key refused, and changes nothing. A change applies
        at once, except where a setting says it waits for a restart. A null, or
        an empty string or list for a setting that can be empty, clears it: it
        takes its default, and the next start fills it from server.toml, the
        environment or a flag again.
      parameters:
        - $ref: "#/components/parameters/KitsuneRequest"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SettingsChange" }
      responses:
        "200":
          description: Every setting, changed.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ServerSettings" }
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          description: Credentials are missing, invalid or expired.
          headers:
            WWW-Authenticate:
              schema: { type: string }
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        "403":
          $ref: "#/components/responses/Problem"
  /admin/folders:
    get:
      operationId: getFolders
      summary: List the folders the server can see, for the folder picker.
      description: >-
        For administrators. Directories only, never a file name or size: the
        folders in `path`, and how much audio `path` holds, counted as a scan
        would find it and for at most a second or two. Read from / through a
        root that neither `..` nor a symlink can leave. Under Docker these are
        the container's paths. Kitsune's own data and config folders, and the
        library's, are listed with a kind that says they can't be added.
      parameters:
        - name: path
          in: query
          required: false
          description: An absolute path; / when absent.
          schema: { type: string }
      responses:
        "200":
          description: The folders in path.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FolderListing" }
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          description: Credentials are missing, invalid or expired.
          headers:
            WWW-Authenticate:
              schema: { type: string }
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        "403":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
  /library:
    get:
      operationId: getLibrary
      summary: Report what the library holds.
      description: >-
        Counts live tracks and albums that have a live track. `scan` says where
        scanning stands, so a client can poll this while a scan runs; the
        counts themselves move little until it ends. `fingerprints` says
        where the background fingerprint pass stands, and `loudness` where the
        loudness pass does, with how many songs without ReplayGain it has
        measured.
      responses:
        "200":
          description: The library's counts.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LibraryFacts" }
        "401":
          description: Credentials are missing, invalid or expired.
          headers:
            WWW-Authenticate:
              schema: { type: string }
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
  /library/index:
    get:
      operationId: getLibraryIndex
      summary: List every song in the library, by artist and album.
      description: >-
        The whole library in one response, for a client that needs every row's
        height: the one browse list that doesn't page. Artists come by sort name,
        those not under a letter from A to Z first, and each artist's albums
        newest first. An album appears once, under its first owner. An album with
        no owner a reader shows, such as a compilation, groups under the artist
        it displays, in a group with no `id`. Artists, albums and tracks carry
        the caller's own hearts, and tracks the caller's stars. The response is
        gzipped when `Accept-Encoding` allows it. `fields` adds to each track
        what song columns show; without it the response is as it has always
        been.
      parameters:
        - name: fields
          in: query
          required: false
          description: >-
            What else each track carries, joined by commas: `albumArtist`
            (`albumArtists`), `genre` (`displayGenres`, spelled as albums'
            are), `year`, `composer` (`composers`), `format` (`format`,
            `sampleRate`, `bitDepth` and `bitrate`), `bitrate`, `added`
            (`addedAt`), `gain` (`trackGain` and `trackGainSource`: the tags'
            gain, or for a file with none Kitsune's measure of it), and the
            caller's own `plays`, `lastPlayed` (`lastPlayedAt`) and `shuffle`
            rules. An unknown name is a 400.
          style: form
          explode: false
          schema:
            type: array
            items:
              type: string
              enum: [albumArtist, genre, year, composer, format, bitrate, added, plays, lastPlayed, gain, shuffle]
        - name: albums
          in: query
          required: false
          description: >-
            Only these albums, by id, joined by commas: what a `library` event
            names. Each that still has a song comes in the index's shape, under
            its heading, with `after` saying where it goes; one that doesn't is
            gone from the index. At most 500; more is a 400.
          style: form
          explode: false
          schema:
            type: array
            maxItems: 500
            items: { type: string }
      responses:
        "200":
          description: Every artist with an album, its albums and their tracks.
          headers:
            Vary:
              schema: { type: string }
            Content-Encoding:
              description: "`gzip`, when the response is compressed."
              schema: { type: string }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LibraryIndex" }
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          description: Credentials are missing, invalid or expired.
          headers:
            WWW-Authenticate:
              schema: { type: string }
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
  /search:
    get:
      operationId: getSearch
      summary: Find artists, albums and tracks.
      description: >-
        Each group is capped and ordered best first: the whole name, then names
        that start with the query, then names with its words, then the rest. A
        query is cut to 256 bytes and 16 words. One with no letter or digit
        finds nothing.
      parameters:
        - name: q
          in: query
          required: false
          schema: { type: string }
      responses:
        "200":
          description: What the query found.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SearchResults" }
        "401":
          description: Credentials are missing, invalid or expired.
          headers:
            WWW-Authenticate:
              schema: { type: string }
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
  /tracks/{id}:
    get:
      operationId: getTrack
      summary: Return a track and the ETags to edit it with.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: The track.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TrackDetail" }
        "401":
          description: Credentials are missing, invalid or expired.
          headers:
            WWW-Authenticate:
              schema: { type: string }
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        "404":
          $ref: "#/components/responses/Problem"
  /tracks/{id}/stream:
    get:
      operationId: getTrackStream
      summary: Stream a track's original file.
      description: >-
        Serves the file as it is on disk, with no transcoding, and supports
        single and multiple byte ranges. The ETag comes from the file's size
        and modification time, so a client must revalidate what it keeps. There
        is no Last-Modified: `If-Range` matches an ETag only, and a date in it
        gets the whole file. A retag that keeps both the size and the
        modification time keeps the ETag too. A track that is missing, or whose
        file has left the disk, is a 404.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
        - name: Range
          in: header
          required: false
          description: One or more byte ranges, such as `bytes=0-1023`.
          schema: { type: string }
        - name: If-Range
          in: header
          required: false
          description: An ETag. The range is honored only if it is current.
          schema: { type: string }
        - name: If-None-Match
          in: header
          required: false
          schema: { type: string }
      responses:
        "200":
          description: The whole file.
          headers:
            Accept-Ranges:
              schema: { type: string }
            ETag:
              schema: { type: string }
            Cache-Control:
              schema: { type: string }
          content:
            audio/*:
              schema: { type: string, format: binary }
            application/octet-stream:
              schema: { type: string, format: binary }
        "206":
          description: >-
            The requested range. Several ranges come as `multipart/byteranges`,
            each part with its own `Content-Range`.
          headers:
            Accept-Ranges:
              schema: { type: string }
            Content-Range:
              description: Absent from a multipart response.
              schema: { type: string }
            ETag:
              schema: { type: string }
            Cache-Control:
              schema: { type: string }
          content:
            audio/*:
              schema: { type: string, format: binary }
            application/octet-stream:
              schema: { type: string, format: binary }
            multipart/byteranges:
              schema: { type: string, format: binary }
        "304":
          description: The client's copy is current.
          headers:
            ETag:
              schema: { type: string }
            Cache-Control:
              schema: { type: string }
        "401":
          description: Credentials are missing, invalid or expired.
          headers:
            WWW-Authenticate:
              schema: { type: string }
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        "404":
          $ref: "#/components/responses/Problem"
        "416":
          description: >-
            The range can't be satisfied. `Content-Range` gives the file's size
            as `bytes */N`, unless the range was malformed.
          headers:
            Content-Range:
              schema: { type: string }
            X-Content-Type-Options:
              schema: { type: string }
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
components:
  securitySchemes:
    bearer:
      type: http
      scheme: bearer
    cookie:
      type: apiKey
      in: cookie
      name: kitsune_session
  parameters:
    KitsuneRequest:
      name: X-Kitsune-Request
      in: header
      required: false
      description: >-
        Must be `1` on cookie-authenticated requests that change state, so a
        cross-site form cannot forge them.
      schema: { type: string, enum: ["1"] }
    HeartKind:
      name: kind
      in: path
      required: true
      description: What the heart is on.
      schema: { type: string, enum: [tracks, albums, artists] }
    PrefKey:
      name: key
      in: path
      required: true
      description: >-
        The preference: `library.columns`, `ui.theme`, `shuffle.ratings`,
        `shuffle.flow`, `shuffle.memory`, `library.sort`, `albums.sort`,
        `artists.sort` or `playback.untagged_gain`. The server knows which keys
        there are.
      schema: { type: string }
    ItemID:
      name: id
      in: path
      required: true
      description: The item's ID.
      schema: { type: string }
  responses:
    Problem:
      description: An RFC 9457 problem.
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
    TooManyAttempts:
      description: Too many failed attempts; wait before trying again.
      headers:
        Retry-After:
          description: Seconds to wait before trying again.
          schema: { type: integer }
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
    EditFailure:
      description: >-
        An RFC 9457 problem. When a tag edit was refused or stopped, it says
        which tracks hold the edit.
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/EditProblem" }
  schemas:
    Problem:
      type: object
      required: [type, title, status]
      properties:
        type: { type: string, format: uri-reference }
        title: { type: string }
        status: { type: integer }
        detail: { type: string }
        requestId: { type: string }
    EditProblem:
      type: object
      required: [type, title, status]
      properties:
        type: { type: string, format: uri-reference }
        title: { type: string }
        status: { type: integer }
        detail: { type: string }
        requestId: { type: string }
        changed:
          type: array
          description: Tracks that hold the edit.
          items: { type: string }
        remaining:
          type: array
          description: Tracks that don't. The first is the one that failed.
          items: { type: string }
        album:
          type: string
          description: On a 412 from `POST /edits`, the album whose `etag` is stale.
    User:
      type: object
      additionalProperties: false
      required: [id, name, role, createdAt]
      properties:
        id: { type: integer, format: int64 }
        name: { type: string }
        role: { type: string, enum: [admin, user] }
        createdAt: { type: string, format: date-time }
    Me:
      description: A user's properties, repeated (allOf does not mix with additionalProperties false), plus what the user may do.
      type: object
      additionalProperties: false
      required: [id, name, role, createdAt, canEditTags]
      properties:
        id: { type: integer, format: int64 }
        name: { type: string }
        role: { type: string, enum: [admin, user] }
        createdAt: { type: string, format: date-time }
        canEditTags:
          type: boolean
          description: True for an administrator on a server with `library.tag_writes` on.
    ListenReport:
      type: object
      additionalProperties: false
      required: [clientId, trackId, startedAt]
      properties:
        clientId:
          type: string
          minLength: 1
          maxLength: 64
          description: The client's own ID for this listen, shared by its start and its end.
        trackId: { type: string, minLength: 1 }
        startedAt:
          type: string
          format: date-time
          description: When the listen started, by the client's clock.
        shuffle:
          type: string
          minLength: 1
          maxLength: 64
          description: >-
            The shuffle it plays in: the session's ID from `POST /me/shuffles`,
            or the client's own while that is on its way, which the end then
            replaces. Absent outside a shuffle.
        ended:
          type: string
          enum: [completed, skipped, stopped, interrupted]
          description: How it ended. Absent on a start.
        listenedMs:
          type: integer
          format: int64
          minimum: 0
          description: How much of the song played, in milliseconds.
    PlayReport:
      type: object
      additionalProperties: false
      required: [trackId, playedAt, source, clientId]
      properties:
        trackId: { type: string, minLength: 1 }
        playedAt:
          type: string
          format: date-time
          description: When the listen started, by the client's clock.
        source:
          type: string
          minLength: 1
          maxLength: 64
          description: The client's name.
        clientId:
          type: string
          minLength: 1
          maxLength: 64
          description: The client's own ID for this listen.
    Rating:
      type: object
      additionalProperties: false
      required: [stars]
      properties:
        stars: { type: integer, minimum: 1, maximum: 5 }
    Listening:
      type: object
      additionalProperties: false
      required: [plays, hearts, rated]
      properties:
        plays:
          type: integer
          minimum: 0
          description: Plays that counted.
        hearts:
          type: integer
          minimum: 0
          description: Hearts on tracks, albums and artists.
        rated:
          type: integer
          minimum: 0
          description: Tracks with stars.
    LastfmStatus:
      type: object
      additionalProperties: false
      required: [configured, connected, scrobble, nowPlaying, loves, state, waiting]
      properties:
        configured:
          type: boolean
          description: False when the server has no Last.fm key.
        connected: { type: boolean }
        name:
          type: string
          description: The Last.fm user name, when connected.
        scrobble: { type: boolean }
        nowPlaying: { type: boolean }
        loves: { type: boolean }
        state:
          type: string
          enum: [ok, waiting, reconnect]
          description: >-
            `waiting` while Last.fm isn't answering and the outbox waits for
            `retryAt`; `reconnect` when Last.fm rejected the session.
        waiting:
          type: integer
          minimum: 0
          description: Plays the server holds for Last.fm.
        lastSentAt: { type: string, format: date-time }
        retryAt: { type: string, format: date-time }
    LastfmSwitches:
      type: object
      additionalProperties: false
      properties:
        scrobble: { type: boolean }
        nowPlaying: { type: boolean }
        loves: { type: boolean }
    LastfmConnect:
      type: object
      additionalProperties: false
      required: [url]
      properties:
        url: { type: string, format: uri }
    NowPlaying:
      type: object
      additionalProperties: false
      required: [trackId]
      properties:
        trackId: { type: string, minLength: 1 }
        clientId:
          type: string
          minLength: 1
          maxLength: 64
          description: The device playing, as plays name it. The caller's other devices hear it in `listening`.
    EventStream:
      type: object
      additionalProperties: false
      description: "`ready` or `resync`: nothing but its id."
    EventLibrary:
      type: object
      additionalProperties: false
      description: >-
        Albums added, changed or gone from the index, by id, which `GET
        /library/index?albums=` reads. `all` says too many changed to list:
        read the index again.
      required: [albums, all]
      properties:
        albums: { type: array, items: { type: string } }
        all: { type: boolean }
    EventMarks:
      type: object
      additionalProperties: false
      description: >-
        A heart or a rating the person changed on any device. `hearted` comes
        with a heart; `stars` with a rating, 0 for none.
      required: [kind, id]
      properties:
        kind: { type: string, enum: [tracks, albums, artists] }
        id: { type: string }
        hearted: { type: boolean }
        stars: { type: integer, minimum: 0, maximum: 5 }
    EventPrefs:
      type: object
      additionalProperties: false
      description: "The preference that changed; `GET /me/prefs/{key}` reads it."
      required: [key]
      properties:
        key: { type: string }
    EventShuffleRules:
      type: object
      additionalProperties: false
      description: The person's shuffle rules changed.
    EventShuffle:
      type: object
      additionalProperties: false
      description: "One of the person's shuffles moved on, on one of their devices; `GET /me/shuffles/{id}/next` reads it."
      required: [id, to]
      properties:
        id: { type: string }
        to: { type: integer, format: int64 }
    EventListening:
      type: object
      additionalProperties: false
      description: A device of the person's started a track.
      required: [trackId]
      properties:
        trackId: { type: string }
        clientId: { type: string }
    EventLastfm:
      type: object
      additionalProperties: false
      description: "The person's Last.fm connection or outbox changed; `GET /me/lastfm` reads it."
    EventSettings:
      type: object
      additionalProperties: false
      description: >-
        Server settings changed, by key, never with a value; `library.roots`
        also when a folder's watch changes. `GET /admin/settings` reads them.
      required: [keys]
      properties:
        keys: { type: array, items: { type: string } }
    LoginRequest:
      type: object
      additionalProperties: false
      required: [name, password]
      properties:
        name: { type: string, minLength: 1 }
        password: { type: string, minLength: 1 }
        cookie: { type: boolean, default: false }
    PasswordChange:
      type: object
      additionalProperties: false
      required: [current, new]
      properties:
        current: { type: string, minLength: 1 }
        new: { type: string, minLength: 1 }
    ResetRequest:
      type: object
      additionalProperties: false
      required: [name]
      properties:
        name: { type: string, minLength: 1 }
    ResetConfirm:
      type: object
      additionalProperties: false
      required: [name, code, new]
      properties:
        name: { type: string, minLength: 1 }
        code:
          type: string
          minLength: 1
          description: The reset code from the server's log, in any case, with or without its dashes.
        new: { type: string, minLength: 1 }
        cookie: { type: boolean, default: false }
    PasswordSet:
      type: object
      additionalProperties: false
      required: [new]
      properties:
        new: { type: string, minLength: 1 }
    Accounts:
      type: object
      additionalProperties: false
      required: [users]
      properties:
        users:
          type: array
          items: { $ref: "#/components/schemas/Account" }
    Account:
      type: object
      additionalProperties: false
      required: [user, sessions]
      properties:
        user: { $ref: "#/components/schemas/User" }
        lastSeen:
          type: string
          format: date-time
          description: When the newest live session was last used; absent with none.
        sessions: { type: integer, minimum: 0, description: Live sessions. }
    SetupStatus:
      type: object
      additionalProperties: false
      required: [needed, codeRequired]
      properties:
        needed: { type: boolean }
        codeRequired: { type: boolean }
    SetupRequest:
      type: object
      additionalProperties: false
      required: [name, password]
      properties:
        name: { type: string, minLength: 1 }
        password: { type: string, minLength: 1 }
        code:
          type: string
          description: The setup code from the server's log; needed only from outside its network.
    Session:
      type: object
      additionalProperties: false
      required: [expiresAt, user]
      properties:
        token:
          type: string
          description: Present only when the login did not ask for a cookie.
        expiresAt: { type: string, format: date-time }
        user: { $ref: "#/components/schemas/User" }
    Artwork:
      type: object
      additionalProperties: false
      required: [hash, accent, ground, width, height]
      properties:
        hash:
          type: string
          pattern: "^[0-9a-f]{64}$"
          description: Names the cover for `GET /artwork/{hash}`.
        accent: { type: string, pattern: "^#[0-9a-f]{6}$" }
        ground: { type: string, pattern: "^#[0-9a-f]{6}$" }
        width: { type: integer, description: Of the source image. }
        height: { type: integer, description: Of the source image. }
    AlbumEntry:
      type: object
      additionalProperties: false
      required: [id, title, sortName, artist, trackCount, compilation, addedAt, displayGenres]
      properties:
        id: { type: string }
        title: { type: string }
        sortName:
          type: string
          description: The title as the album sorts, from its sort tag, else the title itself.
        artist: { type: string }
        sortArtist:
          type: string
          description: >-
            Who the album sorts under: its first owner's sort name, else
            `artist`. Only `GET /albums` sends it.
        year: { type: integer }
        trackCount: { type: integer }
        compilation: { type: boolean }
        artwork: { $ref: "#/components/schemas/Artwork" }
        addedAt: { type: string, format: date-time }
        displayGenres:
          type: array
          description: >-
            What genres the album shows and filters by: split, cleaned and
            spelled one way across the library. The most used on it come first.
          items: { type: string }
    AlbumPage:
      type: object
      additionalProperties: false
      required: [albums]
      properties:
        albums:
          type: array
          items: { $ref: "#/components/schemas/AlbumEntry" }
        nextCursor:
          type: string
          description: Absent on the last page.
    ReplayGain:
      type: object
      additionalProperties: false
      description: >-
        Gains in dB to the ReplayGain 2.0 reference of -18 LUFS, and peaks
        linear, 1 being full scale; an absent value is unknown. `source` says
        where they come from: the file's tags, or, for a file with no gain
        tagged, Kitsune's own measure of it (EBU R 128, true peaks), which is
        never written to the file.
      required: [source]
      properties:
        trackGain: { type: number }
        albumGain: { type: number }
        trackPeak: { type: number }
        albumPeak: { type: number }
        source: { type: string, enum: [tags, measured] }
    Track:
      type: object
      additionalProperties: false
      required: [id, title, artists, durationMs, format, genres, etag, hearted]
      properties:
        id: { type: string }
        title: { type: string }
        artists:
          type: array
          items: { type: string }
        discNo: { type: integer }
        trackNo: { type: integer }
        durationMs: { type: integer, format: int64 }
        format: { type: string }
        sampleRate: { type: integer }
        bitDepth: { type: integer }
        replayGain: { $ref: "#/components/schemas/ReplayGain" }
        trackTotal: { type: integer }
        discTotal: { type: integer }
        discSubtitle:
          type: string
          description: The disc's name as this track is tagged; absent when untagged.
        year: { type: integer }
        genres:
          type: array
          items: { type: string }
        etag:
          type: string
          description: Changes when the file does. Not the stream's ETag.
        hearted:
          type: boolean
          description: Whether the caller has hearted it.
        stars:
          type: integer
          minimum: 1
          maximum: 5
          description: The caller's rating. Absent when the caller hasn't rated it.
    TrackDetail:
      description: A track's properties, repeated (allOf does not mix with additionalProperties false), plus its album.
      type: object
      additionalProperties: false
      required: [id, title, artists, durationMs, format, genres, etag, hearted, albumId, albumEtag]
      properties:
        id: { type: string }
        title: { type: string }
        artists:
          type: array
          items: { type: string }
        discNo: { type: integer }
        trackNo: { type: integer }
        durationMs: { type: integer, format: int64 }
        format: { type: string }
        sampleRate: { type: integer }
        bitDepth: { type: integer }
        replayGain: { $ref: "#/components/schemas/ReplayGain" }
        trackTotal: { type: integer }
        discTotal: { type: integer }
        discSubtitle:
          type: string
          description: The disc's name as this track is tagged; absent when untagged.
        year: { type: integer }
        genres:
          type: array
          items: { type: string }
        etag:
          type: string
          description: Changes when the file does. Not the stream's ETag.
        hearted:
          type: boolean
          description: Whether the caller has hearted it.
        stars:
          type: integer
          minimum: 1
          maximum: 5
          description: The caller's rating. Absent when the caller hasn't rated it.
        albumId: { type: string }
        albumEtag:
          type: string
          description: The `If-Match` value for `POST /albums/{id}/edits`.
    TagEdit:
      description: A change to a file's tags. At least one is required, here or in `tracks`.
      type: object
      additionalProperties: false
      properties:
        set: { $ref: "#/components/schemas/FieldValues" }
        clear: { $ref: "#/components/schemas/ClearedFields" }
        tags: { $ref: "#/components/schemas/RawTagEdits" }
    TrackTagEdit:
      description: A `TagEdit` of one track, repeated (allOf does not mix with additionalProperties false).
      type: object
      additionalProperties: false
      required: [id]
      properties:
        id: { type: string }
        set: { $ref: "#/components/schemas/FieldValues" }
        clear: { $ref: "#/components/schemas/ClearedFields" }
        tags: { $ref: "#/components/schemas/RawTagEdits" }
    ClearedFields:
      description: Fields to remove. Any but `title`. A field also in `set` is a 400.
      type: array
      items: { type: string }
    RawTagEdits:
      description: >-
        Changes to the tags no field covers, by `key` as `GET
        /albums/{id}/tags` shows them. A key a file can't take is a 422: on any
        format, one a field owns or one that holds pictures, chapters, gain or
        a fingerprint; a new Vorbis key that isn't upper-case ASCII without `=`;
        a new ID3 key that isn't upper-case or looks like a frame ID; a new M4A
        key that isn't upper-case, and any M4A item that isn't text.
      type: array
      items:
        type: object
        additionalProperties: false
        required: [key, values]
        properties:
          key: { type: string }
          values:
            description: The new values. Empty removes the tag.
            type: array
            items: { type: string }
    AlbumEdit:
      description: >-
        `all` goes to every track, and `tracks` to the ones they name, on top of
        `all`: a field in both takes the track's value or removal. A track not on this
        album is a 422, and naming one twice a 400.
      type: object
      additionalProperties: false
      properties:
        all: { $ref: "#/components/schemas/TagEdit" }
        tracks:
          type: array
          items: { $ref: "#/components/schemas/TrackTagEdit" }
    ShuffleStart:
      type: object
      additionalProperties: false
      required: [scope, mode]
      properties:
        scope: { $ref: "#/components/schemas/ShuffleScope" }
        mode: { type: string, enum: [finite, endless] }
        first:
          type: string
          minLength: 1
          description: The song to lead with, which the client may already be playing.
        seed:
          type: integer
          format: int64
          minimum: 0
          maximum: 9007199254740991
          description: Repeats a shuffle of the same songs. Absent for a new one.
    ShuffleScope:
      type: object
      additionalProperties: false
      description: >-
        What a shuffle draws from. `library` is every song; `hearted` and
        `rated` are the Library list's Hearted and 4★-and-up filters; `album`
        and `artist` take `id`; `tracks` names from 1 to 10,000 songs, such as
        a selection. Nothing else may be given.
      required: [kind]
      properties:
        kind: { type: string, enum: [library, hearted, rated, album, artist, tracks] }
        id: { type: string, minLength: 1 }
        tracks:
          type: array
          minItems: 1
          maxItems: 10000
          items: { type: string, minLength: 1 }
    ShufflePage:
      type: object
      additionalProperties: false
      required: [id, mode, from, to, songs, done, picks]
      properties:
        id: { type: string }
        mode: { type: string, enum: [finite, endless] }
        from:
          type: integer
          format: int64
          description: The position the page starts at.
        to:
          type: integer
          format: int64
          description: The position after it, which the next page is asked for after.
        songs:
          type: integer
          description: How many songs shuffle may pick from.
        done:
          type: boolean
          description: A finite shuffle has nothing after this page.
        picks:
          type: array
          items: { $ref: "#/components/schemas/ShufflePick" }
    ShufflePick:
      type: object
      additionalProperties: false
      required: [songs, why]
      properties:
        songs:
          type: array
          description: The song, or the songs combined, in the order they play.
          items: { $ref: "#/components/schemas/TrackHit" }
        why: { $ref: "#/components/schemas/ShuffleWhy" }
    ShuffleWhy:
      type: object
      additionalProperties: false
      description: >-
        Why a pick came up: its weight's factors, each a multiplier, and what
        they come from. The client words them. With `memory` off, skips and
        listen time count for nothing and their factors are 1.
      required: [stars, rating, hearted, heart, played, sinceDays, recency, memory, earlySkips, skipMemory, starts, skips, skipRate, listens, heard, listen, flow]
      properties:
        stars: { type: number, minimum: 0, maximum: 5, description: "The mean of its rated songs; 0 unrated." }
        rating: { type: number }
        hearted: { type: boolean }
        heart: { type: number }
        played: { type: boolean, description: "Whether it has come up before, played or skipped." }
        sinceDays: { type: integer, minimum: 0, description: "Days since it last came up." }
        recency: { type: number }
        memory: { type: boolean, description: "Whether skips and listen time count." }
        earlySkips: { type: integer, minimum: 0, description: "Its skips in the first 30 seconds this week." }
        skipMemory: { type: number }
        starts: { type: integer, minimum: 0, description: "Its starts in shuffle that played or were skipped." }
        skips: { type: integer, minimum: 0 }
        skipRate: { type: number }
        listens: { type: integer, minimum: 0, description: "Its listens that played or were skipped." }
        heard: { type: number, minimum: 0, maximum: 1, description: "How much of it those heard, on average." }
        listen: { type: number }
        flow: { type: number, description: "Flow's factor, 1 for none." }
        after: { $ref: "#/components/schemas/ArtistLink" }
        similarity: { type: number, minimum: 0, maximum: 1, description: "How alike it is to `after`." }
    ShuffleTracks:
      type: object
      additionalProperties: false
      required: [tracks]
      properties:
        tracks:
          type: array
          minItems: 1
          maxItems: 1000
          items: { type: string, minLength: 1 }
    ShuffleRun:
      type: object
      additionalProperties: false
      required: [id, tracks]
      properties:
        id: { type: string }
        tracks:
          type: array
          description: Track IDs, in the order they play.
          minItems: 2
          items: { type: string }
    ShuffleRules:
      type: object
      additionalProperties: false
      required: [runs, excluded]
      properties:
        runs:
          type: array
          items: { $ref: "#/components/schemas/ShuffleRun" }
        excluded:
          type: array
          description: The songs asked about that shuffle leaves out.
          items: { type: string }
    TracksEdit:
      description: >-
        `all` goes to every track `tracks` names, and each track's own on top of
        it: a field in both takes the track's value or removal. A track on none
        of `albums` is a 422; naming an album or a track twice, or nothing to
        change, is a 400.
      type: object
      additionalProperties: false
      required: [albums, tracks]
      properties:
        albums:
          type: array
          minItems: 1
          items:
            type: object
            additionalProperties: false
            required: [id, etag]
            properties:
              id: { type: string }
              etag:
                type: string
                description: The album's `etag` from the last read, verbatim.
        all: { $ref: "#/components/schemas/TagEdit" }
        tracks:
          type: array
          minItems: 1
          items: { $ref: "#/components/schemas/TrackTagEdit" }
    EditedTracks:
      type: object
      additionalProperties: false
      required: [tracks]
      properties:
        tracks:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [id, albumId]
            properties:
              id: { type: string }
              albumId:
                type: string
                description: The album the track is on now.
    AlbumTags:
      type: object
      additionalProperties: false
      required: [etag, tracks]
      properties:
        etag:
          type: string
          description: The album's `If-Match` value.
        tracks:
          type: array
          items: { $ref: "#/components/schemas/TrackTags" }
    TrackTags:
      type: object
      additionalProperties: false
      required: [id, file, fields, tags]
      properties:
        id: { type: string }
        file: { type: string, description: "The file's base name." }
        fields: { $ref: "#/components/schemas/FieldValues" }
        readOnly:
          type: array
          description: Fields to show but not edit, such as timestamped lyrics.
          items: { type: string }
        tags:
          type: array
          description: Everything no field covers, by key.
          items: { $ref: "#/components/schemas/RawTag" }
    FieldValues:
      description: >-
        Values by field, the same in every format. Numbers are decimal text; a
        date is `YYYY`, `YYYY-MM` or `YYYY-MM-DD`, and a new one replaces the
        old one whole. A value a file can't hold is a 422. `compilation` takes
        `1`, and clearing it turns it off. `album`, `artists`, `albumArtists`
        and `compilation` decide which album a track groups into: an album
        renamed whole keeps its ID. The `musicbrainz…Id` fields take
        MusicBrainz IDs, lower-case; `musicbrainzRecordingId` is the
        recording, `musicbrainzTrackId` the release's track. A change of
        `artists` or `albumArtists` drops their IDs unless the same edit
        gives new ones.
      type: object
      additionalProperties: false
      properties:
        title: { $ref: "#/components/schemas/Values" }
        album: { $ref: "#/components/schemas/Values" }
        artists: { $ref: "#/components/schemas/Values" }
        albumArtists: { $ref: "#/components/schemas/Values" }
        compilation: { $ref: "#/components/schemas/Values" }
        track: { $ref: "#/components/schemas/Values" }
        trackTotal: { $ref: "#/components/schemas/Values" }
        disc: { $ref: "#/components/schemas/Values" }
        discTotal: { $ref: "#/components/schemas/Values" }
        discSubtitle: { $ref: "#/components/schemas/Values" }
        date: { $ref: "#/components/schemas/Values" }
        genres: { $ref: "#/components/schemas/Values" }
        composers: { $ref: "#/components/schemas/Values" }
        conductor: { $ref: "#/components/schemas/Values" }
        lyricist: { $ref: "#/components/schemas/Values" }
        performers: { $ref: "#/components/schemas/Values" }
        remixer: { $ref: "#/components/schemas/Values" }
        grouping: { $ref: "#/components/schemas/Values" }
        label: { $ref: "#/components/schemas/Values" }
        catalogNumber: { $ref: "#/components/schemas/Values" }
        barcode: { $ref: "#/components/schemas/Values" }
        isrc: { $ref: "#/components/schemas/Values" }
        originalDate: { $ref: "#/components/schemas/Values" }
        language: { $ref: "#/components/schemas/Values" }
        bpm: { $ref: "#/components/schemas/Values" }
        key: { $ref: "#/components/schemas/Values" }
        copyright: { $ref: "#/components/schemas/Values" }
        comment: { $ref: "#/components/schemas/Values" }
        lyrics: { $ref: "#/components/schemas/Values" }
        sortTitle: { $ref: "#/components/schemas/Values" }
        sortArtist: { $ref: "#/components/schemas/Values" }
        sortAlbum: { $ref: "#/components/schemas/Values" }
        sortAlbumArtist: { $ref: "#/components/schemas/Values" }
        musicbrainzAlbumId: { $ref: "#/components/schemas/Values" }
        musicbrainzReleaseGroupId: { $ref: "#/components/schemas/Values" }
        musicbrainzAlbumArtistId: { $ref: "#/components/schemas/Values" }
        musicbrainzArtistId: { $ref: "#/components/schemas/Values" }
        musicbrainzRecordingId: { $ref: "#/components/schemas/Values" }
        musicbrainzTrackId: { $ref: "#/components/schemas/Values" }
    MatchRequest:
      type: object
      additionalProperties: false
      properties:
        artist: { type: string, description: "Search for this artist instead." }
        album: { type: string, description: "Search for this title instead." }
        code:
          type: string
          description: A catalog number, or a barcode when it is all digits and at least 8 long.
        prefetch: { type: boolean, description: "Work done ahead, which waits for people." }
    MatchList:
      type: object
      additionalProperties: false
      required: [source, asked, candidates]
      properties:
        source: { type: string, enum: [musicbrainz] }
        asked: { $ref: "#/components/schemas/MatchTerms" }
        candidates:
          type: array
          items: { $ref: "#/components/schemas/MatchCandidate" }
    MatchTerms:
      type: object
      additionalProperties: false
      description: What was asked for. Empty members weren't.
      required: [artist, album, catalogNumber, barcode]
      properties:
        artist: { type: string }
        album: { type: string }
        catalogNumber: { type: string }
        barcode: { type: string }
    MatchCandidate:
      type: object
      additionalProperties: false
      required: [id, score, evidence, release, page]
      properties:
        id: { type: string, description: "Opaque: for GET /matches/{id}." }
        score: { type: integer, minimum: 0, maximum: 100, description: "Confidence." }
        evidence:
          type: array
          items: { $ref: "#/components/schemas/MatchEvidence" }
        release: { $ref: "#/components/schemas/MatchRelease" }
        cover: { type: string, description: "The front cover's URL, about 250 pixels across, when there is one." }
        page: { type: string, description: "The release's page on MusicBrainz." }
    MatchEvidence:
      type: object
      additionalProperties: false
      description: >-
        One thing a confidence rests on. `lengths`: `count` of `of` paired
        songs are within ±3 s. `titleArtist`: both are the release's.
        `title`, `artist`: that one differs. `tagged`: `count` songs' files
        carry this release's ID. `discs`: the release has `count` media of
        `format`, the album `of` discs. `songs`: the release has `count`
        songs, the album `of`. `fingerprint` is for matching by sound, later.
      required: [kind, verdict]
      properties:
        kind: { type: string, enum: [lengths, titleArtist, title, artist, tagged, discs, songs, fingerprint] }
        verdict: { type: string, enum: [agrees, neutral, differs] }
        count: { type: integer }
        of: { type: integer }
        format: { type: string }
    MatchRelease:
      type: object
      additionalProperties: false
      required: [id, title, artist, artists, labels, media, trackCount]
      properties:
        id: { type: string, description: "The release MBID." }
        groupId: { type: string }
        title: { type: string }
        artist: { type: string, description: "The credit as it reads." }
        artists:
          type: array
          items: { $ref: "#/components/schemas/MatchCredit" }
        date: { type: string }
        originalDate: { type: string }
        country: { type: string }
        barcode: { type: string }
        status: { type: string }
        labels:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [name, catalogNumber]
            properties:
              name: { type: string }
              catalogNumber: { type: string }
        media:
          type: array
          items: { $ref: "#/components/schemas/MatchMedium" }
        trackCount: { type: integer }
    MatchCredit:
      type: object
      additionalProperties: false
      required: [name, join]
      properties:
        name: { type: string, description: "As credited." }
        id: { type: string }
        join: { type: string, description: "What joins it to the next, such as \" feat. \"." }
    MatchMedium:
      type: object
      additionalProperties: false
      required: [position, format, title, trackCount]
      properties:
        position: { type: integer }
        format: { type: string }
        title: { type: string }
        trackCount: { type: integer }
    MatchReview:
      type: object
      additionalProperties: false
      required: [candidate, album, albumIds, tracks, pairs]
      properties:
        candidate: { $ref: "#/components/schemas/MatchCandidate" }
        album: { $ref: "#/components/schemas/FieldValues" }
        albumIds: { $ref: "#/components/schemas/FieldValues" }
        tracks:
          type: array
          description: The release's tracks, medium by medium.
          items: { $ref: "#/components/schemas/MatchTrack" }
        pairs:
          type: array
          description: One for each live track of the album, in album order.
          items: { $ref: "#/components/schemas/MatchPair" }
    MatchTrack:
      type: object
      additionalProperties: false
      required: [disc, position, title, artist, proposed, ids]
      properties:
        disc: { type: integer, description: "Its medium's position." }
        position: { type: integer }
        title: { type: string }
        artist: { type: string, description: "The credit as it reads." }
        lengthMs: { type: integer, format: int64 }
        proposed: { $ref: "#/components/schemas/FieldValues" }
        ids: { $ref: "#/components/schemas/FieldValues" }
    MatchPair:
      type: object
      additionalProperties: false
      required: [track]
      properties:
        track: { type: string, description: "The album track's ID." }
        release: { type: integer, description: "Index into `tracks`; missing when nothing pairs." }
    MatchQueue:
      type: object
      additionalProperties: false
      required: [counts, albums]
      properties:
        counts:
          type: object
          additionalProperties: false
          required: [todo, skipped, matched]
          properties:
            todo: { type: integer }
            skipped: { type: integer }
            matched: { type: integer }
        albums:
          type: array
          items: { $ref: "#/components/schemas/QueuedAlbum" }
    QueuedAlbum:
      type: object
      additionalProperties: false
      required: [id, title, artist, songs, state]
      properties:
        id: { type: string }
        title: { type: string }
        artist: { type: string }
        songs: { type: integer }
        state: { $ref: "#/components/schemas/MatchState" }
    MatchState:
      type: string
      enum: [todo, skipped, matched]
    MatchStateChange:
      type: object
      additionalProperties: false
      required: [state]
      properties:
        state: { $ref: "#/components/schemas/MatchState" }
    Values:
      type: array
      items: { type: string }
    RawTag:
      type: object
      additionalProperties: false
      required: [key, values]
      properties:
        key: { type: string, description: "The format's own name for the tag." }
        values:
          type: array
          minItems: 1
          items: { type: string }
        readOnly:
          type: boolean
          description: >-
            An edit may not touch it. Gain, fingerprints, pictures, chapters and
            binary items are read-only, and so is a value too long to show whole,
            which is cut.
    AlbumDetail:
      description: An album entry's properties, repeated (allOf does not mix with additionalProperties false), plus its tracks.
      type: object
      additionalProperties: false
      required: [id, title, sortName, artist, artists, trackCount, compilation, tracks, discs, durationMs, formats, addedAt, genres, displayGenres, etag, hearted]
      properties:
        id: { type: string }
        title: { type: string }
        sortName: { type: string }
        artist: { type: string }
        artists:
          type: array
          description: >-
            Who `artist` links to: the album artists, else the first track
            artist. Empty for a compilation or Various Artists, where `artist`
            is plain text.
          items: { $ref: "#/components/schemas/ArtistLink" }
        year: { type: integer }
        trackCount: { type: integer }
        compilation: { type: boolean }
        artwork: { $ref: "#/components/schemas/Artwork" }
        tracks:
          type: array
          items: { $ref: "#/components/schemas/Track" }
        discs:
          type: array
          items: { $ref: "#/components/schemas/Disc" }
        durationMs: { type: integer, format: int64 }
        formats:
          type: array
          description: Distinct and sorted.
          items: { type: string }
        addedAt: { type: string, format: date-time }
        genres:
          type: array
          description: Every raw genre value of the tracks, each once, in track order, for the tag editor.
          items: { type: string }
        displayGenres:
          type: array
          description: As on AlbumEntry.
          items: { type: string }
        etag:
          type: string
          description: The `If-Match` value for `POST /albums/{id}/edits`.
        hearted:
          type: boolean
          description: Whether the caller has hearted it.
    ArtistEntry:
      type: object
      additionalProperties: false
      required: [id, name, albumCount, addedAt, plays]
      properties:
        id: { type: string }
        name: { type: string }
        albumCount: { type: integer, description: The albums it owns. }
        addedAt:
          type: string
          format: date-time
          description: When the newest album it owns arrived.
        plays:
          type: integer
          description: How often the caller played the songs of the albums it owns.
    ArtistList:
      type: object
      additionalProperties: false
      required: [artists]
      properties:
        artists:
          type: array
          items: { $ref: "#/components/schemas/ArtistEntry" }
    ArtistDetail:
      type: object
      additionalProperties: false
      required: [id, name, albumCount, albums, appearsOn]
      properties:
        id: { type: string }
        name: { type: string }
        albumCount: { type: integer, description: The albums it owns. }
        albums:
          type: array
          description: The albums it owns, newest first.
          items: { $ref: "#/components/schemas/AlbumEntry" }
        appearsOn:
          type: array
          description: The other albums it has a track on, newest first.
          items: { $ref: "#/components/schemas/AlbumEntry" }
    ArtistLink:
      type: object
      additionalProperties: false
      required: [id, name]
      properties:
        id: { type: string }
        name: { type: string }
    TrackHit:
      type: object
      additionalProperties: false
      required: [id, title, artists, albumId, album, durationMs]
      properties:
        id: { type: string }
        title: { type: string }
        artists:
          type: array
          items: { type: string }
        albumId: { type: string }
        album: { type: string }
        durationMs: { type: integer, format: int64 }
        artwork: { $ref: "#/components/schemas/Artwork" }
    PrefValue:
      description: >-
        A preference's value. Its key decides which of these it is: two may
        take the same number, so it is any of them, not one of them.
      anyOf:
        - $ref: "#/components/schemas/LibraryColumns"
        - $ref: "#/components/schemas/UITheme"
        - $ref: "#/components/schemas/ShuffleAmount"
        - $ref: "#/components/schemas/ShuffleMemory"
        - $ref: "#/components/schemas/UntaggedGain"
        - $ref: "#/components/schemas/LibrarySort"
        - $ref: "#/components/schemas/ListSort"
    LibrarySort:
      type: object
      additionalProperties: false
      description: >-
        `library.sort`: how the Library orders its artists, and each artist's
        albums; artist pages order their albums the same way. Artists A to Z
        and albums newest first when never set. Ties go by name, then ID.
      required: [artists, albums]
      properties:
        artists:
          type: object
          additionalProperties: false
          required: [by, dir]
          properties:
            by: { type: string, enum: [name, added, plays] }
            dir: { $ref: "#/components/schemas/SortDirection" }
        albums:
          type: object
          additionalProperties: false
          required: [by, dir]
          properties:
            by: { type: string, enum: [year, name, added] }
            dir: { $ref: "#/components/schemas/SortDirection" }
    ListSort:
      type: object
      additionalProperties: false
      description: >-
        `albums.sort`: the Albums page's order, `by` one of `name`, `artist`,
        `year`, `added`, `plays` or `rating`. `artists.sort`: the Artists page's,
        `by` one of `name`, `albums`, `added` or `plays`. Name A to Z when never
        set. Ties go by name, then ID.
      required: [by, dir]
      properties:
        by: { type: string, enum: [name, artist, year, added, plays, rating, albums] }
        dir: { $ref: "#/components/schemas/SortDirection" }
    SortDirection:
      type: string
      description: Which way the order runs. What is unknown, such as a missing year, goes last either way.
      enum: [asc, desc]
    UITheme:
      type: string
      description: >-
        `ui.theme`: how the web client looks. `system` follows the light or
        dark the device shows, and changes when it does.
      enum: [system, light, dark]
    ShuffleAmount:
      type: number
      minimum: 0
      maximum: 1
      description: >-
        `shuffle.ratings`: how much ratings and hearts matter to shuffle, from
        0 (not at all) to 1; 0.5 when never set. `shuffle.flow`: how much the
        next song leans toward one that suits the last, from 0 (anything next)
        to 1; 0.3 when never set.
    UntaggedGain:
      type: number
      minimum: -20
      maximum: 0
      description: >-
        `playback.untagged_gain`: the gain in dB a song plays at while it has no
        ReplayGain, neither tagged nor measured yet; -8 when never set.
    ShuffleMemory:
      type: boolean
      description: >-
        `shuffle.memory`: whether shuffle learns from what the person skips and
        how much of a song they hear. True when never set.
    LibraryColumns:
      type: object
      additionalProperties: false
      description: >-
        `library.columns`: the person's song columns, one set for every list of
        songs. Checkbox, time and the row's menu are always shown, in their
        places, and never named here. Number and title are always shown too, and
        placed in the order.
      required: [order, artistWhenDifferent]
      properties:
        order:
          type: array
          description: >-
            The columns shown, in their order, `number` and `title` among them. A
            column left out is hidden. An order without `number` or `title`, as
            one saved before they could move, gets them back where they were:
            `number` first and `title` right after it, and reads back with them.
          uniqueItems: true
          items: { $ref: "#/components/schemas/PlacedColumn" }
        artistWhenDifferent:
          type: boolean
          description: Leave Artist empty where the track's artists are the album's.
        widths:
          type: object
          description: >-
            The widths columns were dragged to, in CSS pixels at the base size
            step, by column. A column not named has its default width, as has
            every column of a value saved without widths.
          additionalProperties: false
          properties:
            artist: { $ref: "#/components/schemas/ColumnWidth" }
            albumArtist: { $ref: "#/components/schemas/ColumnWidth" }
            album: { $ref: "#/components/schemas/ColumnWidth" }
            genre: { $ref: "#/components/schemas/ColumnWidth" }
            year: { $ref: "#/components/schemas/ColumnWidth" }
            rating: { $ref: "#/components/schemas/ColumnWidth" }
            heart: { $ref: "#/components/schemas/ColumnWidth" }
            plays: { $ref: "#/components/schemas/ColumnWidth" }
            lastPlayed: { $ref: "#/components/schemas/ColumnWidth" }
            added: { $ref: "#/components/schemas/ColumnWidth" }
            composer: { $ref: "#/components/schemas/ColumnWidth" }
            format: { $ref: "#/components/schemas/ColumnWidth" }
            bitrate: { $ref: "#/components/schemas/ColumnWidth" }
            gain: { $ref: "#/components/schemas/ColumnWidth" }
    ColumnWidth:
      type: integer
      description: A column's width, in CSS pixels at the base size step.
      minimum: 16
      maximum: 960
    PlacedColumn:
      description: A column an order may place, the always-shown number and title among them.
      oneOf:
        - { $ref: "#/components/schemas/SongColumn" }
        - { type: string, enum: [number, title] }
    SongColumn:
      type: string
      description: A song column a person may choose to show or hide.
      enum: [artist, albumArtist, album, genre, year, rating, heart, plays, lastPlayed, added, composer, format, bitrate, gain]
    LibraryIndex:
      type: object
      additionalProperties: false
      required: [artists]
      properties:
        artists:
          type: array
          items: { $ref: "#/components/schemas/LibraryArtist" }
    LibraryArtist:
      type: object
      additionalProperties: false
      required: [name, sortName, hearted, albums]
      properties:
        id:
          type: string
          description: Absent for a group with no owner a reader shows, such as Various Artists.
        hearted:
          type: boolean
          description: Whether the caller has hearted the artist. Always false for a group with no `id`.
        name: { type: string }
        sortName:
          type: string
          description: Who the artist files under, which decides the letter it's found at.
        albums:
          type: array
          items: { $ref: "#/components/schemas/LibraryAlbum" }
    LibraryAlbum:
      type: object
      additionalProperties: false
      required: [id, title, artist, compilation, hearted, tracks]
      properties:
        id: { type: string }
        title: { type: string }
        artist: { type: string }
        compilation: { type: boolean }
        hearted:
          type: boolean
          description: Whether the caller has hearted it.
        year: { type: integer }
        artwork: { $ref: "#/components/schemas/Artwork" }
        tracks:
          type: array
          items: { $ref: "#/components/schemas/LibraryTrack" }
        discs:
          description: >-
            The album's discs, only when they say what its tracks don't: when
            it has more than one, or its one disc has a name. Absent otherwise,
            so an album on one unnamed disc costs what it did.
          type: array
          minItems: 1
          items: { $ref: "#/components/schemas/Disc" }
        after:
          type: string
          description: >-
            Only in an index of some `albums`: the album just before this one in
            the whole index, `""` when it comes first. A client that has that
            album puts this one after it: right behind it under the same
            heading, or else first under its own heading, which follows that
            album's.
    Disc:
      description: >-
        One disc of an album, in disc order: an album on one disc has one.
        When no song of the album has a disc number, they are all on disc 1.
        When some do and some don't, those that don't are a group of their
        own, after every disc, which has no `no`: its tracks come last in the
        album's order too. A disc tagged 0 has no number.
      type: object
      additionalProperties: false
      required: [songs, durationMs]
      properties:
        no:
          type: integer
          minimum: 1
          description: Absent for the songs with no disc number, beside songs that have one.
        name:
          type: string
          description: >-
            The disc's subtitle: that of its first song that has one, in the
            order the album lists them. Absent when none has one.
        songs: { type: integer, minimum: 1 }
        durationMs: { type: integer, format: int64 }
    LibraryTrack:
      type: object
      additionalProperties: false
      required: [id, title, durationMs, artists, hearted]
      properties:
        id: { type: string }
        title: { type: string }
        durationMs: { type: integer, format: int64 }
        artists:
          type: array
          items: { type: string }
        discNo: { type: integer }
        trackNo: { type: integer }
        hearted:
          type: boolean
          description: Whether the caller has hearted it.
        stars:
          type: integer
          minimum: 1
          maximum: 5
          description: The caller's rating. Absent when the caller hasn't rated it.
        albumArtists:
          type: array
          description: With `fields=albumArtist`. Absent when the track names none.
          items: { type: string }
        displayGenres:
          type: array
          description: >-
            With `fields=genre`: the track's genres, split and spelled as
            albums' `displayGenres` are. Absent when it has none.
          items: { type: string }
        year:
          type: integer
          description: With `fields=year`. Absent when unknown.
        composers:
          type: array
          description: With `fields=composer`, as tagged. Absent when it has none.
          items: { type: string }
        format:
          type: string
          description: With `fields=format`, such as `FLAC` or `MP3`.
        sampleRate:
          type: integer
          description: With `fields=format`, in Hz. Absent when unknown.
        bitDepth:
          type: integer
          description: With `fields=format`. Absent for a lossy format.
        bitrate:
          type: integer
          description: With `fields=format` or `fields=bitrate`, in kbps. Absent when unknown.
        addedAt:
          type: string
          format: date-time
          description: With `fields=added`. When the library first saw the file.
        plays:
          type: integer
          minimum: 1
          description: With `fields=plays`. The caller's plays of it. Absent when never played.
        lastPlayedAt:
          type: string
          format: date-time
          description: With `fields=lastPlayed`. The caller's last play. Absent when never played.
        trackGain:
          type: number
          description: >-
            With `fields=gain`: the gain the track plays at, in dB, as an
            album's `replayGain.trackGain`: the file's tagged ReplayGain, or, for
            a file with no gain tagged, Kitsune's own measure of it. Absent when
            it has neither.
        trackGainSource:
          type: string
          enum: [tags, measured]
          description: >-
            With `fields=gain`, where `trackGain` comes from, as `ReplayGain`'s
            `source` says it. Present exactly when `trackGain` is.
        shuffle:
          type: object
          additionalProperties: false
          description: >-
            With `fields=shuffle`: the caller's shuffle rules on the track.
            Absent when it has none.
          properties:
            run:
              type: string
              description: The run it is combined in, with `position` and `length`.
            position: { type: integer, minimum: 1, description: Its place in the run, from 1. }
            length: { type: integer, minimum: 2, description: How many songs the run has. }
            excluded:
              type: boolean
              description: Shuffle never picks it. Absent when false.
    SearchResults:
      type: object
      additionalProperties: false
      required: [artists, albums, tracks]
      properties:
        artists:
          type: array
          items: { $ref: "#/components/schemas/ArtistLink" }
        albums:
          type: array
          items: { $ref: "#/components/schemas/AlbumEntry" }
        tracks:
          type: array
          items: { $ref: "#/components/schemas/TrackHit" }
    LibraryFacts:
      type: object
      additionalProperties: false
      required: [albums, tracks, durationMs, roots, issues, issueCounts, scan, fingerprints, loudness]
      properties:
        albums: { type: integer, format: int64 }
        tracks: { type: integer, format: int64 }
        durationMs: { type: integer, format: int64 }
        roots: { type: integer, description: The number of configured library roots. }
        issues: { type: integer, format: int64, description: Files the scanner could not read. }
        issueCounts: { $ref: "#/components/schemas/IssueCounts" }
        scan: { $ref: "#/components/schemas/ScanStatus" }
        fingerprints: { $ref: "#/components/schemas/FingerprintStatus" }
        loudness: { $ref: "#/components/schemas/LoudnessStatus" }
    LoudnessStatus:
      type: object
      additionalProperties: false
      description: >-
        The background pass that measures the loudness of albums with a song
        that has no ReplayGain tags, after a scan, so every song plays at the
        same level. `done` and `total` are 0 while no pass runs. FLAC, MP3, and
        uncompressed WAV and AIFF are measured; other formats can't be yet.
      required: [done, total, ungained, measured, unmeasurable]
      properties:
        done: { type: integer, description: Files the pass has read. }
        total: { type: integer, description: Files waiting for a measure when the pass began. }
        ungained: { type: integer, description: Songs with no ReplayGain tags. }
        measured: { type: integer, description: Of those, the ones Kitsune has measured. }
        unmeasurable: { type: integer, description: Of those, the ones it can't measure yet. }
    FingerprintStatus:
      type: object
      additionalProperties: false
      description: >-
        The background pass that fingerprints new and changed files after a scan,
        so a moved file keeps its track. Both are 0 while no pass runs. A file
        that moves before its fingerprint is made becomes a new track.
      required: [done, total]
      properties:
        done: { type: integer, description: Files the pass has read. }
        total: { type: integer, description: Files waiting for a fingerprint when the pass began. }
    IssueCounts:
      type: object
      additionalProperties: false
      required: [unreadable, corrupted, unsupported, warnings]
      properties:
        unreadable: { type: integer, format: int64, description: 'Files an I/O or permission error stopped. Tried again every scan.' }
        corrupted: { type: integer, format: int64, description: Structurally broken files. }
        unsupported: { type: integer, format: int64, description: Files of a format Kitsune can't read. }
        warnings: { type: integer, format: int64, description: Live tracks read with warnings. They play; `issues` leaves them out. }
    ScanIssues:
      type: object
      additionalProperties: false
      required: [issues, warnings]
      properties:
        issues:
          type: array
          items: { $ref: "#/components/schemas/ScanIssue" }
        warnings:
          type: array
          items: { $ref: "#/components/schemas/TrackWarned" }
    ScanIssue:
      type: object
      additionalProperties: false
      required: [path, kind, message]
      properties:
        path: { type: string, description: Relative to its library root. }
        kind: { type: string, enum: [unreadable, corrupted, unsupported] }
        message: { type: string }
    TrackWarned:
      type: object
      additionalProperties: false
      required: [trackId, path, messages]
      properties:
        trackId: { type: string }
        path: { type: string, description: Relative to its library root. }
        messages:
          type: array
          items: { type: string }
    ScanRequest:
      type: object
      additionalProperties: false
      required: [mode]
      properties:
        mode: { type: string, enum: [quick, full] }
    ScanStatus:
      type: object
      additionalProperties: false
      description: >-
        `mode`, `read`, `total` and `startedAt` describe the running scan: idle,
        the first and last are absent and the numbers are 0.
      required: [state, read, total]
      properties:
        state: { type: string, enum: [idle, running] }
        mode: { type: string, enum: [quick, full] }
        read: { type: integer, description: Files the scan has read. }
        total:
          type: integer
          description: >-
            Files the scan has to read: every file for a Full scan, new and
            changed ones for a Quick one. 0 until it has walked the roots.
        startedAt: { type: string, format: date-time }
        last: { $ref: "#/components/schemas/ScanResult" }
    ScanResult:
      type: object
      additionalProperties: false
      description: >-
        How the last scan to end went. It is held in memory: a restart starts
        over from the Quick scan every start runs.
      required: [mode, outcome, startedAt, endedAt, seen, read, added, updated, moved, missing, deleted, issues, skippedRoots]
      properties:
        mode: { type: string, enum: [quick, full] }
        outcome: { type: string, enum: [finished, failed] }
        startedAt: { type: string, format: date-time }
        endedAt: { type: string, format: date-time }
        seen: { type: integer, description: Audio files found under the roots. }
        read: { type: integer }
        added: { type: integer }
        updated: { type: integer }
        moved: { type: integer }
        missing: { type: integer, description: Tracks newly marked missing. }
        deleted: { type: integer, format: int64, description: Tracks deleted after the grace period. }
        issues: { type: integer, description: Files this scan read and could not use. }
        skippedRoots: { type: integer, description: Roots left alone because they looked like an outage. }
        error: { type: string, description: 'Why it failed, without library paths. Administrators only.' }
    ServerSettings:
      type: object
      additionalProperties: false
      required: [settings, listen, listenSource, version, folders]
      properties:
        folders:
          type: array
          description: The library.roots, in order, with what each holds now.
          items: { $ref: "#/components/schemas/LibraryFolder" }
        settings:
          type: object
          additionalProperties: false
          description: Every setting, by its key as server.toml spells it.
          required:
            - lastfm.api_key
            - lastfm.shared_secret
            - library.roots
            - library.tag_writes
            - library.quick_scan
            - library.missing_grace
            - log.level
            - server.base_url
            - server.trusted_proxies
          properties:
            lastfm.api_key: { $ref: "#/components/schemas/StringSetting" }
            lastfm.shared_secret: { $ref: "#/components/schemas/SecretSetting" }
            library.roots: { $ref: "#/components/schemas/ListSetting" }
            library.tag_writes: { $ref: "#/components/schemas/BoolSetting" }
            library.quick_scan: { $ref: "#/components/schemas/StringSetting" }
            library.missing_grace: { $ref: "#/components/schemas/StringSetting" }
            log.level: { $ref: "#/components/schemas/StringSetting" }
            server.base_url: { $ref: "#/components/schemas/StringSetting" }
            server.trusted_proxies: { $ref: "#/components/schemas/ListSetting" }
        listen:
          type: string
          description: >-
            The address the server listens on. Only server.toml sets it: the
            server needs it before it can open its database.
        listenSource: { type: string, enum: [server.toml, default] }
        version: { type: string }
    FolderListing:
      type: object
      additionalProperties: false
      required: [path, kind, folders, audio]
      properties:
        path: { type: string }
        parent: { type: string, description: The folder above path. Absent at /. }
        kind: { $ref: "#/components/schemas/FolderKind" }
        folders: { type: array, items: { $ref: "#/components/schemas/Folder" } }
        audio: { $ref: "#/components/schemas/AudioCount" }
    Folder:
      type: object
      additionalProperties: false
      required: [name, path, kind]
      properties:
        name: { type: string }
        path: { type: string }
        kind: { $ref: "#/components/schemas/FolderKind" }
    FolderKind:
      type: string
      enum: [folder, library, inside, holds, data, config]
      description: >-
        Only `folder` can be added. `library` is a library folder already,
        `inside` lies in one and `holds` holds one; `data` is Kitsune's data and
        `config` holds its config file.
    AudioCount:
      type: object
      additionalProperties: false
      description: >-
        The audio files under a folder and the folders that hold them. With
        `complete` false the count stopped early, and these are at least that.
      required: [files, folders, complete]
      properties:
        files: { type: integer }
        folders: { type: integer }
        complete: { type: boolean }
    LibraryFolder:
      type: object
      additionalProperties: false
      description: A library root and what it holds now. Both are 0 until a scan has read it.
      required: [path, tracks, bytes]
      properties:
        path: { type: string }
        tracks: { type: integer, format: int64, description: Live tracks under it. }
        bytes: { type: integer, format: int64, description: Their size on disk. }
        watch: { $ref: "#/components/schemas/FolderWatch" }
    FolderWatch:
      type: object
      additionalProperties: false
      description: >-
        How the server follows the folder for new music. `watching`: the OS
        reports every change, scanned about 10 s after it settles. `polling`: the
        folder is looked over every 5 minutes, because it is on a network or FUSE
        filesystem (`network`, with its `filesystem` type), or watching every
        folder would pass the OS's limit (`watch-limit`: raise
        fs.inotify.max_user_watches and restart). `off`: the folder is missing,
        unreadable or empty while the library has songs there (`missing`); the
        next scan looks again. Absent while the server hasn't looked yet.
      required: [mode]
      properties:
        mode: { type: string, enum: [watching, polling, "off"] }
        reason: { type: string, enum: [network, watch-limit, missing] }
        filesystem: { type: string, description: "The filesystem type, such as `cifs`, for `network`." }
    SettingSource:
      type: string
      enum: [default, web, server.toml, env, flag]
      description: Where the value came from. `default` means nothing has set it.
    SettingFrom:
      type: string
      description: >-
        The source named for a person: the variable, such as
        KITSUNE_LASTFM_API_KEY, the flag, or server.toml. Absent for `default`
        and `web`.
    StringSetting:
      type: object
      additionalProperties: false
      description: >-
        `library.quick_scan` is a local time as HH:MM, `library.missing_grace` a
        duration such as "720h0m0s", and `log.level` one of debug, info, warn and
        error.
      required: [value, source]
      properties:
        value: { type: string }
        source: { $ref: "#/components/schemas/SettingSource" }
        from: { $ref: "#/components/schemas/SettingFrom" }
        restartRequired: { type: boolean, description: A change applies only after a restart. }
        pendingRestart: { type: boolean, description: The value has changed since the server started. }
    ListSetting:
      type: object
      additionalProperties: false
      required: [value, source]
      properties:
        value: { type: array, items: { type: string } }
        source: { $ref: "#/components/schemas/SettingSource" }
        from: { $ref: "#/components/schemas/SettingFrom" }
        restartRequired: { type: boolean, description: A change applies only after a restart. }
        pendingRestart: { type: boolean, description: The value has changed since the server started. }
    BoolSetting:
      type: object
      additionalProperties: false
      required: [value, source]
      properties:
        value: { type: boolean }
        source: { $ref: "#/components/schemas/SettingSource" }
        from: { $ref: "#/components/schemas/SettingFrom" }
    SecretSetting:
      type: object
      additionalProperties: false
      description: A write-only setting. Nothing returns its value.
      required: [set, source]
      properties:
        set: { type: boolean }
        source: { $ref: "#/components/schemas/SettingSource" }
        from: { $ref: "#/components/schemas/SettingFrom" }
    SettingsChange:
      type: object
      additionalProperties: false
      description: The settings to change, by key. null clears one.
      properties:
        lastfm.api_key: { type: [string, "null"], maxLength: 256 }
        lastfm.shared_secret: { type: [string, "null"], maxLength: 256 }
        library.roots: { type: [array, "null"], items: { type: string }, maxItems: 64 }
        library.tag_writes: { type: [boolean, "null"] }
        library.quick_scan: { type: [string, "null"], description: A local time as HH:MM. }
        library.missing_grace: { type: [string, "null"], description: 'A duration from "0s" to "87600h".' }
        log.level: { type: [string, "null"], description: 'debug, info, warn or error, in any case.' }
        server.base_url: { type: [string, "null"] }
        server.trusted_proxies: { type: [array, "null"], items: { type: string }, maxItems: 64 }
