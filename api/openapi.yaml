openapi: 3.1.0
info:
  title: Kitsune
  version: 0.1.0
  description: Native API of the Kitsune music server.
security:
  - bearer: []
  - cookie: []
paths:
  /healthz:
    get:
      operationId: getHealth
      summary: Report that the process is up.
      security: []
      responses:
        "204":
          description: The process is up.
  /me:
    get:
      operationId: getMe
      summary: Return the authenticated user.
      responses:
        "200":
          description: The authenticated user.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/User" }
        "401":
          description: Credentials are missing, invalid or expired.
          headers:
            WWW-Authenticate:
              schema: { type: string }
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
components:
  securitySchemes:
    bearer:
      type: http
      scheme: bearer
    cookie:
      type: apiKey
      in: cookie
      name: kitsune_session
  responses:
    Problem:
      description: An RFC 9457 problem.
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
  schemas:
    Problem:
      type: object
      required: [type, title, status]
      properties:
        type: { type: string, format: uri-reference }
        title: { type: string }
        status: { type: integer }
        detail: { type: string }
        requestId: { type: string }
    User:
      type: object
      additionalProperties: false
      required: [id, name, role, createdAt]
      properties:
        id: { type: integer, format: int64 }
        name: { type: string }
        role: { type: string, enum: [admin, user] }
        createdAt: { type: string, format: date-time }
