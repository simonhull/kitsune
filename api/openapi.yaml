openapi: 3.1.0
info:
  title: Kitsune
  version: 0.1.0
  description: Native API of the Kitsune music server.
servers:
  - url: /api/v1
security:
  - bearer: []
  - cookie: []
paths:
  /healthz:
    get:
      operationId: getHealth
      summary: Report that the process is up.
      security: []
      responses:
        "204":
          description: The process is up.
  /readyz:
    get:
      operationId: getReady
      summary: Report that the server is ready to serve.
      security: []
      responses:
        "204":
          description: The server is ready.
        "503":
          $ref: "#/components/responses/Problem"
  /auth/login:
    post:
      operationId: login
      summary: Exchange a name and password for a session.
      description: >-
        Failed attempts are rate limited per client IP and per account, with
        exponential backoff after 5 consecutive failures.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LoginRequest" }
      responses:
        "200":
          description: >-
            The session. With `cookie: true` it is also set as the
            kitsune_session cookie and the body carries no token.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Session" }
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "429":
          description: Too many failed logins.
          headers:
            Retry-After:
              description: Seconds to wait before trying again.
              schema: { type: integer }
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
  /auth/reset:
    post:
      operationId: requestPasswordReset
      summary: Ask for a code that sets a new password.
      description: >-
        Kitsune sends no email: for a real account, the server makes a reset
        code and writes it once to its log, at WARN, naming the account, so
        only whoever runs the server can pass it on. The code works once, for
        15 minutes, and asking again replaces it. Codes live in memory, so a
        restart voids them. The answer is the same whether or not the account
        exists. Requests are rate limited per client IP and per name.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ResetRequest" }
      responses:
        "202":
          description: If the account exists, a code is in the server's log.
        "400":
          $ref: "#/components/responses/Problem"
        "429":
          $ref: "#/components/responses/TooManyAttempts"
  /auth/reset/confirm:
    post:
      operationId: confirmPasswordReset
      summary: Set a new password with a reset code, and sign in.
      description: >-
        On success the account's sessions all end and a new one starts, as at
        login. A wrong code counts against the login rate limit, per client IP
        and per account; a wrong code, an expired or used one and an unknown
        name are the same 403.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ResetConfirm" }
      responses:
        "200":
          description: >-
            The new session. With `cookie: true` it is also set as the
            kitsune_session cookie and the body carries no token.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Session" }
        "400":
          $ref: "#/components/responses/Problem"
        "403":
          description: The code is wrong, expired or used, or no account has the name.
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        "429":
          $ref: "#/components/responses/TooManyAttempts"
  /setup:
    get:
      operationId: getSetup
      summary: Say whether the first account is still to be made.
      description: >-
        `needed` is true while the server has no accounts, and false for good
        once one exists. `codeRequired` is true while needed when the caller's
        address is outside the server's network (loopback, private ranges,
        link-local and 100.64.0.0/10), read through trusted proxies only.
      security: []
      responses:
        "200":
          description: Whether setup is needed, and whether it needs the code.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SetupStatus" }
    post:
      operationId: setup
      summary: Make the first account, an administrator, and sign in as it.
      description: >-
        Works only while the server has no accounts; of two racing requests
        exactly one succeeds. From outside the server's network it needs the
        setup code the server logged at startup. Wrong codes count against the
        login rate limit per client IP.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SetupRequest" }
      responses:
        "200":
          description: >-
            The new administrator's session, set as the kitsune_session cookie.
            The body carries no token.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Session" }
        "400":
          $ref: "#/components/responses/Problem"
        "403":
          description: The setup code is missing or wrong.
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        "409":
          description: An account exists, so setup is done.
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        "429":
          description: Too many wrong setup codes.
          headers:
            Retry-After:
              description: Seconds to wait before trying again.
              schema: { type: integer }
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
  /auth/logout:
    post:
      operationId: logout
      summary: End the current session.
      description: Always clears the session cookie, even for a bearer logout.
      parameters:
        - $ref: "#/components/parameters/KitsuneRequest"
      responses:
        "204":
          description: The session has ended.
        "401":
          description: Credentials are missing, invalid or expired.
          headers:
            WWW-Authenticate:
              schema: { type: string }
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        "403":
          $ref: "#/components/responses/Problem"
  /me:
    get:
      operationId: getMe
      summary: Return the authenticated user.
      responses:
        "200":
          description: The authenticated user.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Me" }
        "401":
          description: Credentials are missing, invalid or expired.
          headers:
            WWW-Authenticate:
              schema: { type: string }
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
  /me/plays:
    post:
      operationId: postPlay
      summary: Record that the caller played a track.
      description: >-
        One report per listen that counted, which the client decides. A second
        report with the same `clientId` changes nothing and answers the same, so
        a client can retry whenever it isn't sure. The track may be missing from
        disk, and only one deleted from the library is a 404. A `playedAt` ahead
        of the server's clock is taken as now.
      parameters:
        - $ref: "#/components/parameters/KitsuneRequest"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PlayReport" }
      responses:
        "204":
          description: The play is recorded.
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          description: Credentials are missing, invalid or expired.
          headers:
            WWW-Authenticate:
              schema: { type: string }
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        "403":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
  /me/listens:
    post:
      operationId: postListen
      summary: Record a listen's start, or how it ended.
      description: >-
        Every song a client starts is a listen, whether or not it counts as a
        play: shuffle learns from them. The client sends the start, and later
        the end, under one `clientId`; either may come alone, and a report sent
        again changes nothing. Once a listen has ended, nothing changes how.
        `skipped` means the person moved on before the end, and is the only
        ending that counts against a song: `stopped` (playback stopped or ran
        out) and `interrupted` (an error, or the app closing) never do. A
        `startedAt` ahead of the server's clock is taken as now. Plays and
        Last.fm are unchanged: `POST /me/plays` still reports a listen that
        counted.
      parameters:
        - $ref: "#/components/parameters/KitsuneRequest"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ListenReport" }
      responses:
        "204":
          description: The listen is recorded.
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          description: Credentials are missing, invalid or expired.
          headers:
            WWW-Authenticate:
              schema: { type: string }
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        "403":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
  /me/hearts/summary:
    get:
      operationId: getHeartsSummary
      summary: Count the hearts the caller kept from before stars were the only like.
      description: >-
        For the You page's one-time card that turns them into stars. Hearts
        show and weigh nowhere: they wait for the caller to choose. All zeros
        once there are none left, and the card isn't drawn.
      responses:
        "200":
          description: The counts.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/HeartsSummary" }
        "401":
          description: Credentials are missing, invalid or expired.
          headers:
            WWW-Authenticate:
              schema: { type: string }
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
  /me/hearts/convert:
    post:
      operationId: convertHearts
      summary: Turn the caller's hearts into stars, once.
      description: >-
        In one transaction: every hearted song without stars of its own gets
        `stars`, or stays unrated for null, and every song, album and artist
        heart of the caller's goes. Ratings the caller gave stay as they are.
        Nothing reaches Last.fm, since those songs were loved through their
        hearts. Each song rated is a `marks` event; a second call finds
        nothing to do.
      parameters:
        - $ref: "#/components/parameters/KitsuneRequest"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/HeartsConvert" }
      responses:
        "200":
          description: What it wrote.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/HeartsConverted" }
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          description: Credentials are missing, invalid or expired.
          headers:
            WWW-Authenticate:
              schema: { type: string }
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        "403":
          $ref: "#/components/responses/Problem"
  /me/ratings/tracks/{id}:
    put:
      operationId: putRating
      summary: Rate a track for the caller.
      description: >-
        Gives the track the caller's stars, ½ to 5 in halves, in place of any it
        had. An album's rating isn't stored: a client works it out from its
        tracks. Stars are the only like: with Last.fm loves on, a rating that
        crosses the caller's `loveFrom` line, from under it (unrated included)
        to at or over it, loves the song there, and one the other way unloves
        it. A rating that stays on one side sends nothing.
      parameters:
        - $ref: "#/components/parameters/KitsuneRequest"
        - $ref: "#/components/parameters/ItemID"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/Rating" }
      responses:
        "204":
          description: Done.
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          description: Credentials are missing, invalid or expired.
          headers:
            WWW-Authenticate:
              schema: { type: string }
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        "403":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
    delete:
      operationId: deleteRating
      summary: Clear the caller's rating of a track.
      description: >-
        Answers the same whether or not the track was rated, so a client can
        retry. Clearing a rating at or over the `loveFrom` line unloves the
        song on Last.fm, with loves on.
      parameters:
        - $ref: "#/components/parameters/KitsuneRequest"
        - $ref: "#/components/parameters/ItemID"
      responses:
        "204":
          description: Done.
        "401":
          description: Credentials are missing, invalid or expired.
          headers:
            WWW-Authenticate:
              schema: { type: string }
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        "403":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
  /me/home:
    get:
      operationId: getHome
      summary: What Home shows of the caller's listening.
      description: >-
        The albums the caller played most recently, newest first, and the ones
        they played most in the last 90 days by the server's clock, most first,
        ties to the latest play. Only plays count, not listens, and only plays
        of songs in the library now. Each list holds at most 25 albums.
      responses:
        "200":
          description: The caller's history.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Home" }
        "401":
          description: Credentials are missing, invalid or expired.
          headers:
            WWW-Authenticate:
              schema: { type: string }
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
  /me/listening:
    get:
      operationId: getListening
      summary: Count the caller's plays and rated tracks.
      responses:
        "200":
          description: The counts.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Listening" }
        "401":
          description: Credentials are missing, invalid or expired.
          headers:
            WWW-Authenticate:
              schema: { type: string }
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
  /me/password:
    post:
      operationId: changePassword
      summary: Change the caller's password.
      description: >-
        Needs the current password. A wrong one counts against the login rate
        limit, per client IP and per account. The new one follows the same
        rules as everywhere else: at least 8 characters, at most 1024 bytes.
        The session the request used stays signed in; the caller's others end.
      parameters:
        - $ref: "#/components/parameters/KitsuneRequest"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PasswordChange" }
      responses:
        "204":
          description: Changed, and the caller's other sessions ended.
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          description: Credentials are missing, invalid or expired.
          headers:
            WWW-Authenticate:
              schema: { type: string }
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        "403":
          description: >-
            The current password is wrong, or a cookie-authenticated request
            did not send X-Kitsune-Request.
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        "429":
          $ref: "#/components/responses/TooManyAttempts"
  /me/prefs/{key}:
    get:
      operationId: getPref
      summary: Return one of the caller's preferences.
      description: >-
        Preferences are the caller's own, such as the Library list's columns,
        and follow them from browser to browser. Server settings are never
        among them. A key the caller never set is a 404, as is an unknown key,
        and so is a value kept from before its key's rule changed: the client
        uses its defaults.
      parameters:
        - $ref: "#/components/parameters/PrefKey"
      responses:
        "200":
          description: The value, as its key's schema has it.
          headers:
            Cache-Control:
              schema: { type: string }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PrefValue" }
        "401":
          description: Credentials are missing, invalid or expired.
          headers:
            WWW-Authenticate:
              schema: { type: string }
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        "404":
          $ref: "#/components/responses/Problem"
    put:
      operationId: putPref
      summary: Set one of the caller's preferences.
      description: >-
        Replaces the value. Each key has its own schema, and a value that breaks
        it, or is over 4 KiB, is a 400. An unknown key is a 404.
      parameters:
        - $ref: "#/components/parameters/KitsuneRequest"
        - $ref: "#/components/parameters/PrefKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PrefValue" }
      responses:
        "204":
          description: Kept.
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          description: Credentials are missing, invalid or expired.
          headers:
            WWW-Authenticate:
              schema: { type: string }
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        "403":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
  /me/playback:
    get:
      operationId: getPlayback
      summary: Return where the caller left off.
      description: >-
        Where the caller left off, resolved against the library now: gone songs
        are left out, and each song carries its album as it is today. When the
        song saved as current is gone, the next one after it that exists is
        current, at 0 ms, and `moved` says so. 404 when nothing is remembered,
        or nothing of it is left.
      responses:
        "200":
          description: The record.
          headers:
            Cache-Control:
              schema: { type: string }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Playback" }
        "401":
          description: Credentials are missing, invalid or expired.
          headers:
            WWW-Authenticate:
              schema: { type: string }
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        "404":
          $ref: "#/components/responses/Problem"
    put:
      operationId: putPlayback
      summary: Remember where the caller is.
      description: >-
        Replaces the record. Last write wins, and no event is published. At most
        1,000 songs across `tracks`, `later` and `shuffled.order`, and a body
        of at most 64 KiB.
      parameters:
        - $ref: "#/components/parameters/KitsuneRequest"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PlaybackSave" }
      responses:
        "204":
          description: Kept.
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          description: Credentials are missing, invalid or expired.
          headers:
            WWW-Authenticate:
              schema: { type: string }
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        "403":
          $ref: "#/components/responses/Problem"
  /me/shuffle/rules:
    get:
      operationId: getShuffleRules
      summary: Return the caller's shuffle rules touching some songs.
      description: >-
        Shuffle rules are the caller's own, kept on the server and never in a
        file. A run is songs combined: they always play together in shuffle,
        in its order. An excluded song is one shuffle never picks. Every run
        holding one of the songs comes whole. Unknown songs are ignored.
      parameters:
        - name: tracks
          in: query
          required: true
          description: Track IDs joined by commas, from 1 to 1000.
          style: form
          explode: false
          schema:
            type: array
            minItems: 1
            items: { type: string }
      responses:
        "200":
          description: The runs and the excluded songs.
          headers:
            Cache-Control:
              schema: { type: string }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ShuffleRules" }
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          description: Credentials are missing, invalid or expired.
          headers:
            WWW-Authenticate:
              schema: { type: string }
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
  /me/shuffle/runs:
    put:
      operationId: putShuffleRun
      summary: Combine songs into one of the caller's runs, in order.
      description: >-
        The songs become one run, in the order given. A song already in
        another run leaves it, and a run left with fewer than two songs goes:
        a song is in at most one run, so a cycle can't be made. The run keeps
        the ID of the run its first song was in when that run has gone, so a
        reorder is the same run. Fewer than two songs, or one named twice, is
        a 400; an unknown song is a 404.
      parameters:
        - $ref: "#/components/parameters/KitsuneRequest"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ShuffleTracks" }
      responses:
        "200":
          description: The run.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ShuffleRun" }
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          description: Credentials are missing, invalid or expired.
          headers:
            WWW-Authenticate:
              schema: { type: string }
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        "404":
          $ref: "#/components/responses/Problem"
  /me/shuffle/runs/{id}:
    delete:
      operationId: deleteShuffleRun
      summary: Undo one of the caller's runs.
      description: The songs stay, each on its own. Another person's run is a 404.
      parameters:
        - $ref: "#/components/parameters/KitsuneRequest"
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "204":
          description: Undone.
        "401":
          description: Credentials are missing, invalid or expired.
          headers:
            WWW-Authenticate:
              schema: { type: string }
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        "404":
          $ref: "#/components/responses/Problem"
  /me/shuffle/excluded:
    put:
      operationId: putShuffleExcluded
      summary: Leave songs out of the caller's shuffle.
      description: >-
        Shuffle never picks them. They still play when chosen, when their album
        plays in order, and as part of a run. Excluding one again changes
        nothing. An unknown song is a 404, and nothing changes.
      parameters:
        - $ref: "#/components/parameters/KitsuneRequest"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ShuffleTracks" }
      responses:
        "204":
          description: Left out.
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          description: Credentials are missing, invalid or expired.
          headers:
            WWW-Authenticate:
              schema: { type: string }
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        "404":
          $ref: "#/components/responses/Problem"
    delete:
      operationId: deleteShuffleExcluded
      summary: Let songs back into the caller's shuffle.
      description: The undoing of `PUT`, as idempotent. An unknown song is a 404.
      parameters:
        - $ref: "#/components/parameters/KitsuneRequest"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ShuffleTracks" }
      responses:
        "204":
          description: Let back in.
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          description: Credentials are missing, invalid or expired.
          headers:
            WWW-Authenticate:
              schema: { type: string }
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        "404":
          $ref: "#/components/responses/Problem"
  /me/shuffles:
    post:
      operationId: postShuffle
      summary: Start a shuffle, and return its first page.
      description: >-
        A shuffle is a session the caller can continue on any device: by its
        `id`, `GET /me/shuffles/{id}/next` gives the page after any position it
        has reached. `finite` plays every unit once (a unit is a song, or a run
        of combined songs, which plays whole from its first song); `endless`
        goes on page by page, each worked out from what the caller's listening
        says by then. Songs excluded from shuffle are never picked, but a run
        holding one plays it. A run holding a song in scope plays whole, even
        into another album. `first` leads, even an excluded song: it is the
        song the client chose to start from, and may already be playing. An
        unknown `first` leads nothing. A scope with nothing to pick is a
        session with no picks. An unknown album or artist is a 404.
      parameters:
        - $ref: "#/components/parameters/KitsuneRequest"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ShuffleStart" }
      responses:
        "201":
          description: The session, with its first page.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ShufflePage" }
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          description: Credentials are missing, invalid or expired.
          headers:
            WWW-Authenticate:
              schema: { type: string }
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        "403":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
  /me/shuffles/{id}/next:
    get:
      operationId: getShuffleNext
      summary: Return a shuffle's page after a position.
      description: >-
        `after` is usually the last page's `to`, and then the shuffle moves on:
        an endless page is worked out now, from what the caller's listening
        says. A device that is behind gets what was given from `after` on,
        while the session keeps it (its last few pages); past that, the oldest
        it keeps, whose `from` says where it starts. A position the shuffle
        hasn't reached is a 400. Another person's shuffle is a 404.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
        - name: after
          in: query
          required: true
          schema: { type: integer, format: int64, minimum: 0 }
      responses:
        "200":
          description: The page.
          headers:
            Cache-Control:
              schema: { type: string }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ShufflePage" }
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          description: Credentials are missing, invalid or expired.
          headers:
            WWW-Authenticate:
              schema: { type: string }
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        "404":
          $ref: "#/components/responses/Problem"
  /me/playlists:
    get:
      operationId: getPlaylists
      summary: List the caller's playlists, by name.
      description: >-
        A playlist is its person's alone: nobody else sees or changes it. Its
        counts, time and mosaic are of songs in the library, so one in Trash
        leaves them until it comes back. `holding` names up to 1,000 songs,
        joined by commas, in one parameter or several: each playlist then says
        how many of them it holds, each once (`holds`), which is how a client
        marks one that has them already. A smart playlist (`smart`) is worked
        out as it is listed: its counts, time and mosaic are of the songs its
        rules choose now. With `holding` smart playlists are left out, since
        nothing is added to one. The server's file playlists (`source` `file`),
        read from `.m3u` and `.m3u8` files in the library, are listed for
        everyone beside the caller's own, and left out with `holding` too.
      parameters:
        - name: holding
          in: query
          required: false
          schema: { type: string }
      responses:
        "200":
          description: The playlists.
          headers:
            Cache-Control:
              schema: { type: string }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Playlists" }
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          description: Credentials are missing, invalid or expired.
          headers:
            WWW-Authenticate:
              schema: { type: string }
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
    post:
      operationId: postPlaylist
      summary: Make a playlist, empty or with songs.
      description: >-
        The name is 1 to 200 characters once trimmed, and need not be unique.
        Songs go in as `POST /me/playlists/{id}/tracks` puts them, each once.
        Songs or albums not in the library (unknown, missing or in Trash) are a
        422 naming them, and then nothing is made; so is more than 10,000
        songs. With `rules` it is a smart playlist instead, which holds no
        entries: its rules choose its songs each time it is read. Rules a smart
        playlist can't have, rules that name the playlist itself through
        another, and `rules` with `tracks` or `albums`, are a 422
        (`SmartProblem`). `seed` orders its random choices, as the preview that
        showed them did; absent, the server draws one.
      parameters:
        - $ref: "#/components/parameters/KitsuneRequest"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PlaylistCreate" }
      responses:
        "201":
          description: The playlist, and what went in.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PlaylistAdded" }
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          description: Credentials are missing, invalid or expired.
          headers:
            WWW-Authenticate:
              schema: { type: string }
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        "422":
          description: >-
            Songs or albums not in the library (`PlaylistProblem`), or rules a
            smart playlist can't have (`SmartProblem`).
          content:
            application/problem+json:
              schema:
                anyOf:
                  - { $ref: "#/components/schemas/PlaylistProblem" }
                  - { $ref: "#/components/schemas/SmartProblem" }
  /me/playlists/preview:
    post:
      operationId: postPlaylistPreview
      summary: Work out what smart rules would choose, without saving them.
      description: >-
        What a rules editor's live card shows: how many songs the rules choose
        and how long they run, how many match before the limit, and the first
        40 in order, each with what the card shows of it and never a path.
        `id` names the smart playlist being edited, whose seed a random choice
        then follows, so the card shows what saving would; without it, `seed`
        does (absent: 0). A playlist rule follows the caller's own playlists
        as they are saved. Another person's `id` is a 404.
      parameters:
        - $ref: "#/components/parameters/KitsuneRequest"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SmartPreviewRequest" }
      responses:
        "200":
          description: What the rules choose now.
          headers:
            Cache-Control:
              schema: { type: string }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SmartPreview" }
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          description: Credentials are missing, invalid or expired.
          headers:
            WWW-Authenticate:
              schema: { type: string }
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        "404":
          $ref: "#/components/responses/Problem"
        "422":
          $ref: "#/components/responses/SmartProblem"
  /me/playlists/{id}:
    get:
      operationId: getPlaylist
      summary: Return one of the caller's playlists with its songs in order.
      description: >-
        Each entry has its own ID, which a move or a take-out names (a song in
        twice is two entries), and its song as the library index has it, with
        the caller's stars. Only songs in the library are listed: one in Trash
        comes back with Restore, in its place. A smart playlist is worked out as
        it is read, in the order its rules give, with its `rules`; its entries'
        IDs say only where each song is, since it has no entries to move or take
        out, and each track carries what rules read and order by (`plays`,
        `lastPlayedAt`, `addedAt`, `year`, `format`, `bitrate`). A file
        playlist, which everyone sees, is the file's songs in its order with its
        repeats, and `missing` lists the lines that found no song. Another
        person's playlist is a 404.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: The playlist.
          headers:
            Cache-Control:
              schema: { type: string }
            Content-Encoding:
              schema: { type: string }
            Vary:
              schema: { type: string }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PlaylistDetail" }
        "401":
          description: Credentials are missing, invalid or expired.
          headers:
            WWW-Authenticate:
              schema: { type: string }
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        "404":
          $ref: "#/components/responses/Problem"
    patch:
      operationId: patchPlaylist
      summary: Rename one of the caller's playlists, or change a smart one's rules.
      description: >-
        The name is 1 to 200 characters once trimmed. `rules` changes a smart
        playlist's rules, checked as `POST /me/playlists` checks them; on a
        regular playlist it is a 409, and so is any change to a file playlist,
        which belongs to its file. A change names `name`, `rules` or both.
        Another person's playlist is a 404.
      parameters:
        - $ref: "#/components/parameters/KitsuneRequest"
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PlaylistChange" }
      responses:
        "200":
          description: The playlist, changed.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Playlist" }
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          description: Credentials are missing, invalid or expired.
          headers:
            WWW-Authenticate:
              schema: { type: string }
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        "404":
          $ref: "#/components/responses/Problem"
        "409":
          $ref: "#/components/responses/Problem"
        "422":
          $ref: "#/components/responses/SmartProblem"
    delete:
      operationId: deletePlaylist
      summary: Delete one of the caller's playlists.
      description: >-
        Its songs stay in the library. Another person's playlist is a 404, and a
        file playlist a 409: deleting its file deletes it.
      parameters:
        - $ref: "#/components/parameters/KitsuneRequest"
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "204":
          description: Deleted.
        "401":
          description: Credentials are missing, invalid or expired.
          headers:
            WWW-Authenticate:
              schema: { type: string }
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        "404":
          $ref: "#/components/responses/Problem"
        "409":
          $ref: "#/components/responses/Problem"
  /me/playlists/{id}/tracks:
    post:
      operationId: postPlaylistTracks
      summary: Put songs in one of the caller's playlists.
      description: >-
        The albums' songs go in first, each album's in the order the Library
        lists them, then the tracks, in the order named: at the end, or just
        before the entry `before`. A song the playlist holds already, or one
        named twice, is skipped and listed in `skipped`, unless `again`, which
        adds it anyway. Songs or albums not in the library (unknown, missing or
        in Trash) are a 422 naming them, and so is taking the playlist past
        10,000 songs; then nothing is added. Another person's playlist, or a
        `before` it doesn't hold, is a 404. A smart playlist is a 409: its
        rules choose its songs. So is a file playlist: its file does.
      parameters:
        - $ref: "#/components/parameters/KitsuneRequest"
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PlaylistAdd" }
      responses:
        "200":
          description: What went in, what was skipped, and the playlist after.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PlaylistAdded" }
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          description: Credentials are missing, invalid or expired.
          headers:
            WWW-Authenticate:
              schema: { type: string }
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        "404":
          $ref: "#/components/responses/Problem"
        "409":
          $ref: "#/components/responses/Problem"
        "422":
          $ref: "#/components/responses/PlaylistProblem"
  /me/playlists/{id}/entries:
    delete:
      operationId: deletePlaylistEntries
      summary: Take entries out of one of the caller's playlists.
      description: >-
        The songs stay in the library. An entry the playlist doesn't hold is
        left alone, and the response lists only those taken out. Another
        person's playlist is a 404, and a smart or file one a 409.
      parameters:
        - $ref: "#/components/parameters/KitsuneRequest"
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PlaylistEntries" }
      responses:
        "200":
          description: The entries taken out.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PlaylistEntries" }
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          description: Credentials are missing, invalid or expired.
          headers:
            WWW-Authenticate:
              schema: { type: string }
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        "404":
          $ref: "#/components/responses/Problem"
        "409":
          $ref: "#/components/responses/Problem"
  /me/playlists/{id}/move:
    post:
      operationId: postPlaylistMove
      summary: Move an entry of one of the caller's playlists.
      description: >-
        The entry goes just before `before`, or just after `after`: exactly one
        of them. Only that entry is written. Another person's playlist, or an
        entry it doesn't hold, is a 404. A smart playlist is a 409: its rules
        set its order. So is a file playlist: its file does.
      parameters:
        - $ref: "#/components/parameters/KitsuneRequest"
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PlaylistMove" }
      responses:
        "204":
          description: Moved.
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          description: Credentials are missing, invalid or expired.
          headers:
            WWW-Authenticate:
              schema: { type: string }
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        "404":
          $ref: "#/components/responses/Problem"
        "409":
          $ref: "#/components/responses/Problem"
  /me/playlists/{id}/seed:
    post:
      operationId: postPlaylistSeed
      summary: Pick again, drawing a new seed for a smart playlist's random choices.
      description: >-
        A smart playlist chosen at random, or shuffled once, keeps its seed so
        it reads the same each time it opens; this draws a new one. A regular
        or file playlist is a 409, and another person's a 404.
      parameters:
        - $ref: "#/components/parameters/KitsuneRequest"
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: The playlist, as its new seed has it.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Playlist" }
        "401":
          description: Credentials are missing, invalid or expired.
          headers:
            WWW-Authenticate:
              schema: { type: string }
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        "404":
          $ref: "#/components/responses/Problem"
        "409":
          $ref: "#/components/responses/Problem"
  /me/playlists/{id}/copy:
    post:
      operationId: postPlaylistCopy
      summary: Copy one of the caller's playlists to a new regular one.
      description: >-
        The copy is a regular playlist named "<name> (copy)", cut to 200
        characters, holding the songs in the order they are now: a smart
        playlist's as its rules choose them. It changes on its own from then
        on. A copy past 10,000 songs is a 422, and then nothing is made. A file
        playlist copies too: that is how a person makes one their own. Another
        person's playlist is a 404.
      parameters:
        - $ref: "#/components/parameters/KitsuneRequest"
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "201":
          description: The new playlist.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Playlist" }
        "401":
          description: Credentials are missing, invalid or expired.
          headers:
            WWW-Authenticate:
              schema: { type: string }
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        "404":
          $ref: "#/components/responses/Problem"
        "422":
          $ref: "#/components/responses/PlaylistProblem"
  /me/playlists/{id}/m3u:
    get:
      operationId: getPlaylistM3U
      summary: Export a playlist as an .m3u8 file.
      description: >-
        A snapshot of any playlist the caller sees, file playlists included:
        `#EXTM3U`, then for each song `#EXTINF:<seconds>,<artist> - <title>`
        and its path, relative to the song's own library folder, so no library
        folder is ever named. UTF-8 with no BOM and `\n` line ends. A smart
        playlist exports what its rules choose now. The file name is the
        playlist's, with path separators, control characters and a leading dot
        dropped, cut to 120 bytes. Another person's playlist is a 404.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: The file.
          headers:
            Cache-Control:
              schema: { type: string }
            Content-Disposition:
              schema: { type: string }
          content:
            audio/x-mpegurl:
              schema: { type: string }
        "401":
          description: Credentials are missing, invalid or expired.
          headers:
            WWW-Authenticate:
              schema: { type: string }
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        "404":
          $ref: "#/components/responses/Problem"
  /me/lastfm:
    get:
      operationId: getLastfm
      summary: Report the caller's Last.fm connection.
      description: >-
        Whether the server has a Last.fm key, whether the caller is connected,
        what they send, and how the sending goes. The session key never leaves
        the server.
      responses:
        "200":
          description: The connection.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LastfmStatus" }
        "401":
          description: Credentials are missing, invalid or expired.
          headers:
            WWW-Authenticate:
              schema: { type: string }
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
    patch:
      operationId: patchLastfm
      summary: Change what the caller sends to Last.fm.
      description: >-
        A switch the body leaves out stays as it is. Turning one off sends
        nothing new of its kind; what already waits still goes.
      parameters:
        - $ref: "#/components/parameters/KitsuneRequest"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LastfmSwitches" }
      responses:
        "200":
          description: The connection, changed.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LastfmStatus" }
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          description: Credentials are missing, invalid or expired.
          headers:
            WWW-Authenticate:
              schema: { type: string }
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        "403":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
    delete:
      operationId: deleteLastfm
      summary: Disconnect the caller's Last.fm account.
      description: >-
        Forgets the session and everything waiting to be sent. Answers the same
        when there was nothing to disconnect.
      parameters:
        - $ref: "#/components/parameters/KitsuneRequest"
      responses:
        "204":
          description: Disconnected.
        "401":
          description: Credentials are missing, invalid or expired.
          headers:
            WWW-Authenticate:
              schema: { type: string }
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        "403":
          $ref: "#/components/responses/Problem"
  /me/lastfm/connect:
    post:
      operationId: connectLastfm
      summary: Start connecting the caller's Last.fm account.
      description: >-
        Returns the last.fm page to send the browser to, and sets the
        short-lived kitsune_lastfm_state cookie that the callback checks.
        Last.fm sends the browser back to GET /lastfm/callback.
      parameters:
        - $ref: "#/components/parameters/KitsuneRequest"
      responses:
        "200":
          description: Where to go.
          headers:
            Set-Cookie:
              schema: { type: string }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LastfmConnect" }
        "401":
          description: Credentials are missing, invalid or expired.
          headers:
            WWW-Authenticate:
              schema: { type: string }
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        "403":
          $ref: "#/components/responses/Problem"
        "409":
          description: The server has no Last.fm key.
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
  /lastfm/callback:
    get:
      operationId: lastfmCallback
      summary: Finish connecting a Last.fm account.
      description: >-
        Where last.fm sends the browser back. It needs the session cookie and
        the state cookie from POST /me/lastfm/connect, which must match `state`
        and belong to the same user. It always redirects to the You page, with
        `lastfm` set to `connected`, `refused` or `failed`, and never answers
        with a page.
      security: []
      parameters:
        - name: token
          in: query
          required: false
          description: Last.fm's one-time token; absent when the user said no.
          schema: { type: string }
        - name: state
          in: query
          required: false
          schema: { type: string }
        - name: kitsune_lastfm_state
          in: cookie
          required: false
          description: The value POST /me/lastfm/connect set; it must match `state`.
          schema: { type: string }
      responses:
        "303":
          description: Back to the You page.
          headers:
            Location:
              required: true
              schema: { type: string }
            Set-Cookie:
              description: Clears the state cookie.
              schema: { type: string }
  /me/now-playing:
    post:
      operationId: postNowPlaying
      summary: Say that the caller started a track.
      description: >-
        Tells Last.fm in the background, when the caller is connected and
        shows what's playing. Best effort: nothing is retried, and it answers
        the same whatever happens.
      parameters:
        - $ref: "#/components/parameters/KitsuneRequest"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/NowPlaying" }
      responses:
        "204":
          description: Noted.
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          description: Credentials are missing, invalid or expired.
          headers:
            WWW-Authenticate:
              schema: { type: string }
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        "403":
          $ref: "#/components/responses/Problem"
  /events:
    get:
      operationId: getEvents
      summary: Hear every change, as server-sent events.
      description: >-
        One stream per client, open for as long as it likes. Each event's
        `event:` is its kind and its `data:` one line of JSON; events carry ids
        and versions, never whole objects, and a client fetches what it needs
        through the other routes. Who hears what: `library`
        (`EventLibrary`), `scan` (`ScanStatus`, with the failure's reason for
        administrators only), `artists` (`EventArtists`) and
        `ready`/`resync` (`EventStream`) go to everyone; `fingerprints` (`FingerprintStatus`), `loudness`
        (`LoudnessStatus`), `organize` (`EventOrganize`), `replaygain`
        (`EventReplayGain`) and `settings`
        (`EventSettings`) to administrators; `marks` (`EventMarks`), `prefs`
        (`EventPrefs`), `shuffle-rules` (`EventShuffleRules`), `shuffle`
        (`EventShuffle`), `listening`
        (`EventListening`), `lastfm` (`EventLastfm`) and `playlists`
        (`EventPlaylists`) to the person they are
        about, on every device. The stream opens with `ready`, whose id is
        where it stands. Sent back as `Last-Event-ID`, an id gets what was
        missed since, while the server still has it (5 minutes, or 10,000
        events); otherwise the stream opens with `resync` instead, and the
        client fetches everything again. A client too slow to keep up is
        dropped. A comment line every 25 s keeps proxies from closing it.
      parameters:
        - name: Last-Event-ID
          in: header
          required: false
          description: The id of the last event taken, to resume after it.
          schema: { type: string }
      responses:
        "200":
          description: The stream, until the client or the server ends it.
          headers:
            Cache-Control:
              schema: { type: string, const: no-store }
            X-Accel-Buffering:
              description: "`no`: a proxy must pass each event on at once."
              schema: { type: string, const: "no" }
          content:
            text/event-stream:
              schema: { type: string }
        "401":
          description: Credentials are missing, invalid or expired.
          headers:
            WWW-Authenticate:
              schema: { type: string }
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
  /artwork/{hash}:
    get:
      operationId: getArtwork
      summary: Return an image's rendition.
      description: >-
        Covers, artist images and album extras are rendered during library
        scans, so this reads a file. Each kind has its ladder: covers, thumbs
        and back covers 128, 512 and 1024; backgrounds and banners 128, 640,
        1920 and 3840; logos and disc art 128, 400 and 800. The hash names the
        source image, which never changes under it: the response is cached for
        a year and marked immutable. A `size` the image has no rendition for
        gets the largest rendition at or below it, or the smallest there is.
        The image is never upscaled, so a small source is returned at its own
        size. It is JPEG, or PNG for an image whose `alpha` is true, which
        keeps its transparency. Range requests are not supported.
      parameters:
        - name: hash
          in: path
          required: true
          description: SHA-256 of the source image, as 64 lowercase hex digits.
          schema: { type: string, pattern: "^[0-9a-f]{64}$" }
        - name: size
          in: query
          required: false
          description: Longest side in pixels.
          schema: { type: integer, enum: [128, 400, 512, 640, 800, 1024, 1920, 3840], default: 512 }
        - name: If-None-Match
          in: header
          required: false
          schema: { type: string }
      responses:
        "200":
          description: The image, as JPEG or PNG.
          headers:
            ETag:
              schema: { type: string }
            Cache-Control:
              schema: { type: string }
          content:
            image/jpeg:
              schema: { type: string, format: binary }
            image/png:
              schema: { type: string, format: binary }
        "304":
          description: The client's copy is current.
          headers:
            ETag:
              schema: { type: string }
            Cache-Control:
              schema: { type: string }
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          description: Credentials are missing, invalid or expired.
          headers:
            WWW-Authenticate:
              schema: { type: string }
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        "404":
          $ref: "#/components/responses/Problem"
  /albums:
    get:
      operationId: getAlbums
      summary: List albums, a page at a time.
      description: >-
        Albums with at least one live track. Paging is by keyset: pass the
        previous page's `nextCursor` as `cursor`. A cursor is opaque and belongs
        to the `sort` that issued it. The `name` sort ignores case and breaks
        ties by the album's internal ID.
      parameters:
        - name: sort
          in: query
          required: false
          description: "`added` lists the newest albums first; `name` sorts by sort name."
          schema: { type: string, enum: [added, name], default: added }
        - name: limit
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 200, default: 60 }
        - name: cursor
          in: query
          required: false
          schema: { type: string }
      responses:
        "200":
          description: A page of albums.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AlbumPage" }
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          description: Credentials are missing, invalid or expired.
          headers:
            WWW-Authenticate:
              schema: { type: string }
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
  /albums/{id}:
    get:
      operationId: getAlbum
      summary: Return an album and its tracks.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: The album.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AlbumDetail" }
        "401":
          description: Credentials are missing, invalid or expired.
          headers:
            WWW-Authenticate:
              schema: { type: string }
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        "404":
          $ref: "#/components/responses/Problem"
  /albums/{id}/tags:
    get:
      operationId: getAlbumTags
      summary: Return every tag of an album, for a tag editor.
      description: >-
        For administrators. Read from the files, not the library, so it shows
        what an edit will change. Field values never name a format's keys.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: The tags of each live track, in album order.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AlbumTags" }
        "401":
          description: Credentials are missing, invalid or expired.
          headers:
            WWW-Authenticate:
              schema: { type: string }
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        "403":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "409":
          description: A file is gone, and a scan has yet to notice.
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
  /albums/{id}/edits:
    post:
      operationId: postAlbumEdit
      summary: Edit the tags of an album's tracks, in their files.
      description: >-
        For administrators, on a server with `library.tag_writes` on: anything
        else is a 403. Files are checked first, then written in track order.
        Each is atomic and the album is not, so a failure partway is reported
        with `changed` and `remaining`: read the tags again and send the same
        edit to finish it. A client that goes away doesn't stop the edit. An
        edit during a scan is a 409 for as long as the scan runs.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
        - name: If-Match
          in: header
          required: false
          description: >-
            The `etag` from the last read or edit, verbatim. A missing one, or
            `*`, is a 428.
          schema: { type: string }
        - $ref: "#/components/parameters/KitsuneRequest"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AlbumEdit" }
      responses:
        "200":
          description: >-
            The album with its new values and ETag. An edit that moved every
            track to another album answers with that album, whose `id` the
            client follows: the old one is gone, merged into it.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AlbumDetail" }
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          description: Credentials are missing, invalid or expired.
          headers:
            WWW-Authenticate:
              schema: { type: string }
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        "403":
          $ref: "#/components/responses/EditFailure"
        "404":
          $ref: "#/components/responses/Problem"
        "409":
          description: A scan or another edit holds the library.
          headers:
            Retry-After:
              description: Seconds to wait before trying again.
              schema: { type: integer }
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        "412":
          $ref: "#/components/responses/EditFailure"
        "422":
          $ref: "#/components/responses/EditFailure"
        "428":
          $ref: "#/components/responses/Problem"
        "500":
          $ref: "#/components/responses/EditFailure"
  /albums/{id}/matches:
    post:
      operationId: postAlbumMatches
      summary: Find the releases an album may be, on MusicBrainz.
      description: >-
        For administrators. Proposes only: nothing is written. Asks for the
        album's own title and album artist, or for the terms in the body, and
        always for the releases its files already name. Each candidate has a
        confidence from 0 to 100 and the evidence it rests on, as facts for the
        client to word. MusicBrainz takes a request a second, so a first ask
        can take seconds; answers are kept for a day. `prefetch` marks work done
        ahead, such as the queue asking for the next albums: it waits behind
        anything a person is waiting on.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
        - $ref: "#/components/parameters/KitsuneRequest"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MatchRequest" }
      responses:
        "200":
          description: The candidates, best first. None is not a failure.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MatchList" }
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          description: Credentials are missing, invalid or expired.
          headers:
            WWW-Authenticate:
              schema: { type: string }
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        "403":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "503":
          description: >-
            MusicBrainz can't be reached, or stayed busy, or matching isn't
            set up here.
          headers:
            Retry-After:
              description: Seconds to wait before trying again.
              schema: { type: integer }
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
  /matches/{id}:
    get:
      operationId: getMatch
      summary: Look at one candidate closely, against its album.
      description: >-
        For administrators. The release's values as fields, what every track
        would take, and which release track each album track pairs with.
        Fields the release has nothing for are left out: matching never
        proposes taking a value away. `albumIds` and each track's `ids` are the
        MusicBrainz IDs, which a client writes with whatever is accepted.
        Applying is `POST /albums/{id}/edits`.
      parameters:
        - name: id
          in: path
          required: true
          description: A candidate's `id`, from `POST /albums/{id}/matches`.
          schema: { type: string }
      responses:
        "200":
          description: The candidate, closely.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MatchReview" }
        "401":
          description: Credentials are missing, invalid or expired.
          headers:
            WWW-Authenticate:
              schema: { type: string }
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        "403":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "503":
          description: >-
            MusicBrainz can't be reached, or stayed busy, or matching isn't
            set up here.
          headers:
            Retry-After:
              description: Seconds to wait before trying again.
              schema: { type: integer }
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
  /matching/queue:
    get:
      operationId: getMatchingQueue
      summary: List the albums to match.
      description: >-
        For administrators. Every album with live songs and no MusicBrainz
        release ID is to do, unless it was skipped; albums matched here stay,
        as matched. In sort order.
      responses:
        "200":
          description: The queue.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MatchQueue" }
        "401":
          description: Credentials are missing, invalid or expired.
          headers:
            WWW-Authenticate:
              schema: { type: string }
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        "403":
          $ref: "#/components/responses/Problem"
  /matching/albums/{id}:
    put:
      operationId: putMatchingAlbum
      summary: Say where an album stands in the matching queue.
      description: >-
        For administrators. `skipped` sets it aside, `matched` records it as
        matched here, and `todo` forgets either.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
        - $ref: "#/components/parameters/KitsuneRequest"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MatchStateChange" }
      responses:
        "204":
          description: Saved.
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          description: Credentials are missing, invalid or expired.
          headers:
            WWW-Authenticate:
              schema: { type: string }
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        "403":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
  /edits:
    post:
      operationId: postEdits
      summary: Edit the tags of tracks that may lie on several albums, in their files.
      description: >-
        For administrators, on a server with `library.tag_writes` on: anything
        else is a 403. A selection's edit: `albums` gives the `etag` of every
        album the tracks are on, as read, and every one is compared, and every
        file checked, before any is written. A stale one is a 412 naming it,
        with nothing written. Then files are written album by album, in the
        order `albums` names them, and each album's in track order. Each is
        atomic and the edit is not, so a failure partway is reported with
        `changed` and `remaining`: read the albums again and send the same edit
        to finish it. Giving tracks another album or album artist moves them,
        keeping their IDs, plays and ratings, and an album they all
        leave for one other merges into it. A client that goes away doesn't
        stop the edit. An edit during a scan is a 409.
      parameters:
        - $ref: "#/components/parameters/KitsuneRequest"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TracksEdit" }
      responses:
        "200":
          description: Each track and the album it is on now.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EditedTracks" }
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          description: Credentials are missing, invalid or expired.
          headers:
            WWW-Authenticate:
              schema: { type: string }
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        "403":
          $ref: "#/components/responses/EditFailure"
        "404":
          $ref: "#/components/responses/Problem"
        "409":
          description: A scan or another edit holds the library.
          headers:
            Retry-After:
              description: Seconds to wait before trying again.
              schema: { type: integer }
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        "412":
          $ref: "#/components/responses/EditFailure"
        "422":
          $ref: "#/components/responses/EditFailure"
        "500":
          $ref: "#/components/responses/EditFailure"
  /artists:
    get:
      operationId: getArtists
      summary: List the artists who own an album, whole.
      description: >-
        An album belongs to its album artists; with none, to the first artist of
        its tracks, unless it is a compilation. Sorted by sort name, ignoring
        case, then ID: a client orders its copy as it likes. Various Artists is
        never listed. Guests are found through search and links.
      responses:
        "200":
          description: The artists.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ArtistList" }
        "401":
          description: Credentials are missing, invalid or expired.
          headers:
            WWW-Authenticate:
              schema: { type: string }
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
  /artists/{id}:
    get:
      operationId: getArtist
      summary: Return an artist and its albums.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: The artist.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ArtistDetail" }
        "401":
          description: Credentials are missing, invalid or expired.
          headers:
            WWW-Authenticate:
              schema: { type: string }
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        "404":
          $ref: "#/components/responses/Problem"
  /admin/library/scan:
    post:
      operationId: postScan
      summary: Start a scan.
      description: >-
        For administrators. The scan is claimed before this answers, so a 202
        means it is running, and a 409 means another one is. It runs on after the
        response: `GET /library` follows it. A Quick scan reads new and changed
        files, a Full one every file. Neither changes a file.
      parameters:
        - $ref: "#/components/parameters/KitsuneRequest"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ScanRequest" }
      responses:
        "202":
          description: The scan has started.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ScanStatus" }
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          description: Credentials are missing, invalid or expired.
          headers:
            WWW-Authenticate:
              schema: { type: string }
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        "403":
          $ref: "#/components/responses/Problem"
        "409":
          $ref: "#/components/responses/Problem"
        "503":
          $ref: "#/components/responses/Problem"
  /admin/library/issues:
    get:
      operationId: getIssues
      summary: List what scans had trouble with.
      description: >-
        For administrators: `GET /library` gives everyone the counts. Paths are
        relative to their library root, and messages hold no root. A Full scan
        does not clear an issue: a file stays listed until it is readable or
        gone.
      responses:
        "200":
          description: Files that could not be read and tracks read with warnings.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ScanIssues" }
        "401":
          description: Credentials are missing, invalid or expired.
          headers:
            WWW-Authenticate:
              schema: { type: string }
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        "403":
          $ref: "#/components/responses/Problem"
  /admin/metadata:
    get:
      operationId: getMetadata
      summary: Read how artist art and bios are fetched.
      description: >-
        For administrators: Health's Metadata card. Whether lookups are on
        (`metadata.remote`, off on a new server) and the language wanted; how
        each source stands (`musicbrainz`, which names an artist's Wikidata
        item and an album's release group; `wikipedia`, which is Wikipedia,
        Wikidata and Commons; `fanarttv`, artists' art and albums' disc art;
        `lastfm`, the bio of an artist no one else gave one, through
        `lastfm.api_key`; and `coverartarchive`, the front cover of an album
        whose files have none and a back cover its folder lacks), with whether
        its keys are set, never their values, and its last failure in words;
        where the pass stands, artists first, then albums; the library's album
        artists by what it has of them, `withoutMbid` being those only Matching
        can give art (by matching their albums); and its albums by their
        covers. Lookups send MusicBrainz IDs and nothing else. Progress isn't
        an event: read this again while `pass.running`.
      responses:
        "200":
          description: The status.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MetadataStatus" }
        "401":
          description: Credentials are missing, invalid or expired.
          headers:
            WWW-Authenticate:
              schema: { type: string }
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        "403":
          $ref: "#/components/responses/Problem"
        "503":
          description: The artist pass isn't set up on this server.
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
  /admin/users:
    get:
      operationId: getUsers
      summary: List every account.
      description: >-
        For administrators, by name. Each says when its newest live session was
        last used and how many are live; neither ever carries a token.
      responses:
        "200":
          description: Every account.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Accounts" }
        "401":
          description: Credentials are missing, invalid or expired.
          headers:
            WWW-Authenticate:
              schema: { type: string }
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        "403":
          $ref: "#/components/responses/Problem"
  /admin/users/{id}/password:
    post:
      operationId: setUserPassword
      summary: Set someone's password.
      description: >-
        For administrators, for anyone but themselves: their own changes
        through `POST /me/password`, which asks for the current one. Every
        session of the person ends.
      parameters:
        - $ref: "#/components/parameters/KitsuneRequest"
        - name: id
          in: path
          required: true
          description: The user's ID.
          schema: { type: integer, format: int64 }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PasswordSet" }
      responses:
        "204":
          description: Set, and the person's sessions ended.
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          description: Credentials are missing, invalid or expired.
          headers:
            WWW-Authenticate:
              schema: { type: string }
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        "403":
          description: >-
            Not an administrator, the caller's own account, or a
            cookie-authenticated request without X-Kitsune-Request.
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        "404":
          $ref: "#/components/responses/Problem"
  /admin/settings:
    get:
      operationId: getSettings
      summary: Read the server's settings.
      description: >-
        For administrators. Settings live in the database: server.toml, the
        environment and flags only fill a setting that has no value yet, so
        each one says where its value came from. A secret never carries its
        value, only whether it is set.
      responses:
        "200":
          description: Every setting.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ServerSettings" }
        "401":
          description: Credentials are missing, invalid or expired.
          headers:
            WWW-Authenticate:
              schema: { type: string }
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        "403":
          $ref: "#/components/responses/Problem"
    patch:
      operationId: patchSettings
      summary: Change some of the server's settings.
      description: >-
        For administrators. The body names only the settings that change. Every
        value is checked before any is stored, and all are stored together: a
        400 names the first key refused, and changes nothing. A change applies
        at once, except where a setting says it waits for a restart. A null, or
        an empty string or list for a setting that can be empty, clears it: it
        takes its default, and the next start fills it from server.toml, the
        environment or a flag again.
      parameters:
        - $ref: "#/components/parameters/KitsuneRequest"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SettingsChange" }
      responses:
        "200":
          description: Every setting, changed.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ServerSettings" }
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          description: Credentials are missing, invalid or expired.
          headers:
            WWW-Authenticate:
              schema: { type: string }
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        "403":
          $ref: "#/components/responses/Problem"
  /admin/folders:
    get:
      operationId: getFolders
      summary: List the folders the server can see, for the folder picker.
      description: >-
        For administrators. Directories only, never a file name or size: the
        folders in `path`, and how much audio `path` holds, counted as a scan
        would find it and for at most a second or two. Read from / through a
        root that neither `..` nor a symlink can leave. Under Docker these are
        the container's paths. Kitsune's own data and config folders, and the
        library's, are listed with a kind that says they can't be added.
      parameters:
        - name: path
          in: query
          required: false
          description: An absolute path; / when absent.
          schema: { type: string }
      responses:
        "200":
          description: The folders in path.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FolderListing" }
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          description: Credentials are missing, invalid or expired.
          headers:
            WWW-Authenticate:
              schema: { type: string }
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        "403":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
  /admin/trash:
    get:
      operationId: getTrash
      summary: List the Trash.
      description: >-
        For administrators. The songs moved to the Trash, by album, the album
        with the latest one first, each with when and by whom, its size and when
        it goes for good: `retentionDays` after it came. A song in the Trash is
        in no list, search, shuffle or stream.
      responses:
        "200":
          description: The Trash.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Trash" }
        "401":
          description: Credentials are missing, invalid or expired.
          headers:
            WWW-Authenticate:
              schema: { type: string }
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        "403":
          $ref: "#/components/responses/Problem"
    post:
      operationId: postTrash
      summary: Move songs, or whole albums, to the Trash.
      description: >-
        For administrators, on a server with `library.tag_writes` on: with it
        off nothing under a root may change, and this is a 409. Each file moves
        to `.kitsune-trash` in its own library folder, and each song leaves the
        library at once, keeping its ID, plays, ratings and listens for a
        restore. All or nothing: an ID that names no song in the library is a
        404, and a file that won't move undoes the rest, a 409 naming the song.
        So is a scan or an edit holding the library, with a Retry-After. The
        albums touched get a `library` event.
      parameters:
        - $ref: "#/components/parameters/KitsuneRequest"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TrashRequest" }
      responses:
        "200":
          description: What moved.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TrashChange" }
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          description: Credentials are missing, invalid or expired.
          headers:
            WWW-Authenticate:
              schema: { type: string }
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        "403":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "409":
          $ref: "#/components/responses/LibraryConflict"
  /admin/trash/restore:
    post:
      operationId: postTrashRestore
      summary: Put songs back from the Trash.
      description: >-
        For administrators, on a server with `library.tag_writes` on, else a
        409. Each file goes back where it was, and each song comes back as it
        left. All or nothing, and it never overwrites: when a file or a song is
        at a song's old path now, nothing is restored, and the 409 names the
        songs that can't go back. An ID that names no song in the Trash is a
        404. The albums touched get a `library` event.
      parameters:
        - $ref: "#/components/parameters/KitsuneRequest"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TrashRestore" }
      responses:
        "200":
          description: What came back.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TrashChange" }
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          description: Credentials are missing, invalid or expired.
          headers:
            WWW-Authenticate:
              schema: { type: string }
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        "403":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "409":
          $ref: "#/components/responses/LibraryConflict"
  /admin/trash/empty:
    post:
      operationId: postTrashEmpty
      summary: Delete songs in the Trash for good.
      description: >-
        For administrators, on a server with `library.tag_writes` on, else a
        409. Deletes the files, then the songs with every person's plays,
        ratings and listens, as a song missing past its grace is deleted. A
        song whose library folder can't be reached now stays, for a later try,
        and isn't counted. Nothing is published: no list shows these songs.
      parameters:
        - $ref: "#/components/parameters/KitsuneRequest"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TrashEmpty" }
      responses:
        "200":
          description: How many went.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TrashEmptied" }
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          description: Credentials are missing, invalid or expired.
          headers:
            WWW-Authenticate:
              schema: { type: string }
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        "403":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "409":
          $ref: "#/components/responses/LibraryConflict"
  /admin/playlists/{id}/save:
    post:
      operationId: postPlaylistSave
      summary: Save a playlist as an .m3u8 file in a library folder.
      description: >-
        For administrators, on a server with `library.tag_writes` on, else a
        409. Writes what `GET /me/playlists/{id}/m3u` would, but with paths
        relative to `folder`, `../` where needed, so any player reading the
        folder plays it; songs in another library folder can't be named that
        way and are left out, counted in `leftOut`. `root` is one of
        `library.roots`, and `folder` is relative to it. `name` gets `.m3u8`
        when it lacks it; one with a path separator, or a folder outside the
        root, is a 422. A file already there is a 409 (`PlaylistExists`) unless
        `replace`: nothing is ever overwritten without it. The file is written
        beside its target and renamed over it, under the library lock (a scan
        or an edit holding it is a 409 with Retry-After), then read at once, so
        it shows as a file playlist, and everyone hears a `playlists` event.
        Another person's playlist is a 404.
      parameters:
        - $ref: "#/components/parameters/KitsuneRequest"
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PlaylistSave" }
      responses:
        "200":
          description: Saved.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PlaylistSaved" }
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          description: Credentials are missing, invalid or expired.
          headers:
            WWW-Authenticate:
              schema: { type: string }
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        "403":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "409":
          description: >-
            Tag writes are off, the library is busy (with Retry-After), or the
            file is there already (`PlaylistExists`).
          headers:
            Retry-After:
              description: Seconds to wait before trying again, while the library is busy.
              schema: { type: integer }
          content:
            application/problem+json:
              schema:
                anyOf:
                  - { $ref: "#/components/schemas/PlaylistExists" }
                  - { $ref: "#/components/schemas/Problem" }
        "422":
          $ref: "#/components/responses/Problem"
  /admin/organize/preview:
    post:
      operationId: postOrganizePreview
      summary: Preview where the template would file every song, or some.
      description: >-
        For administrators, tag writes on or off: a preview moves nothing.
        `template` and `compilations` default to the saved `organize.template`
        and `organize.compilations` (a library folder in `organize.roots` uses
        its own); either one that doesn't parse is a 422 saying which and
        where. `tracks` or `albums` preview just those songs; an ID that names
        nothing in the library is a 404. The server reads what it keeps of
        every song's tags (no audio file is read) and lists only the folders a
        song would land in, to find a file Kitsune doesn't know in the way, and
        the folders songs leave, to bring their covers and sheets along. The
        preview is kept for 30 minutes for its run, and answers with its
        counts and its first page of albums. Every path is relative to its
        library folder, named by its index in `library.roots`.
      parameters:
        - $ref: "#/components/parameters/KitsuneRequest"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/OrganizeRequest" }
      responses:
        "200":
          description: The preview, and its first page.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OrganizePreview" }
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          description: Credentials are missing, invalid or expired.
          headers:
            WWW-Authenticate:
              schema: { type: string }
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        "403":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "422":
          description: A template doesn't parse; `field` says which and `at` where.
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/OrganizeTemplateProblem" }
  /admin/organize/examples:
    get:
      operationId: getOrganizeExamples
      summary: A few songs to show a template on.
      description: >-
        For administrators. Up to `count` songs, chosen by `seed`, each with
        what a template reads of it and where it is now, so a client can show
        what a template would make of them as it is typed, with its own copy of
        the parser. Under the saved templates the first is one in place, the
        second one renamed and the third one moved, where the library has
        them. No path carries its library folder.
      parameters:
        - name: count
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 12, default: 3 }
        - name: seed
          in: query
          required: false
          description: Another seed, other songs; the same seed, the same songs while the library holds still.
          schema: { type: integer, format: int64 }
      responses:
        "200":
          description: The songs.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OrganizeExamples" }
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          description: Credentials are missing, invalid or expired.
          headers:
            WWW-Authenticate:
              schema: { type: string }
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        "403":
          $ref: "#/components/responses/Problem"
  /admin/organize/previews/{id}:
    get:
      operationId: getOrganizePreview
      summary: Page a kept preview.
      description: >-
        For administrators. The preview's counts and a page of its albums, 200
        at a time, those with a song of `filter`'s kind (all moves by default)
        and, with `q`, with an artist, album, title or path that holds it,
        ignoring case. A preview past its 30 minutes, or replaced, is a 404:
        preview again.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
        - name: filter
          in: query
          required: false
          schema: { $ref: "#/components/schemas/OrganizeFilter" }
        - name: q
          in: query
          required: false
          schema: { type: string, maxLength: 200 }
        - name: cursor
          in: query
          required: false
          description: The `nextCursor` of the page before.
          schema: { type: string }
      responses:
        "200":
          description: The page.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OrganizePreview" }
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          description: Credentials are missing, invalid or expired.
          headers:
            WWW-Authenticate:
              schema: { type: string }
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        "403":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
  /admin/organize/runs:
    get:
      operationId: getOrganizeRuns
      summary: List the latest runs.
      description: >-
        For administrators. The last 10 runs and undos, newest first, with the
        one running, if any, first of all. A page that reloads finds a run it
        was following here, and follows its `organize` events again.
      responses:
        "200":
          description: The runs.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OrganizeRuns" }
        "401":
          description: Credentials are missing, invalid or expired.
          headers:
            WWW-Authenticate:
              schema: { type: string }
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        "403":
          $ref: "#/components/responses/Problem"
    post:
      operationId: postOrganizeRun
      summary: Run a preview's moves.
      description: >-
        For administrators, on a server with `library.tag_writes` on, else a
        409. Starts moving the preview's songs (or, with `tracks` or `albums`,
        just those of them) and answers 202 with the run at once; its progress
        comes as `organize` events. A run takes one album at a time under the
        library lock: it journals the album's moves, renames each file within
        its library folder (never a copy, never over anything), and sets each
        song's path in the same step, so a song keeps its ID, plays, stars and
        playlist places and no scan sees it go. A song that moved or changed
        since the preview, whose file is gone, or that would cross to another
        filesystem stays where it is, named in the run. A preview gone is a
        404. A run, a scan or an edit holding the library is a 409 with
        Retry-After, and so is a library folder the run would touch that looks
        down (missing, unreadable, or empty while it has songs).
      parameters:
        - $ref: "#/components/parameters/KitsuneRequest"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/OrganizeRunRequest" }
      responses:
        "202":
          description: The run, started.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OrganizeRun" }
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          description: Credentials are missing, invalid or expired.
          headers:
            WWW-Authenticate:
              schema: { type: string }
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        "403":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "409":
          $ref: "#/components/responses/LibraryConflict"
  /admin/organize/runs/{id}:
    get:
      operationId: getOrganizeRun
      summary: Read one run, with the songs it left where they were.
      description: >-
        For administrators. The run, and up to 500 of the songs it skipped or
        couldn't move, each with why. A run past the last 10 kept, or 90 days,
        is a 404.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: The run.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OrganizeRunDetail" }
        "401":
          description: Credentials are missing, invalid or expired.
          headers:
            WWW-Authenticate:
              schema: { type: string }
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        "403":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
  /admin/organize/runs/{id}/stop:
    post:
      operationId: postOrganizeRunStop
      summary: Stop a run once the album in hand has moved.
      description: >-
        For administrators. The run finishes the album it is moving, so the
        library is whole, and stops; its `organize` event says `stopped`. A run
        that isn't running is a 409.
      parameters:
        - $ref: "#/components/parameters/KitsuneRequest"
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "202":
          description: The run, stopping.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OrganizeRun" }
        "401":
          description: Credentials are missing, invalid or expired.
          headers:
            WWW-Authenticate:
              schema: { type: string }
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        "403":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "409":
          $ref: "#/components/responses/Problem"
  /admin/organize/runs/{id}/undo:
    post:
      operationId: postOrganizeRunUndo
      summary: Put back what a run moved.
      description: >-
        For administrators, on a server with `library.tag_writes` on, else a
        409. A run in reverse over what the run moved, with the same batches,
        journal and events, so it can be stopped and recovered too: each song
        goes back to where it was, unless it moved again, was edited elsewhere
        or trashed since, or something is at its old path now; those stay, and
        the undo names them. Answers 202 with the undo, a run of its own. A run
        already undone, one still running, or a 409 as for a run.
      parameters:
        - $ref: "#/components/parameters/KitsuneRequest"
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "202":
          description: The undo, started.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OrganizeRun" }
        "401":
          description: Credentials are missing, invalid or expired.
          headers:
            WWW-Authenticate:
              schema: { type: string }
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        "403":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "409":
          $ref: "#/components/responses/LibraryConflict"
  /admin/replaygain:
    get:
      operationId: getReplayGain
      summary: Read what Kitsune measured and can write into the files.
      description: >-
        For administrators. The songs whose loudness Kitsune measured, which
        carry no ReplayGain of their own and could be written now (`songs`, on
        `albums`, by format, with the four biggest albums), how many still wait
        for the loudness pass (`waiting`) or can't be measured
        (`unmeasurable`), the run going, if any, and the last 10 runs. No file
        is read, and no path is sent.
      responses:
        "200":
          description: The status.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ReplayGainStatus" }
        "401":
          description: Credentials are missing, invalid or expired.
          headers:
            WWW-Authenticate:
              schema: { type: string }
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        "403":
          $ref: "#/components/responses/Problem"
  /admin/replaygain/runs:
    post:
      operationId: postReplayGainRun
      summary: Write Kitsune's measure into the files.
      description: >-
        For administrators, on a server with `library.tag_writes` on, else a
        409. Writes the track gain and true peak of each measured song with no
        ReplayGain of its own, and its album's pooled gain and peak, at −18
        LUFS (ReplayGain 2.0), into every writable album or just the `albums`
        named, and answers 202 with the run at once; its progress comes as
        `replaygain` events. A run takes one album at a time under the library
        lock: it checks each song is as the last scan found it, journals the
        album, writes each file (in place where the tags fit and no stream has
        it open, else by an atomic rewrite) and reads it back, so the song
        plays from its tags, exactly as it played from the measure. A song
        that changed since is left as it was, named in the run. A run, a scan
        or an edit holding the library is a 409 with Retry-After, and so is a
        library folder the run would touch that looks down. Albums named of
        which nothing can be written now are a 422.
      parameters:
        - $ref: "#/components/parameters/KitsuneRequest"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/GainRunRequest" }
      responses:
        "202":
          description: The run, started.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/GainRun" }
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          description: Credentials are missing, invalid or expired.
          headers:
            WWW-Authenticate:
              schema: { type: string }
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        "403":
          $ref: "#/components/responses/Problem"
        "409":
          $ref: "#/components/responses/LibraryConflict"
        "422":
          $ref: "#/components/responses/Problem"
  /admin/replaygain/runs/{id}:
    get:
      operationId: getReplayGainRun
      summary: Read one run, its albums and the songs it left as they were.
      description: >-
        For administrators. The run, its albums in the order it takes them,
        each written, writing, waiting or left, and up to 500 of the songs it
        left as they were, each with why, by path relative to its library
        folder. A run past the last 10 kept, or 90 days, is a 404.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: The run.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/GainRunDetail" }
        "401":
          description: Credentials are missing, invalid or expired.
          headers:
            WWW-Authenticate:
              schema: { type: string }
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        "403":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
  /admin/replaygain/runs/{id}/stop:
    post:
      operationId: postReplayGainRunStop
      summary: Stop a run once the album in hand is written.
      description: >-
        For administrators. The run finishes the album it is writing and stops;
        its `replaygain` event says `stopped`. A run that isn't running is a
        409.
      parameters:
        - $ref: "#/components/parameters/KitsuneRequest"
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "202":
          description: The run, stopping.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/GainRun" }
        "401":
          description: Credentials are missing, invalid or expired.
          headers:
            WWW-Authenticate:
              schema: { type: string }
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        "403":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "409":
          $ref: "#/components/responses/Problem"
  /admin/replaygain/runs/{id}/undo:
    post:
      operationId: postReplayGainRunUndo
      summary: Take out what a run wrote.
      description: >-
        For administrators, on a server with `library.tag_writes` on, else a
        409. A run in reverse over what the run wrote, with the same batches,
        journal and events: each song's file gets back exactly the ReplayGain
        tags it had before (none, but where the run wrote over a peak or a
        zero gain), found by song, so one moved since is still undone. A song
        whose ReplayGain tags no longer read what the run wrote is left, and
        named. Answers 202 with the undo, a run of its own. A run already
        undone, one running, an undo, or a 409 as for a run. An unknown run is
        a 404.
      parameters:
        - $ref: "#/components/parameters/KitsuneRequest"
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "202":
          description: The undo, started.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/GainRun" }
        "401":
          description: Credentials are missing, invalid or expired.
          headers:
            WWW-Authenticate:
              schema: { type: string }
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        "403":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "409":
          $ref: "#/components/responses/LibraryConflict"
  /admin/duplicates:
    get:
      operationId: getDuplicates
      summary: Copies of one recording, found across the library.
      description: >-
        For administrators. Songs are grouped when they have the same audio (the
        fingerprint pass's hash), name one MusicBrainz recording with lengths
        within 10 s, or have the same first artist and title (a trailing
        remaster note aside) with lengths within 2 s; a version word in one
        title and not the other, or another disc of one album, keeps them
        apart. Three or more groups pairing the same two albums make an album
        pair. The find is worked out from what the server keeps of the library
        and kept until the next library write. `filter` is `all` (the pairs,
        then the groups in no pair), `audio`, `recording` or `probably` (the
        groups by confidence), `pairs`, or `dismissed`. Groups come by
        confidence, then most copies, then most plays, 100 a page from
        `cursor`; pairs only on the first page.
      parameters:
        - name: filter
          in: query
          schema: { type: string, enum: [all, audio, recording, probably, pairs, dismissed] }
        - name: cursor
          in: query
          schema: { type: string }
      responses:
        "200":
          description: The counts and one page.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DuplicateList" }
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          description: Credentials are missing, invalid or expired.
          headers:
            WWW-Authenticate:
              schema: { type: string }
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        "403":
          $ref: "#/components/responses/Problem"
  /admin/duplicates/{group}:
    get:
      operationId: getDuplicate
      summary: One group of duplicates, or an album pair, side by side.
      description: >-
        For administrators. A group's copies with what tells them apart, the
        copy suggested to keep and why, and what keeping each would move; an
        album pair's track lists matched row by row, the album suggested, and
        what keeping each would move. Plays and raters are totals and counts:
        `stars` is the caller's own, and no other person's rating is sent. A
        key no group has now is a 404.
      parameters:
        - name: group
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: The group or the pair.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DuplicateDetail" }
        "401":
          description: Credentials are missing, invalid or expired.
          headers:
            WWW-Authenticate:
              schema: { type: string }
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        "403":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
  /admin/duplicates/{group}/merge:
    post:
      operationId: postDuplicateMerge
      summary: Keep one copy, merge the others into it, and trash them.
      description: >-
        For administrators, on a server with `library.tag_writes` on, else a
        409. `keep` is a copy of the group and `trash` others of it, or for an
        album pair `keep` is one album and `trash` the other: each song of the
        pair's groups on the trashed album merges into its copy on the kept
        one, and songs only one album has stay. In one transaction under the
        library lock, plays, listens, stars (the higher, a love queued when
        that crosses a person's love line), hearts kept from before, playlist
        entries, shuffle exclusions, Combine runs and remembered queues move
        to the keeper; then the copies go to the Trash, and Restore brings
        back a song with none of it. `plan` is the plan the confirm showed:
        when the merge would move something else now, nothing happens and the
        409 carries the new plan. `library`, `marks`, `playlists` and
        `shuffleRules` events follow.
      parameters:
        - $ref: "#/components/parameters/KitsuneRequest"
        - name: group
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MergeRequest" }
      responses:
        "200":
          description: What was kept, and what went to the Trash.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Merged" }
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          description: Credentials are missing, invalid or expired.
          headers:
            WWW-Authenticate:
              schema: { type: string }
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        "403":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "409":
          description: >-
            An RFC 9457 problem: tag writes are off, a file won't move, or a
            scan, an edit or a run holds the library (Retry-After says how long
            to wait); or the plan changed, and `plan` is what the merge would
            move now.
          headers:
            Retry-After:
              description: Seconds to wait before trying again, while the library is busy.
              schema: { type: integer }
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/PlanChangedProblem" }
        "422":
          $ref: "#/components/responses/Problem"
  /admin/duplicates/{group}/dismiss:
    post:
      operationId: postDuplicateDismiss
      summary: Say a group or an album pair is not duplicates.
      description: >-
        For administrators. Kept as the group's songs, so a third copy turning
        up raises it again. It lists under the `dismissed` filter.
      parameters:
        - $ref: "#/components/parameters/KitsuneRequest"
        - name: group
          in: path
          required: true
          schema: { type: string }
      responses:
        "204":
          description: Dismissed.
        "401":
          description: Credentials are missing, invalid or expired.
          headers:
            WWW-Authenticate:
              schema: { type: string }
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        "403":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
    delete:
      operationId: deleteDuplicateDismiss
      summary: Bring a dismissed group or album pair back.
      description: For administrators. One that wasn't dismissed is a 404.
      parameters:
        - $ref: "#/components/parameters/KitsuneRequest"
        - name: group
          in: path
          required: true
          schema: { type: string }
      responses:
        "204":
          description: Back in the list.
        "401":
          description: Credentials are missing, invalid or expired.
          headers:
            WWW-Authenticate:
              schema: { type: string }
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        "403":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
  /library:
    get:
      operationId: getLibrary
      summary: Report what the library holds.
      description: >-
        Counts live tracks and albums that have a live track. `scan` says where
        scanning stands, so a client can poll this while a scan runs; the
        counts themselves move little until it ends. `fingerprints` says
        where the background fingerprint pass stands, and `loudness` where the
        loudness pass does, with how many songs without ReplayGain it has
        measured.
      responses:
        "200":
          description: The library's counts.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LibraryFacts" }
        "401":
          description: Credentials are missing, invalid or expired.
          headers:
            WWW-Authenticate:
              schema: { type: string }
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
  /library/index:
    get:
      operationId: getLibraryIndex
      summary: List every song in the library, by artist and album.
      description: >-
        The whole library in one response, for a client that needs every row's
        height: the one browse list that doesn't page. Artists come by sort name,
        those not under a letter from A to Z first, and each artist's albums
        newest first. An album appears once, under its first owner. An album with
        no owner a reader shows, such as a compilation, groups under the artist
        it displays, in a group with no `id`. Tracks carry the caller's own
        stars. The response is
        gzipped when `Accept-Encoding` allows it. `fields` adds to each track
        what song columns show; without it the response is as it has always
        been.
      parameters:
        - name: fields
          in: query
          required: false
          description: >-
            What else each track carries, joined by commas: `albumArtist`
            (`albumArtists`), `genre` (`displayGenres`, spelled as albums'
            are), `year`, `composer` (`composers`), `format` (`format`,
            `sampleRate`, `bitDepth` and `bitrate`), `bitrate`, `added`
            (`addedAt`), `gain` (`trackGain` and `trackGainSource`: the tags'
            gain, or for a file with none Kitsune's measure of it), and the
            caller's own `plays`, `lastPlayed` (`lastPlayedAt`) and `shuffle`
            rules. An unknown name is a 400.
          style: form
          explode: false
          schema:
            type: array
            items:
              type: string
              enum: [albumArtist, genre, year, composer, format, bitrate, added, plays, lastPlayed, gain, shuffle]
        - name: albums
          in: query
          required: false
          description: >-
            Only these albums, by id, joined by commas: what a `library` event
            names. Each that still has a song comes in the index's shape, under
            its heading, with `after` saying where it goes; one that doesn't is
            gone from the index. At most 500; more is a 400.
          style: form
          explode: false
          schema:
            type: array
            maxItems: 500
            items: { type: string }
        - name: artist
          in: query
          required: false
          description: >-
            Only the songs this artist is on, by id, as an artist or an album
            artist: the songs the `artist` shuffle scope draws from, and the
            artist page's list. They come in the index's shape, under one
            heading of that artist: the albums it owns, then the albums it
            appears on, each run newest first as `GET /artists/{id}` has them,
            and each album with just the artist's songs. No album has `after`.
            With `albums`, a 400. An unknown artist is a 404.
          schema: { type: string }
      responses:
        "200":
          description: Every artist with an album, its albums and their tracks.
          headers:
            Vary:
              schema: { type: string }
            Content-Encoding:
              description: "`gzip`, when the response is compressed."
              schema: { type: string }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LibraryIndex" }
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          description: Credentials are missing, invalid or expired.
          headers:
            WWW-Authenticate:
              schema: { type: string }
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        "404":
          $ref: "#/components/responses/Problem"
  /search:
    get:
      operationId: getSearch
      summary: Find artists, albums and tracks.
      description: >-
        Each group is capped and ordered best first: the whole name, then names
        that start with the query, then names with its words, then the rest. A
        query is cut to 256 bytes and 16 words. One with no letter or digit
        finds nothing.
      parameters:
        - name: q
          in: query
          required: false
          schema: { type: string }
      responses:
        "200":
          description: What the query found.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SearchResults" }
        "401":
          description: Credentials are missing, invalid or expired.
          headers:
            WWW-Authenticate:
              schema: { type: string }
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
  /tracks/{id}:
    get:
      operationId: getTrack
      summary: Return a track and the ETags to edit it with.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: The track.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TrackDetail" }
        "401":
          description: Credentials are missing, invalid or expired.
          headers:
            WWW-Authenticate:
              schema: { type: string }
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        "404":
          $ref: "#/components/responses/Problem"
  /tracks/{id}/stream:
    get:
      operationId: getTrackStream
      summary: Stream a track's original file.
      description: >-
        Serves the file as it is on disk, with no transcoding, and supports
        single and multiple byte ranges. The ETag comes from the file's size
        and modification time, so a client must revalidate what it keeps. There
        is no Last-Modified: `If-Range` matches an ETag only, and a date in it
        gets the whole file. A retag that keeps both the size and the
        modification time keeps the ETag too. A track that is missing, or whose
        file has left the disk, is a 404.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
        - name: Range
          in: header
          required: false
          description: One or more byte ranges, such as `bytes=0-1023`.
          schema: { type: string }
        - name: If-Range
          in: header
          required: false
          description: An ETag. The range is honored only if it is current.
          schema: { type: string }
        - name: If-None-Match
          in: header
          required: false
          schema: { type: string }
      responses:
        "200":
          description: The whole file.
          headers:
            Accept-Ranges:
              schema: { type: string }
            ETag:
              schema: { type: string }
            Cache-Control:
              schema: { type: string }
          content:
            audio/*:
              schema: { type: string, format: binary }
            application/octet-stream:
              schema: { type: string, format: binary }
        "206":
          description: >-
            The requested range. Several ranges come as `multipart/byteranges`,
            each part with its own `Content-Range`.
          headers:
            Accept-Ranges:
              schema: { type: string }
            Content-Range:
              description: Absent from a multipart response.
              schema: { type: string }
            ETag:
              schema: { type: string }
            Cache-Control:
              schema: { type: string }
          content:
            audio/*:
              schema: { type: string, format: binary }
            application/octet-stream:
              schema: { type: string, format: binary }
            multipart/byteranges:
              schema: { type: string, format: binary }
        "304":
          description: The client's copy is current.
          headers:
            ETag:
              schema: { type: string }
            Cache-Control:
              schema: { type: string }
        "401":
          description: Credentials are missing, invalid or expired.
          headers:
            WWW-Authenticate:
              schema: { type: string }
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        "404":
          $ref: "#/components/responses/Problem"
        "416":
          description: >-
            The range can't be satisfied. `Content-Range` gives the file's size
            as `bytes */N`, unless the range was malformed.
          headers:
            Content-Range:
              schema: { type: string }
            X-Content-Type-Options:
              schema: { type: string }
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
components:
  securitySchemes:
    bearer:
      type: http
      scheme: bearer
    cookie:
      type: apiKey
      in: cookie
      name: kitsune_session
  parameters:
    KitsuneRequest:
      name: X-Kitsune-Request
      in: header
      required: false
      description: >-
        Must be `1` on cookie-authenticated requests that change state, so a
        cross-site form cannot forge them.
      schema: { type: string, enum: ["1"] }
    PrefKey:
      name: key
      in: path
      required: true
      description: >-
        The preference: `library.columns`, `ui.theme`, `shuffle.ratings`,
        `shuffle.flow`, `shuffle.memory`, `library.sort`, `albums.sort`,
        `artists.sort`, `artist.songs` or `playback.untagged_gain`. The server
        knows which keys there are.
      schema: { type: string }
    ItemID:
      name: id
      in: path
      required: true
      description: The item's ID.
      schema: { type: string }
  responses:
    Problem:
      description: An RFC 9457 problem.
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
    TooManyAttempts:
      description: Too many failed attempts; wait before trying again.
      headers:
        Retry-After:
          description: Seconds to wait before trying again.
          schema: { type: integer }
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
    LibraryConflict:
      description: >-
        An RFC 9457 problem: tag writes are off, a file won't move, or a scan or
        an edit holds the library, when Retry-After says how long to wait.
      headers:
        Retry-After:
          description: Seconds to wait before trying again, while the library is busy.
          schema: { type: integer }
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
    EditFailure:
      description: >-
        An RFC 9457 problem. When a tag edit was refused or stopped, it says
        which tracks hold the edit.
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/EditProblem" }
    SmartProblem:
      description: >-
        An RFC 9457 problem: rules a smart playlist can't have, or rules that
        name a playlist that names them back, which `cycle` lists.
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/SmartProblem" }
    PlaylistProblem:
      description: >-
        An RFC 9457 problem: an add named songs or albums not in the library,
        which it names, or would take the playlist past 10,000 songs.
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/PlaylistProblem" }
  schemas:
    Problem:
      type: object
      required: [type, title, status]
      properties:
        type: { type: string, format: uri-reference }
        title: { type: string }
        status: { type: integer }
        detail: { type: string }
        requestId: { type: string }
    EditProblem:
      type: object
      required: [type, title, status]
      properties:
        type: { type: string, format: uri-reference }
        title: { type: string }
        status: { type: integer }
        detail: { type: string }
        requestId: { type: string }
        changed:
          type: array
          description: Tracks that hold the edit.
          items: { type: string }
        remaining:
          type: array
          description: Tracks that don't. The first is the one that failed.
          items: { type: string }
        album:
          type: string
          description: On a 412 from `POST /edits`, the album whose `etag` is stale.
    User:
      type: object
      additionalProperties: false
      required: [id, name, role, createdAt]
      properties:
        id: { type: integer, format: int64 }
        name: { type: string }
        role: { type: string, enum: [admin, user] }
        createdAt: { type: string, format: date-time }
    Me:
      description: A user's properties, repeated (allOf does not mix with additionalProperties false), plus what the user may do.
      type: object
      additionalProperties: false
      required: [id, name, role, createdAt, canEditTags, canTrash, canOrganize]
      properties:
        id: { type: integer, format: int64 }
        name: { type: string }
        role: { type: string, enum: [admin, user] }
        createdAt: { type: string, format: date-time }
        canEditTags:
          type: boolean
          description: True for an administrator on a server with `library.tag_writes` on.
        canTrash:
          type: boolean
          description: >-
            True for an administrator on a server with `library.tag_writes` on:
            the Trash moves files, so it is off with tag writes.
        canOrganize:
          type: boolean
          description: >-
            True for an administrator on a server with `library.tag_writes` on:
            organizing moves files, so its ways in from an album or a selection
            are off with tag writes. The Organize page still previews.
    ListenReport:
      type: object
      additionalProperties: false
      required: [clientId, trackId, startedAt]
      properties:
        clientId:
          type: string
          minLength: 1
          maxLength: 64
          description: The client's own ID for this listen, shared by its start and its end.
        trackId: { type: string, minLength: 1 }
        startedAt:
          type: string
          format: date-time
          description: When the listen started, by the client's clock.
        shuffle:
          type: string
          minLength: 1
          maxLength: 64
          description: >-
            The shuffle it plays in: the session's ID from `POST /me/shuffles`,
            or the client's own while that is on its way, which the end then
            replaces. Absent outside a shuffle.
        ended:
          type: string
          enum: [completed, skipped, stopped, interrupted]
          description: How it ended. Absent on a start.
        listenedMs:
          type: integer
          format: int64
          minimum: 0
          description: How much of the song played, in milliseconds.
    PlayReport:
      type: object
      additionalProperties: false
      required: [trackId, playedAt, source, clientId]
      properties:
        trackId: { type: string, minLength: 1 }
        playedAt:
          type: string
          format: date-time
          description: When the listen started, by the client's clock.
        source:
          type: string
          minLength: 1
          maxLength: 64
          description: The client's name.
        clientId:
          type: string
          minLength: 1
          maxLength: 64
          description: The client's own ID for this listen.
    Rating:
      type: object
      additionalProperties: false
      required: [stars]
      properties:
        stars:
          type: number
          minimum: 0.5
          maximum: 5
          multipleOf: 0.5
          description: The rating in stars, ½ to 5 in halves. Whole stars are whole numbers.
    Home:
      type: object
      additionalProperties: false
      required: [recent, onRepeat]
      properties:
        recent:
          type: array
          maxItems: 25
          description: Albums by their latest play, newest first.
          items: { $ref: "#/components/schemas/AlbumEntry" }
        onRepeat:
          type: array
          maxItems: 25
          description: Albums by their plays in the last 90 days, most first.
          items: { $ref: "#/components/schemas/AlbumPlays" }
    AlbumPlays:
      type: object
      additionalProperties: false
      required: [album, plays]
      properties:
        album: { $ref: "#/components/schemas/AlbumEntry" }
        plays:
          type: integer
          minimum: 1
          description: Plays of the album's songs in the window.
    Listening:
      type: object
      additionalProperties: false
      required: [plays, rated]
      properties:
        plays:
          type: integer
          minimum: 0
          description: Plays that counted.
        rated:
          type: integer
          minimum: 0
          description: Tracks with stars.
    LastfmStatus:
      type: object
      additionalProperties: false
      required: [configured, connected, scrobble, nowPlaying, loves, loveFrom, state, waiting]
      properties:
        configured:
          type: boolean
          description: False when the server has no Last.fm key.
        connected: { type: boolean }
        name:
          type: string
          description: The Last.fm user name, when connected.
        scrobble: { type: boolean }
        nowPlaying: { type: boolean }
        loves:
          type: boolean
          description: Whether ratings crossing `loveFrom` love and unlove songs on Last.fm.
        loveFrom:
          type: number
          minimum: 0
          maximum: 5
          multipleOf: 0.5
          description: >-
            The love line, ½ to 5 stars in halves; 4 until the person moves it.
            0 when not connected.
        state:
          type: string
          enum: [ok, waiting, reconnect]
          description: >-
            `waiting` while Last.fm isn't answering and the outbox waits for
            `retryAt`; `reconnect` when Last.fm rejected the session.
        waiting:
          type: integer
          minimum: 0
          description: Plays the server holds for Last.fm.
        lastSentAt: { type: string, format: date-time }
        retryAt: { type: string, format: date-time }
    LastfmSwitches:
      type: object
      additionalProperties: false
      properties:
        scrobble: { type: boolean }
        nowPlaying: { type: boolean }
        loves: { type: boolean }
        loveFrom:
          type: number
          minimum: 0.5
          maximum: 5
          multipleOf: 0.5
          description: >-
            Moves the love line. Moving it sends nothing for songs already
            rated: only ratings that cross it later do.
    HeartsSummary:
      type: object
      additionalProperties: false
      description: >-
        The hearts the caller kept from before stars were the only like, by
        kind. All zeros when there are none.
      required: [tracksRated, tracksUnrated, albums, artists, byStars, preview]
      properties:
        tracksRated:
          type: integer
          minimum: 0
          description: Hearted songs with stars of their own, which keep them.
        tracksUnrated:
          type: integer
          minimum: 0
          description: Hearted songs with no stars, which the conversion rates.
        albums: { type: integer, minimum: 0 }
        artists: { type: integer, minimum: 0 }
        byStars:
          type: array
          minItems: 5
          maxItems: 5
          description: >-
            The hearted, rated songs at 1★ to 5★, a half rounding up: what the
            card's default and its line are worked out from.
          items: { type: integer, minimum: 0 }
        preview:
          type: array
          maxItems: 5
          description: Up to five of the unrated hearted songs, the latest hearted first.
          items: { $ref: "#/components/schemas/HeartedSong" }
    HeartedSong:
      type: object
      additionalProperties: false
      required: [id, title]
      properties:
        id: { type: string }
        title: { type: string }
        artist: { type: string, description: "Its first artist; absent when it has none." }
    HeartsConvert:
      type: object
      additionalProperties: false
      required: [stars]
      properties:
        stars:
          type: [number, "null"]
          minimum: 0.5
          maximum: 5
          multipleOf: 0.5
          description: The stars each hearted song with none gets, ½ to 5 in halves; null leaves them unrated.
    HeartsConverted:
      type: object
      additionalProperties: false
      required: [rated, tracks, albums, artists]
      properties:
        rated: { type: integer, minimum: 0, description: "Songs given stars." }
        tracks: { type: integer, minimum: 0, description: "Song hearts taken off." }
        albums: { type: integer, minimum: 0, description: "Album hearts taken off." }
        artists: { type: integer, minimum: 0, description: "Artist hearts taken off." }
    LastfmConnect:
      type: object
      additionalProperties: false
      required: [url]
      properties:
        url: { type: string, format: uri }
    NowPlaying:
      type: object
      additionalProperties: false
      required: [trackId]
      properties:
        trackId: { type: string, minLength: 1 }
        clientId:
          type: string
          minLength: 1
          maxLength: 64
          description: The device playing, as plays name it. The caller's other devices hear it in `listening`.
    EventStream:
      type: object
      additionalProperties: false
      description: "`ready` or `resync`: nothing but its id."
    EventLibrary:
      type: object
      additionalProperties: false
      description: >-
        Albums added, changed or gone from the index, by id, which `GET
        /library/index?albums=` reads. `all` says too many changed to list:
        read the index again.
      required: [albums, all]
      properties:
        albums: { type: array, items: { type: string } }
        all: { type: boolean }
    EventMarks:
      type: object
      additionalProperties: false
      description: >-
        A rating the person changed on any device, or one their hearts became
        when they turned them into stars.
      required: [kind, id, stars]
      properties:
        kind: { type: string, enum: [tracks] }
        id: { type: string }
        stars: { type: number, minimum: 0, maximum: 5, multipleOf: 0.5, description: "The rating in stars, ½ to 5 in halves; 0 for none." }
    EventPrefs:
      type: object
      additionalProperties: false
      description: "The preference that changed; `GET /me/prefs/{key}` reads it."
      required: [key]
      properties:
        key: { type: string }
    EventShuffleRules:
      type: object
      additionalProperties: false
      description: The person's shuffle rules changed.
    EventShuffle:
      type: object
      additionalProperties: false
      description: "One of the person's shuffles moved on, on one of their devices; `GET /me/shuffles/{id}/next` reads it."
      required: [id, to]
      properties:
        id: { type: string }
        to: { type: integer, format: int64 }
    EventListening:
      type: object
      additionalProperties: false
      description: A device of the person's started a track.
      required: [trackId]
      properties:
        trackId: { type: string }
        clientId: { type: string }
    EventLastfm:
      type: object
      additionalProperties: false
      description: "The person's Last.fm connection or outbox changed; `GET /me/lastfm` reads it."
    EventSettings:
      type: object
      additionalProperties: false
      description: >-
        Server settings changed, by key, never with a value; `library.roots`
        also when a folder's watch changes. `GET /admin/settings` reads them.
      required: [keys]
      properties:
        keys: { type: array, items: { type: string } }
    EventArtists:
      type: object
      additionalProperties: false
      description: >-
        Artists whose images or bio changed, by id: a scan found, changed or
        lost their folder's files. `GET /artists/{id}` reads one again, and
        `GET /artists` the thumbs.
      required: [ids]
      properties:
        ids: { type: array, items: { type: string } }
    EventPlaylists:
      type: object
      additionalProperties: false
      description: >-
        The person's playlists made, changed or deleted on any device, by id;
        `GET /me/playlists` and `GET /me/playlists/{id}` read them. A file
        playlist read, read again, deleted or saved is told to everyone.
      required: [ids]
      properties:
        ids: { type: array, items: { type: string } }
    Playlists:
      type: object
      additionalProperties: false
      required: [playlists]
      properties:
        playlists:
          type: array
          items: { $ref: "#/components/schemas/Playlist" }
    Playlist:
      type: object
      additionalProperties: false
      required: [id, name, source, smart, songCount, albumCount, durationMs, mosaic, createdAt, updatedAt]
      properties:
        id: { type: string }
        name: { type: string, minLength: 1, maxLength: 200 }
        source:
          type: string
          enum: [kitsune, navidrome, file]
          description: "`navidrome` for one an import brought over; `file` for one read from a file in the library, which everyone sees and nobody changes here."
        smart: { type: boolean, description: Whether rules choose its songs. }
        file: { $ref: "#/components/schemas/PlaylistFile" }
        rules: { $ref: "#/components/schemas/SmartRules" }
        songCount: { type: integer, minimum: 0, description: Its entries in the library; a song in twice counts twice. }
        albumCount: { type: integer, minimum: 0 }
        durationMs: { type: integer, format: int64, minimum: 0 }
        mosaic:
          type: array
          maxItems: 4
          description: Its first albums in its order, each once.
          items: { $ref: "#/components/schemas/PlaylistAlbum" }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        addedAt: { type: string, format: date-time, description: When songs were last added; absent before any were. }
        holds: { type: integer, minimum: 0, description: "With `holding`: how many of those songs it holds, each once." }
    PlaylistDetail:
      type: object
      additionalProperties: false
      description: A Playlist's properties, repeated (allOf does not mix with additionalProperties false), plus its entries and their albums.
      required: [id, name, source, smart, songCount, albumCount, durationMs, mosaic, createdAt, updatedAt, entries, albums]
      properties:
        id: { type: string }
        name: { type: string, minLength: 1, maxLength: 200 }
        source: { type: string, enum: [kitsune, navidrome, file] }
        smart: { type: boolean }
        file: { $ref: "#/components/schemas/PlaylistFile" }
        rules: { $ref: "#/components/schemas/SmartRules" }
        songCount: { type: integer, minimum: 0 }
        albumCount: { type: integer, minimum: 0 }
        durationMs: { type: integer, format: int64, minimum: 0 }
        mosaic:
          type: array
          maxItems: 4
          items: { $ref: "#/components/schemas/PlaylistAlbum" }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        addedAt: { type: string, format: date-time }
        entries:
          type: array
          maxItems: 10000
          items: { $ref: "#/components/schemas/PlaylistEntry" }
        albums:
          type: array
          description: Every album of the entries, in the order they first appear.
          items: { $ref: "#/components/schemas/PlaylistAlbum" }
        missing:
          type: array
          description: A file playlist's lines that found no song, in the file's order; absent for any other.
          items: { $ref: "#/components/schemas/MissingLine" }
    PlaylistFile:
      type: object
      additionalProperties: false
      description: Where a file playlist comes from. No library folder is ever named.
      required: [path, format, notFound, pastLimit, readAt, modifiedAt]
      properties:
        path: { type: string, description: "The file's path relative to its library folder, such as `Playlists/Night drive.m3u8`." }
        format: { type: string, enum: [m3u, m3u8] }
        notFound: { type: integer, minimum: 0, description: "Lines that found no song, those past the limit included." }
        pastLimit: { type: integer, minimum: 0, description: Lines past what Kitsune reads of a file, counted only. }
        readAt: { type: string, format: date-time, description: When Kitsune last read the file. }
        modifiedAt: { type: string, format: date-time, description: The file's own modification time. }
    MissingLine:
      type: object
      additionalProperties: false
      required: [line, text, reason]
      description: >-
        A line of a playlist file that found no song. `text` is the line as
        written, except that an absolute path outside the library is only its
        last two segments after `…/`, an absolute path inside it is relative to
        its library folder, and a web address is only its scheme and `//…`.
      properties:
        line: { type: integer, minimum: 1, description: Its line number in the file, from 1. }
        text: { type: string }
        title: { type: string, description: "The `#EXTINF` title before it, if any." }
        seconds: { type: integer, description: "The `#EXTINF` length before it, if any." }
        reason:
          type: string
          enum: [noSong, outside, notFile, trashed]
          description: >-
            `noSong`: no song at the path; `outside`: an absolute path in no
            library folder, or one that climbs out of its own; `notFile`: a web
            address; `trashed`: the song is in the Trash.
        otherExtension:
          type: string
          description: "With `noSong`: the file name of a song in the same folder with the same name and another extension. Only a hint: it never matches."
    PlaylistSave:
      type: object
      additionalProperties: false
      required: [root, folder, name]
      properties:
        root: { type: string, description: "One of `library.roots`." }
        folder: { type: string, description: "A folder relative to `root`; empty or `.` is the root itself." }
        name: { type: string, minLength: 1, maxLength: 255, description: "The file's name; `.m3u8` is added when it lacks it." }
        replace: { type: boolean, description: Replace a file that is there already. }
    PlaylistSaved:
      type: object
      additionalProperties: false
      required: [name, folder, songCount, leftOut]
      properties:
        name: { type: string, description: The file's name, with its extension. }
        folder: { type: string, description: The folder relative to its library folder. }
        songCount: { type: integer, minimum: 0, description: The songs written. }
        leftOut: { type: integer, minimum: 0, description: Songs in another library folder, which a relative path can't name. }
    PlaylistExists:
      type: object
      required: [type, title, status, exists]
      description: The problem of a save whose file is there already.
      properties:
        type: { type: string, format: uri-reference }
        title: { type: string }
        status: { type: integer }
        detail: { type: string }
        requestId: { type: string }
        exists:
          type: object
          additionalProperties: false
          required: [name, freeName, modifiedAt]
          properties:
            name: { type: string, description: The file's name. }
            freeName: { type: string, description: "The next name free in that folder, such as `Falling Up 2.m3u8`." }
            modifiedAt: { type: string, format: date-time }
            playlist: { type: string, description: The file playlist Kitsune reads from it, when it has read it. }
            playlistName: { type: string }
            songCount: { type: integer, minimum: 0, description: That playlist's songs. }
    PlaylistEntry:
      type: object
      additionalProperties: false
      required: [id, albumId, track]
      properties:
        id: { type: string, description: The entry's own ID, never reused. }
        albumId: { type: string }
        track: { $ref: "#/components/schemas/LibraryTrack" }
    PlaylistAlbum:
      type: object
      additionalProperties: false
      required: [id, title, artist, compilation]
      properties:
        id: { type: string }
        title: { type: string }
        artist: { type: string }
        year: { type: integer }
        compilation: { type: boolean }
        artwork: { $ref: "#/components/schemas/Artwork" }
    PlaylistCreate:
      type: object
      additionalProperties: false
      required: [name]
      properties:
        name: { type: string }
        albums: { type: array, maxItems: 1000, items: { type: string, minLength: 1 } }
        tracks: { type: array, maxItems: 10000, items: { type: string, minLength: 1 } }
        rules: { $ref: "#/components/schemas/SmartRules" }
        seed: { $ref: "#/components/schemas/SmartSeed" }
    PlaylistChange:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        name: { type: string }
        rules: { $ref: "#/components/schemas/SmartRules" }
    SmartSeed:
      type: integer
      format: int64
      minimum: 0
      maximum: 9007199254740991
      description: What a smart playlist's random choices follow; any whole number a client can hold exactly.
    SmartRules:
      type: object
      additionalProperties: false
      description: >-
        A smart playlist's rules: conditions joined by `match`, one level of
        groups, at most 50 rules in all; an optional limit; and an order
        (default `library`; `chosen`, the limit's own, only with a limit). Ties
        always fall back to the Library's order. Which operators a field takes,
        and what its value holds, is internal/smartlist's table: text fields
        take is, isNot, contains and notContains and a string (empty counts for
        nothing); year, plays, skips and bitrate (kbps) take is, atLeast and
        atMost; rating takes them in half stars, 1 to 10; lastPlayed and added
        take inLast and notInLast in days; length takes atLeast and atMost in
        minutes; format and playlist (an ID) take is and isNot. Anything else is
        a 422.
      required: [match, rules]
      properties:
        match: { $ref: "#/components/schemas/SmartMatch" }
        rules:
          type: array
          maxItems: 50
          items: { $ref: "#/components/schemas/SmartCondition" }
        limit: { $ref: "#/components/schemas/SmartLimit" }
        order:
          type: string
          enum: [chosen, library, title, album, year, rating, plays, lastPlayed, added, random]
    SmartMatch:
      type: string
      enum: [all, any]
    SmartCondition:
      description: A rule, or one level of group.
      oneOf:
        - { $ref: "#/components/schemas/SmartRule" }
        - { $ref: "#/components/schemas/SmartGroup" }
    SmartGroup:
      type: object
      additionalProperties: false
      required: [match, rules]
      properties:
        match: { $ref: "#/components/schemas/SmartMatch" }
        rules:
          type: array
          minItems: 1
          maxItems: 50
          items: { $ref: "#/components/schemas/SmartRule" }
    SmartRule:
      type: object
      additionalProperties: false
      required: [field, op, value]
      properties:
        field:
          type: string
          enum: [title, album, artist, albumArtist, genre, year, rating, plays, skips, lastPlayed, added, length, format, bitrate, playlist]
        op:
          type: string
          enum: [is, isNot, contains, notContains, atLeast, atMost, inLast, notInLast]
        value:
          oneOf:
            - { type: string, maxLength: 200 }
            - { type: integer, format: int64 }
    SmartLimit:
      type: object
      additionalProperties: false
      required: [count, unit, by]
      properties:
        count: { type: integer, minimum: 1, maximum: 100000 }
        unit: { type: string, enum: [songs, minutes, gb] }
        by:
          type: string
          enum: [random, mostPlayed, leastPlayed, highestRated, newest, leastRecent]
    SmartPreviewRequest:
      type: object
      additionalProperties: false
      required: [rules]
      properties:
        rules: { $ref: "#/components/schemas/SmartRules" }
        id: { type: string, minLength: 1, description: The smart playlist being edited, whose seed a random choice follows. }
        seed: { $ref: "#/components/schemas/SmartSeed" }
    SmartPreview:
      type: object
      additionalProperties: false
      required: [songCount, matchCount, albumCount, durationMs, mosaic, songs]
      properties:
        songCount: { type: integer, minimum: 0, description: The songs the rules choose, the limit applied. }
        matchCount: { type: integer, minimum: 0, description: The songs that match before the limit. }
        albumCount: { type: integer, minimum: 0 }
        durationMs: { type: integer, format: int64, minimum: 0 }
        mosaic:
          type: array
          maxItems: 4
          items: { $ref: "#/components/schemas/PlaylistAlbum" }
        songs:
          type: array
          maxItems: 40
          description: The first songs, in order.
          items: { $ref: "#/components/schemas/SmartSong" }
    SmartSong:
      type: object
      additionalProperties: false
      required: [id, albumId, title]
      properties:
        id: { type: string, description: The track's ID. }
        albumId: { type: string }
        title: { type: string }
        stars: { type: number, minimum: 0.5, maximum: 5, multipleOf: 0.5 }
        plays: { type: integer, minimum: 1, description: Absent when never played. }
        lastPlayedAt: { type: string, format: date-time, description: Absent when never played. }
    SmartProblem:
      type: object
      required: [type, title, status]
      properties:
        type: { type: string, format: uri-reference }
        title: { type: string }
        status: { type: integer }
        detail: { type: string }
        requestId: { type: string }
        cycle:
          type: array
          description: The playlists that name each other, in order, when that is the trouble.
          items: { type: string }
    PlaylistAdd:
      type: object
      additionalProperties: false
      properties:
        albums: { type: array, maxItems: 1000, items: { type: string, minLength: 1 } }
        tracks: { type: array, maxItems: 10000, items: { type: string, minLength: 1 } }
        again: { type: boolean, default: false, description: Add songs the playlist holds already. }
        before: { type: string, minLength: 1, description: The entry the songs go just before; absent for the end. }
    PlaylistAdded:
      type: object
      additionalProperties: false
      required: [playlist, added, skipped]
      properties:
        playlist: { $ref: "#/components/schemas/Playlist" }
        added:
          type: array
          description: The entries made, in order.
          items:
            type: object
            additionalProperties: false
            required: [id, track]
            properties:
              id: { type: string }
              track: { type: string }
        skipped:
          type: array
          description: Songs left out as already there, each once, in the order named.
          items: { type: string }
    PlaylistEntries:
      type: object
      additionalProperties: false
      required: [entries]
      properties:
        entries: { type: array, maxItems: 10000, items: { type: string } }
    PlaylistMove:
      type: object
      additionalProperties: false
      required: [entry]
      properties:
        entry: { type: string, minLength: 1 }
        before: { type: string, minLength: 1 }
        after: { type: string, minLength: 1 }
    PlaylistProblem:
      type: object
      required: [type, title, status, tracks, albums]
      properties:
        type: { type: string, format: uri-reference }
        title: { type: string }
        status: { type: integer }
        detail: { type: string }
        requestId: { type: string }
        tracks:
          type: array
          description: Songs named that aren't in the library.
          items: { type: string }
        albums:
          type: array
          description: Albums named with no song in the library.
          items: { type: string }
    LoginRequest:
      type: object
      additionalProperties: false
      required: [name, password]
      properties:
        name: { type: string, minLength: 1 }
        password: { type: string, minLength: 1 }
        cookie: { type: boolean, default: false }
    PasswordChange:
      type: object
      additionalProperties: false
      required: [current, new]
      properties:
        current: { type: string, minLength: 1 }
        new: { type: string, minLength: 1 }
    ResetRequest:
      type: object
      additionalProperties: false
      required: [name]
      properties:
        name: { type: string, minLength: 1 }
    ResetConfirm:
      type: object
      additionalProperties: false
      required: [name, code, new]
      properties:
        name: { type: string, minLength: 1 }
        code:
          type: string
          minLength: 1
          description: The reset code from the server's log, in any case, with or without its dashes.
        new: { type: string, minLength: 1 }
        cookie: { type: boolean, default: false }
    PasswordSet:
      type: object
      additionalProperties: false
      required: [new]
      properties:
        new: { type: string, minLength: 1 }
    Accounts:
      type: object
      additionalProperties: false
      required: [users]
      properties:
        users:
          type: array
          items: { $ref: "#/components/schemas/Account" }
    Account:
      type: object
      additionalProperties: false
      required: [user, sessions]
      properties:
        user: { $ref: "#/components/schemas/User" }
        lastSeen:
          type: string
          format: date-time
          description: When the newest live session was last used; absent with none.
        sessions: { type: integer, minimum: 0, description: Live sessions. }
    SetupStatus:
      type: object
      additionalProperties: false
      required: [needed, codeRequired]
      properties:
        needed: { type: boolean }
        codeRequired: { type: boolean }
    SetupRequest:
      type: object
      additionalProperties: false
      required: [name, password]
      properties:
        name: { type: string, minLength: 1 }
        password: { type: string, minLength: 1 }
        code:
          type: string
          description: The setup code from the server's log; needed only from outside its network.
    Session:
      type: object
      additionalProperties: false
      required: [expiresAt, user]
      properties:
        token:
          type: string
          description: Present only when the login did not ask for a cookie.
        expiresAt: { type: string, format: date-time }
        user: { $ref: "#/components/schemas/User" }
    Artwork:
      type: object
      additionalProperties: false
      required: [hash, accent, ground, width, height]
      properties:
        hash:
          type: string
          pattern: "^[0-9a-f]{64}$"
          description: Names the cover for `GET /artwork/{hash}`.
        accent: { type: string, pattern: "^#[0-9a-f]{6}$" }
        ground: { type: string, pattern: "^#[0-9a-f]{6}$" }
        width: { type: integer, description: Of the source image. }
        height: { type: integer, description: Of the source image. }
    AlbumEntry:
      type: object
      additionalProperties: false
      required: [id, title, sortName, artist, trackCount, compilation, addedAt, displayGenres]
      properties:
        id: { type: string }
        title: { type: string }
        sortName:
          type: string
          description: The title as the album sorts, from its sort tag, else the title itself.
        artist: { type: string }
        sortArtist:
          type: string
          description: >-
            Who the album sorts under: its first owner's sort name, else
            `artist`. Only `GET /albums` sends it.
        year: { type: integer }
        trackCount: { type: integer }
        compilation: { type: boolean }
        artwork: { $ref: "#/components/schemas/Artwork" }
        addedAt: { type: string, format: date-time }
        displayGenres:
          type: array
          description: >-
            What genres the album shows and filters by: split, cleaned and
            spelled one way across the library. The most used on it come first.
          items: { type: string }
    AlbumPage:
      type: object
      additionalProperties: false
      required: [albums]
      properties:
        albums:
          type: array
          items: { $ref: "#/components/schemas/AlbumEntry" }
        nextCursor:
          type: string
          description: Absent on the last page.
    ReplayGain:
      type: object
      additionalProperties: false
      description: >-
        Gains in dB to the ReplayGain 2.0 reference of -18 LUFS, and peaks
        linear, 1 being full scale; an absent value is unknown. `source` says
        where they come from: the file's tags, or, for a file with no gain
        tagged, Kitsune's own measure of it (EBU R 128, true peaks), which is
        never written to the file.
      required: [source]
      properties:
        trackGain: { type: number }
        albumGain: { type: number }
        trackPeak: { type: number }
        albumPeak: { type: number }
        source: { type: string, enum: [tags, measured] }
    Track:
      type: object
      additionalProperties: false
      required: [id, title, artists, durationMs, format, genres, etag]
      properties:
        id: { type: string }
        title: { type: string }
        artists:
          type: array
          items: { type: string }
        discNo: { type: integer }
        trackNo: { type: integer }
        durationMs: { type: integer, format: int64 }
        format: { type: string }
        sampleRate: { type: integer }
        bitDepth: { type: integer }
        replayGain: { $ref: "#/components/schemas/ReplayGain" }
        trackTotal: { type: integer }
        discTotal: { type: integer }
        discSubtitle:
          type: string
          description: The disc's name as this track is tagged; absent when untagged.
        year: { type: integer }
        genres:
          type: array
          items: { type: string }
        etag:
          type: string
          description: Changes when the file does. Not the stream's ETag.
        stars:
          type: number
          minimum: 0.5
          maximum: 5
          multipleOf: 0.5
          description: The caller's rating, ½ to 5 stars in halves. Absent when the caller hasn't rated it.
    TrackDetail:
      description: A track's properties, repeated (allOf does not mix with additionalProperties false), plus its album.
      type: object
      additionalProperties: false
      required: [id, title, artists, durationMs, format, genres, etag, albumId, albumEtag]
      properties:
        id: { type: string }
        title: { type: string }
        artists:
          type: array
          items: { type: string }
        discNo: { type: integer }
        trackNo: { type: integer }
        durationMs: { type: integer, format: int64 }
        format: { type: string }
        sampleRate: { type: integer }
        bitDepth: { type: integer }
        replayGain: { $ref: "#/components/schemas/ReplayGain" }
        trackTotal: { type: integer }
        discTotal: { type: integer }
        discSubtitle:
          type: string
          description: The disc's name as this track is tagged; absent when untagged.
        year: { type: integer }
        genres:
          type: array
          items: { type: string }
        etag:
          type: string
          description: Changes when the file does. Not the stream's ETag.
        stars:
          type: number
          minimum: 0.5
          maximum: 5
          multipleOf: 0.5
          description: The caller's rating, ½ to 5 stars in halves. Absent when the caller hasn't rated it.
        albumId: { type: string }
        albumEtag:
          type: string
          description: The `If-Match` value for `POST /albums/{id}/edits`.
    TagEdit:
      description: A change to a file's tags. At least one is required, here or in `tracks`.
      type: object
      additionalProperties: false
      properties:
        set: { $ref: "#/components/schemas/FieldValues" }
        clear: { $ref: "#/components/schemas/ClearedFields" }
        tags: { $ref: "#/components/schemas/RawTagEdits" }
    TrackTagEdit:
      description: A `TagEdit` of one track, repeated (allOf does not mix with additionalProperties false).
      type: object
      additionalProperties: false
      required: [id]
      properties:
        id: { type: string }
        set: { $ref: "#/components/schemas/FieldValues" }
        clear: { $ref: "#/components/schemas/ClearedFields" }
        tags: { $ref: "#/components/schemas/RawTagEdits" }
    ClearedFields:
      description: Fields to remove. Any but `title`. A field also in `set` is a 400.
      type: array
      items: { type: string }
    RawTagEdits:
      description: >-
        Changes to the tags no field covers, by `key` as `GET
        /albums/{id}/tags` shows them. A key a file can't take is a 422: on any
        format, one a field owns or one that holds pictures, chapters, gain or
        a fingerprint; a new Vorbis key that isn't upper-case ASCII without `=`;
        a new ID3 key that isn't upper-case or looks like a frame ID; a new M4A
        key that isn't upper-case, and any M4A item that isn't text.
      type: array
      items:
        type: object
        additionalProperties: false
        required: [key, values]
        properties:
          key: { type: string }
          values:
            description: The new values. Empty removes the tag.
            type: array
            items: { type: string }
    AlbumEdit:
      description: >-
        `all` goes to every track, and `tracks` to the ones they name, on top of
        `all`: a field in both takes the track's value or removal. A track not on this
        album is a 422, and naming one twice a 400.
      type: object
      additionalProperties: false
      properties:
        all: { $ref: "#/components/schemas/TagEdit" }
        tracks:
          type: array
          items: { $ref: "#/components/schemas/TrackTagEdit" }
    ShuffleStart:
      type: object
      additionalProperties: false
      required: [scope, mode]
      properties:
        scope: { $ref: "#/components/schemas/ShuffleScope" }
        mode: { type: string, enum: [finite, endless] }
        first:
          type: string
          minLength: 1
          description: The song to lead with, which the client may already be playing.
        seed:
          type: integer
          format: int64
          minimum: 0
          maximum: 9007199254740991
          description: Repeats a shuffle of the same songs. Absent for a new one.
    PlaybackSave:
      type: object
      additionalProperties: false
      description: >-
        Where the caller is, as `PUT /me/playback` takes it: the queue as track
        IDs, the current song's place in it, and how far in. `later` goes only
        with `list`, `continues` only with `album` and `songs`, and `shuffle`
        with `shuffle` and nothing else.
      required: [kind, tracks, index, positionMs, ordered, clientId, device]
      properties:
        kind:
          type: string
          enum: [album, songs, list, shuffle]
          description: >-
            `album` is one album's songs in the order playing; `songs` are
            songs picked from several albums; `list` is a list's songs taken in
            so far, plus `later`; `shuffle` is the current song or run of a
            shuffle session.
        tracks:
          type: array
          minItems: 1
          maxItems: 1000
          items: { type: string, minLength: 26, maxLength: 26 }
        later:
          type: array
          maxItems: 1000
          description: The songs a list only names so far. For `list`.
          items: { type: string, minLength: 26, maxLength: 26 }
        index: { type: integer, minimum: 0, description: The current song's place in `tracks`. }
        positionMs: { type: integer, format: int64, minimum: 0, maximum: 86400000 }
        ordered: { type: boolean, description: Album gain applies. }
        continues:
          type: string
          minLength: 26
          maxLength: 26
          description: >-
            For `album` and `songs`, the album it goes on from, down the Library
            list.
        shuffle: { $ref: "#/components/schemas/PlaybackShuffleSave" }
        repeat:
          type: string
          enum: ["off", all, one]
          description: >-
            What the player does at the end of the queue (`all` goes round
            again) or of a song (`one` plays it again). Absent is `off`.
        shuffled: { $ref: "#/components/schemas/PlaybackShuffledSave" }
        clientId:
          type: string
          pattern: "^[0-9a-f]{16,64}$"
          description: The saving browser's own random ID.
        device:
          type: string
          enum: [phone, tablet, computer]
          description: The coarse form of the saving browser.
    PlaybackShuffleSave:
      type: object
      additionalProperties: false
      description: For `shuffle`, the session and its position right after the songs saved.
      required: [id, after]
      properties:
        id: { type: string, minLength: 26, maxLength: 26 }
        after: { type: integer, format: int64, minimum: 0 }
    PlaybackShuffledSave:
      type: object
      additionalProperties: false
      description: >-
        Set while the player's own Shuffle is on, for any kind but `shuffle`,
        whose session is its shuffle: the seed it reordered with, and the
        queue's own order from the current song on, which turning it off goes
        back to.
      required: [seed, order]
      properties:
        seed: { type: integer, format: int64, minimum: 0, maximum: 4294967295 }
        order:
          type: array
          minItems: 1
          maxItems: 1000
          items: { type: string, minLength: 26, maxLength: 26 }
    PlaybackShuffled:
      type: object
      additionalProperties: false
      description: The player's own shuffle, its order as the library has it now.
      required: [seed, order]
      properties:
        seed: { type: integer, format: int64, minimum: 0, maximum: 4294967295 }
        order:
          type: array
          minItems: 1
          items: { $ref: "#/components/schemas/PlaybackSong" }
    Playback:
      type: object
      additionalProperties: false
      description: >-
        Where the caller left off, as `GET /me/playback` gives it: gone songs
        left out, each with its album as it is now.
      required: [kind, tracks, index, positionMs, ordered, moved, repeat, clientId, device, updatedAt]
      properties:
        kind: { type: string, enum: [album, songs, list, shuffle] }
        tracks:
          type: array
          items: { $ref: "#/components/schemas/PlaybackSong" }
        later:
          type: array
          items: { $ref: "#/components/schemas/PlaybackSong" }
        index: { type: integer, minimum: 0 }
        positionMs: { type: integer, format: int64, minimum: 0 }
        ordered: { type: boolean }
        moved:
          type: boolean
          description: >-
            The song saved as current is gone; `index` is the next that exists,
            and `positionMs` is 0.
        continues: { type: string }
        shuffle: { $ref: "#/components/schemas/PlaybackShuffle" }
        repeat:
          type: string
          enum: ["off", all, one]
          description: A record saved before repeat existed is `off`.
        shuffled:
          $ref: "#/components/schemas/PlaybackShuffled"
        clientId: { type: string }
        device: { type: string, enum: [phone, tablet, computer] }
        updatedAt: { type: integer, format: int64, description: When it was saved, Unix ms. }
    PlaybackSong:
      type: object
      additionalProperties: false
      required: [id, albumId]
      properties:
        id: { type: string }
        albumId: { type: string }
    PlaybackShuffle:
      type: object
      additionalProperties: false
      description: >-
        The shuffle session a `shuffle` record plays in, with what it draws from
        and how. When the session is gone, the record comes back as `songs`.
      required: [id, after, scope, mode]
      properties:
        id: { type: string }
        after: { type: integer, format: int64, minimum: 0 }
        scope: { $ref: "#/components/schemas/ShuffleScope" }
        mode: { type: string, enum: [finite, endless] }
    ShuffleScope:
      type: object
      additionalProperties: false
      description: >-
        What a shuffle draws from. `library` is every song; `rated` is the
        Library list's 4★-and-up filter; `album`, `artist` and `playlist` (one of the caller's) take `id`;
        `tracks` names from 1 to 10,000 songs, such as a selection. Nothing
        else may be given. A session or playback record saved with the
        `hearted` scope, gone with hearts, goes on as `rated`.
      required: [kind]
      properties:
        kind: { type: string, enum: [library, rated, album, artist, playlist, tracks] }
        id: { type: string, minLength: 1 }
        tracks:
          type: array
          minItems: 1
          maxItems: 10000
          items: { type: string, minLength: 1 }
    ShufflePage:
      type: object
      additionalProperties: false
      required: [id, mode, from, to, songs, done, picks]
      properties:
        id: { type: string }
        mode: { type: string, enum: [finite, endless] }
        from:
          type: integer
          format: int64
          description: The position the page starts at.
        to:
          type: integer
          format: int64
          description: The position after it, which the next page is asked for after.
        songs:
          type: integer
          description: How many songs shuffle may pick from.
        done:
          type: boolean
          description: A finite shuffle has nothing after this page.
        picks:
          type: array
          items: { $ref: "#/components/schemas/ShufflePick" }
    ShufflePick:
      type: object
      additionalProperties: false
      required: [songs, why]
      properties:
        songs:
          type: array
          description: The song, or the songs combined, in the order they play.
          items: { $ref: "#/components/schemas/TrackHit" }
        why: { $ref: "#/components/schemas/ShuffleWhy" }
    ShuffleWhy:
      type: object
      additionalProperties: false
      description: >-
        Why a pick came up: its weight's factors, each a multiplier, and what
        they come from. The client words them. With `memory` off, skips and
        listen time count for nothing and their factors are 1.
      required: [stars, rating, played, sinceDays, recency, memory, earlySkips, skipMemory, starts, skips, skipRate, listens, heard, listen, flow]
      properties:
        stars: { type: number, minimum: 0, maximum: 5, description: "The mean of its rated songs; 0 unrated." }
        rating: { type: number }
        played: { type: boolean, description: "Whether it has come up before, played or skipped." }
        sinceDays: { type: integer, minimum: 0, description: "Days since it last came up." }
        recency: { type: number }
        memory: { type: boolean, description: "Whether skips and listen time count." }
        earlySkips: { type: integer, minimum: 0, description: "Its skips in the first 30 seconds this week." }
        skipMemory: { type: number }
        starts: { type: integer, minimum: 0, description: "Its starts in shuffle that played or were skipped." }
        skips: { type: integer, minimum: 0 }
        skipRate: { type: number }
        listens: { type: integer, minimum: 0, description: "Its listens that played or were skipped." }
        heard: { type: number, minimum: 0, maximum: 1, description: "How much of it those heard, on average." }
        listen: { type: number }
        flow: { type: number, description: "Flow's factor, 1 for none." }
        after: { $ref: "#/components/schemas/ArtistLink" }
        similarity: { type: number, minimum: 0, maximum: 1, description: "How alike it is to `after`." }
    ShuffleTracks:
      type: object
      additionalProperties: false
      required: [tracks]
      properties:
        tracks:
          type: array
          minItems: 1
          maxItems: 1000
          items: { type: string, minLength: 1 }
    ShuffleRun:
      type: object
      additionalProperties: false
      required: [id, tracks]
      properties:
        id: { type: string }
        tracks:
          type: array
          description: Track IDs, in the order they play.
          minItems: 2
          items: { type: string }
    ShuffleRules:
      type: object
      additionalProperties: false
      required: [runs, excluded]
      properties:
        runs:
          type: array
          items: { $ref: "#/components/schemas/ShuffleRun" }
        excluded:
          type: array
          description: The songs asked about that shuffle leaves out.
          items: { type: string }
    TracksEdit:
      description: >-
        `all` goes to every track `tracks` names, and each track's own on top of
        it: a field in both takes the track's value or removal. A track on none
        of `albums` is a 422; naming an album or a track twice, or nothing to
        change, is a 400.
      type: object
      additionalProperties: false
      required: [albums, tracks]
      properties:
        albums:
          type: array
          minItems: 1
          items:
            type: object
            additionalProperties: false
            required: [id, etag]
            properties:
              id: { type: string }
              etag:
                type: string
                description: The album's `etag` from the last read, verbatim.
        all: { $ref: "#/components/schemas/TagEdit" }
        tracks:
          type: array
          minItems: 1
          items: { $ref: "#/components/schemas/TrackTagEdit" }
    EditedTracks:
      type: object
      additionalProperties: false
      required: [tracks]
      properties:
        tracks:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [id, albumId]
            properties:
              id: { type: string }
              albumId:
                type: string
                description: The album the track is on now.
    AlbumTags:
      type: object
      additionalProperties: false
      required: [etag, tracks]
      properties:
        etag:
          type: string
          description: The album's `If-Match` value.
        tracks:
          type: array
          items: { $ref: "#/components/schemas/TrackTags" }
    TrackTags:
      type: object
      additionalProperties: false
      required: [id, file, fields, tags]
      properties:
        id: { type: string }
        file: { type: string, description: "The file's base name." }
        fields: { $ref: "#/components/schemas/FieldValues" }
        readOnly:
          type: array
          description: Fields to show but not edit, such as timestamped lyrics.
          items: { type: string }
        tags:
          type: array
          description: Everything no field covers, by key.
          items: { $ref: "#/components/schemas/RawTag" }
    FieldValues:
      description: >-
        Values by field, the same in every format. Numbers are decimal text; a
        date is `YYYY`, `YYYY-MM` or `YYYY-MM-DD`, and a new one replaces the
        old one whole. A value a file can't hold is a 422. `compilation` takes
        `1`, and clearing it turns it off. `album`, `artists`, `albumArtists`
        and `compilation` decide which album a track groups into: an album
        renamed whole keeps its ID. The `musicbrainz…Id` fields take
        MusicBrainz IDs, lower-case; `musicbrainzRecordingId` is the
        recording, `musicbrainzTrackId` the release's track. A change of
        `artists` or `albumArtists` drops their IDs unless the same edit
        gives new ones.
      type: object
      additionalProperties: false
      properties:
        title: { $ref: "#/components/schemas/Values" }
        album: { $ref: "#/components/schemas/Values" }
        artists: { $ref: "#/components/schemas/Values" }
        albumArtists: { $ref: "#/components/schemas/Values" }
        compilation: { $ref: "#/components/schemas/Values" }
        track: { $ref: "#/components/schemas/Values" }
        trackTotal: { $ref: "#/components/schemas/Values" }
        disc: { $ref: "#/components/schemas/Values" }
        discTotal: { $ref: "#/components/schemas/Values" }
        discSubtitle: { $ref: "#/components/schemas/Values" }
        date: { $ref: "#/components/schemas/Values" }
        genres: { $ref: "#/components/schemas/Values" }
        composers: { $ref: "#/components/schemas/Values" }
        conductor: { $ref: "#/components/schemas/Values" }
        lyricist: { $ref: "#/components/schemas/Values" }
        performers: { $ref: "#/components/schemas/Values" }
        remixer: { $ref: "#/components/schemas/Values" }
        grouping: { $ref: "#/components/schemas/Values" }
        label: { $ref: "#/components/schemas/Values" }
        catalogNumber: { $ref: "#/components/schemas/Values" }
        barcode: { $ref: "#/components/schemas/Values" }
        isrc: { $ref: "#/components/schemas/Values" }
        originalDate: { $ref: "#/components/schemas/Values" }
        language: { $ref: "#/components/schemas/Values" }
        bpm: { $ref: "#/components/schemas/Values" }
        key: { $ref: "#/components/schemas/Values" }
        copyright: { $ref: "#/components/schemas/Values" }
        comment: { $ref: "#/components/schemas/Values" }
        lyrics: { $ref: "#/components/schemas/Values" }
        sortTitle: { $ref: "#/components/schemas/Values" }
        sortArtist: { $ref: "#/components/schemas/Values" }
        sortAlbum: { $ref: "#/components/schemas/Values" }
        sortAlbumArtist: { $ref: "#/components/schemas/Values" }
        musicbrainzAlbumId: { $ref: "#/components/schemas/Values" }
        musicbrainzReleaseGroupId: { $ref: "#/components/schemas/Values" }
        musicbrainzAlbumArtistId: { $ref: "#/components/schemas/Values" }
        musicbrainzArtistId: { $ref: "#/components/schemas/Values" }
        musicbrainzRecordingId: { $ref: "#/components/schemas/Values" }
        musicbrainzTrackId: { $ref: "#/components/schemas/Values" }
    MatchRequest:
      type: object
      additionalProperties: false
      properties:
        artist: { type: string, description: "Search for this artist instead." }
        album: { type: string, description: "Search for this title instead." }
        code:
          type: string
          description: A catalog number, or a barcode when it is all digits and at least 8 long.
        prefetch: { type: boolean, description: "Work done ahead, which waits for people." }
    MatchList:
      type: object
      additionalProperties: false
      required: [source, asked, candidates]
      properties:
        source: { type: string, enum: [musicbrainz] }
        asked: { $ref: "#/components/schemas/MatchTerms" }
        candidates:
          type: array
          items: { $ref: "#/components/schemas/MatchCandidate" }
    MatchTerms:
      type: object
      additionalProperties: false
      description: What was asked for. Empty members weren't.
      required: [artist, album, catalogNumber, barcode]
      properties:
        artist: { type: string }
        album: { type: string }
        catalogNumber: { type: string }
        barcode: { type: string }
    MatchCandidate:
      type: object
      additionalProperties: false
      required: [id, score, evidence, release, page]
      properties:
        id: { type: string, description: "Opaque: for GET /matches/{id}." }
        score: { type: integer, minimum: 0, maximum: 100, description: "Confidence." }
        evidence:
          type: array
          items: { $ref: "#/components/schemas/MatchEvidence" }
        release: { $ref: "#/components/schemas/MatchRelease" }
        cover: { type: string, description: "The front cover's URL, about 250 pixels across, when there is one." }
        page: { type: string, description: "The release's page on MusicBrainz." }
    MatchEvidence:
      type: object
      additionalProperties: false
      description: >-
        One thing a confidence rests on. `lengths`: `count` of `of` paired
        songs are within ±3 s. `titleArtist`: both are the release's.
        `title`, `artist`: that one differs. `tagged`: `count` songs' files
        carry this release's ID. `discs`: the release has `count` media of
        `format`, the album `of` discs. `songs`: the release has `count`
        songs, the album `of`. `fingerprint` is for matching by sound, later.
      required: [kind, verdict]
      properties:
        kind: { type: string, enum: [lengths, titleArtist, title, artist, tagged, discs, songs, fingerprint] }
        verdict: { type: string, enum: [agrees, neutral, differs] }
        count: { type: integer }
        of: { type: integer }
        format: { type: string }
    MatchRelease:
      type: object
      additionalProperties: false
      required: [id, title, artist, artists, labels, media, trackCount]
      properties:
        id: { type: string, description: "The release MBID." }
        groupId: { type: string }
        title: { type: string }
        artist: { type: string, description: "The credit as it reads." }
        artists:
          type: array
          items: { $ref: "#/components/schemas/MatchCredit" }
        date: { type: string }
        originalDate: { type: string }
        country: { type: string }
        barcode: { type: string }
        status: { type: string }
        labels:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [name, catalogNumber]
            properties:
              name: { type: string }
              catalogNumber: { type: string }
        media:
          type: array
          items: { $ref: "#/components/schemas/MatchMedium" }
        trackCount: { type: integer }
    MatchCredit:
      type: object
      additionalProperties: false
      required: [name, join]
      properties:
        name: { type: string, description: "As credited." }
        id: { type: string }
        join: { type: string, description: "What joins it to the next, such as \" feat. \"." }
    MatchMedium:
      type: object
      additionalProperties: false
      required: [position, format, title, trackCount]
      properties:
        position: { type: integer }
        format: { type: string }
        title: { type: string }
        trackCount: { type: integer }
    MatchReview:
      type: object
      additionalProperties: false
      required: [candidate, album, albumIds, tracks, pairs]
      properties:
        candidate: { $ref: "#/components/schemas/MatchCandidate" }
        album: { $ref: "#/components/schemas/FieldValues" }
        albumIds: { $ref: "#/components/schemas/FieldValues" }
        tracks:
          type: array
          description: The release's tracks, medium by medium.
          items: { $ref: "#/components/schemas/MatchTrack" }
        pairs:
          type: array
          description: One for each live track of the album, in album order.
          items: { $ref: "#/components/schemas/MatchPair" }
    MatchTrack:
      type: object
      additionalProperties: false
      required: [disc, position, title, artist, proposed, ids]
      properties:
        disc: { type: integer, description: "Its medium's position." }
        position: { type: integer }
        title: { type: string }
        artist: { type: string, description: "The credit as it reads." }
        lengthMs: { type: integer, format: int64 }
        proposed: { $ref: "#/components/schemas/FieldValues" }
        ids: { $ref: "#/components/schemas/FieldValues" }
    MatchPair:
      type: object
      additionalProperties: false
      required: [track]
      properties:
        track: { type: string, description: "The album track's ID." }
        release: { type: integer, description: "Index into `tracks`; missing when nothing pairs." }
    MatchQueue:
      type: object
      additionalProperties: false
      required: [counts, albums]
      properties:
        counts:
          type: object
          additionalProperties: false
          required: [todo, skipped, matched]
          properties:
            todo: { type: integer }
            skipped: { type: integer }
            matched: { type: integer }
        albums:
          type: array
          items: { $ref: "#/components/schemas/QueuedAlbum" }
    QueuedAlbum:
      type: object
      additionalProperties: false
      required: [id, title, artist, songs, state]
      properties:
        id: { type: string }
        title: { type: string }
        artist: { type: string }
        songs: { type: integer }
        state: { $ref: "#/components/schemas/MatchState" }
    MatchState:
      type: string
      enum: [todo, skipped, matched]
    MatchStateChange:
      type: object
      additionalProperties: false
      required: [state]
      properties:
        state: { $ref: "#/components/schemas/MatchState" }
    Values:
      type: array
      items: { type: string }
    RawTag:
      type: object
      additionalProperties: false
      required: [key, values]
      properties:
        key: { type: string, description: "The format's own name for the tag." }
        values:
          type: array
          minItems: 1
          items: { type: string }
        readOnly:
          type: boolean
          description: >-
            An edit may not touch it. Gain, fingerprints, pictures, chapters and
            binary items are read-only, and so is a value too long to show whole,
            which is cut.
    AlbumDetail:
      description: An album entry's properties, repeated (allOf does not mix with additionalProperties false), plus its tracks.
      type: object
      additionalProperties: false
      required: [id, title, sortName, artist, artists, trackCount, compilation, tracks, discs, durationMs, formats, addedAt, genres, displayGenres, etag, extras]
      properties:
        id: { type: string }
        title: { type: string }
        sortName: { type: string }
        artist: { type: string }
        artists:
          type: array
          description: >-
            Who `artist` links to: the album artists, else the first track
            artist. Empty for a compilation or Various Artists, where `artist`
            is plain text.
          items: { $ref: "#/components/schemas/ArtistLink" }
        year: { type: integer }
        trackCount: { type: integer }
        compilation: { type: boolean }
        artwork: { $ref: "#/components/schemas/Artwork" }
        tracks:
          type: array
          items: { $ref: "#/components/schemas/Track" }
        discs:
          type: array
          items: { $ref: "#/components/schemas/Disc" }
        durationMs: { type: integer, format: int64 }
        formats:
          type: array
          description: Distinct and sorted.
          items: { type: string }
        addedAt: { type: string, format: date-time }
        genres:
          type: array
          description: Every raw genre value of the tracks, each once, in track order, for the tag editor.
          items: { type: string }
        displayGenres:
          type: array
          description: As on AlbumEntry.
          items: { type: string }
        etag:
          type: string
          description: The `If-Match` value for `POST /albums/{id}/edits`.
        extras: { $ref: "#/components/schemas/AlbumExtras" }
    AlbumExtras:
      type: object
      additionalProperties: false
      description: >-
        What the album has beside its cover: disc art and a back cover, read
        from `cdart`, `discart` or `disc` (every disc), `cd2` and the like (one
        disc) and `back` in the album's folder; while lookups are on, disc art
        from fanart.tv (by the release group) for an album whose folder has
        none, and a back cover from the Cover Art Archive (by the release) for
        one whose folder has none. Each says where it came from.
      required: [discs]
      properties:
        discs:
          type: array
          description: Every disc's art first (`disc` 0), then by disc.
          items: { $ref: "#/components/schemas/DiscArt" }
        back: { $ref: "#/components/schemas/ExtraImage" }
        coverSource:
          type: string
          enum: [files, coverartarchive]
          description: >-
            Where `artwork` came from, so a credit can say: `files`, the
            album's own, or `coverartarchive`, the Cover Art Archive's front
            for the album's release, which an album with no cover in its files
            is given while lookups are on (and loses the moment its files have
            one). Absent with no cover.
    DiscArt:
      type: object
      additionalProperties: false
      required: [disc, image]
      properties:
        disc: { type: integer, minimum: 0, description: "The disc it is for; 0 is every disc." }
        image: { $ref: "#/components/schemas/ExtraImage" }
    Picture:
      type: object
      additionalProperties: false
      description: >-
        An image for `GET /artwork/{hash}`, with its colors, so a page can lay
        its ground before the picture decodes.
      required: [hash, accent, ground, width, height, alpha]
      properties:
        hash: { type: string, pattern: "^[0-9a-f]{64}$" }
        accent: { type: string, pattern: "^#[0-9a-f]{6}$" }
        ground: { type: string, pattern: "^#[0-9a-f]{6}$" }
        width: { type: integer, description: Of the source image. }
        height: { type: integer, description: Of the source image. }
        alpha: { type: boolean, description: "The renditions are PNG, with transparency." }
    ExtraImage:
      type: object
      additionalProperties: false
      description: >-
        An artist's image or an album's extra: a `Picture`'s properties, where
        it came from, and the credit its source asks for.
      required: [hash, accent, ground, width, height, alpha, source]
      properties:
        hash: { type: string, pattern: "^[0-9a-f]{64}$" }
        accent: { type: string, pattern: "^#[0-9a-f]{6}$" }
        ground: { type: string, pattern: "^#[0-9a-f]{6}$" }
        width: { type: integer, description: Of the source image. }
        height: { type: integer, description: Of the source image. }
        alpha: { type: boolean, description: "The renditions are PNG, with transparency." }
        source:
          type: string
          enum: [folder, fanart, audiodb, wikimedia, pinned, coverartarchive]
          description: "`folder`: a file in the library's folders."
        credit: { $ref: "#/components/schemas/Credit" }
    Credit:
      type: object
      additionalProperties: false
      description: What a source asks to be said of what it gave. Absent for the library's own files.
      properties:
        author: { type: string }
        license: { type: string }
        licenseUrl: { type: string }
        pageUrl: { type: string }
    ArtistImages:
      type: object
      additionalProperties: false
      description: >-
        The artist's chosen images, each absent when it has none. From the
        artist's folder (the one above its albums' folders, when it holds only
        its albums): `artist`, `thumb` or `folder` is the thumb, `fanart`,
        `backdrop` or `background` the background, `clearlogo` or `logo` the
        logo, `banner` the banner.
      properties:
        thumb: { $ref: "#/components/schemas/ExtraImage" }
        background: { $ref: "#/components/schemas/ExtraImage" }
        logo: { $ref: "#/components/schemas/ExtraImage" }
        banner: { $ref: "#/components/schemas/ExtraImage" }
    ArtistBio:
      type: object
      additionalProperties: false
      description: >-
        The artist's bio as plain text: `body` in paragraphs split by blank
        lines, `summary` its first. From `artist.nfo` (`nfo`) in the artist's
        folder; a page shows `source`, `license` and `url` with it.
      required: [summary, body, source]
      properties:
        summary: { type: string }
        body: { type: string }
        source: { type: string, enum: [nfo, wikipedia, lastfm, audiodb] }
        url: { type: string, description: The page it came from. }
        license: { type: string }
        licenseUrl: { type: string }
        lang: { type: string, description: A two-letter code, when the source says. }
    ArtistEntry:
      type: object
      additionalProperties: false
      required: [id, name, albumCount, addedAt, plays]
      properties:
        id: { type: string }
        name: { type: string }
        albumCount: { type: integer, description: The albums it owns. }
        addedAt:
          type: string
          format: date-time
          description: When the newest album it owns arrived.
        plays:
          type: integer
          description: How often the caller played the songs of the albums it owns.
        thumb: { $ref: "#/components/schemas/Picture" }
    ArtistList:
      type: object
      additionalProperties: false
      required: [artists]
      properties:
        artists:
          type: array
          items: { $ref: "#/components/schemas/ArtistEntry" }
    ArtistDetail:
      type: object
      additionalProperties: false
      required: [id, name, albumCount, albums, appearsOn, songCount, images]
      properties:
        id: { type: string }
        name: { type: string }
        mbid: { type: string, description: Its MusicBrainz ID; absent when unknown. }
        images: { $ref: "#/components/schemas/ArtistImages" }
        bio: { $ref: "#/components/schemas/ArtistBio" }
        albumCount: { type: integer, description: The albums it owns. }
        songCount:
          type: integer
          description: >-
            The songs it is on, as an artist or an album artist: those
            `GET /library/index?artist=` lists.
        albums:
          type: array
          description: The albums it owns, newest first.
          items: { $ref: "#/components/schemas/AlbumEntry" }
        appearsOn:
          type: array
          description: The other albums it has a track on, newest first.
          items: { $ref: "#/components/schemas/AlbumEntry" }
    ArtistLink:
      type: object
      additionalProperties: false
      required: [id, name]
      properties:
        id: { type: string }
        name: { type: string }
    TrackHit:
      type: object
      additionalProperties: false
      required: [id, title, artists, albumId, album, durationMs]
      properties:
        id: { type: string }
        title: { type: string }
        artists:
          type: array
          items: { type: string }
        albumId: { type: string }
        album: { type: string }
        durationMs: { type: integer, format: int64 }
        artwork: { $ref: "#/components/schemas/Artwork" }
    PrefValue:
      description: >-
        A preference's value. Its key decides which of these it is: two may
        take the same number, so it is any of them, not one of them.
      anyOf:
        - $ref: "#/components/schemas/LibraryColumns"
        - $ref: "#/components/schemas/UITheme"
        - $ref: "#/components/schemas/ShuffleAmount"
        - $ref: "#/components/schemas/ShuffleMemory"
        - $ref: "#/components/schemas/UntaggedGain"
        - $ref: "#/components/schemas/LibrarySort"
        - $ref: "#/components/schemas/ListSort"
        - $ref: "#/components/schemas/ArtistSongs"
    ArtistSongs:
      type: object
      additionalProperties: false
      description: >-
        `artist.songs`: how an artist page's full song list runs, one choice
        for every artist. `group` is `flat` or `album`; `sort` is the flat
        list's order, `by` one of `top` (the caller's plays and stars),
        `plays`, `rating`, `title`, `year` or `added`. By album, the albums go
        by `library.sort`'s `albums`. Flat by `top`, descending, when never
        set.
      required: [group, sort]
      properties:
        group: { type: string, enum: [flat, album] }
        sort:
          type: object
          additionalProperties: false
          required: [by, dir]
          properties:
            by: { type: string, enum: [top, plays, rating, title, year, added] }
            dir: { $ref: "#/components/schemas/SortDirection" }
    LibrarySort:
      type: object
      additionalProperties: false
      description: >-
        `library.sort`: how the Library orders its artists, and each artist's
        albums; artist pages order their albums the same way. Artists A to Z
        and albums newest first when never set. Ties go by name, then ID.
      required: [artists, albums]
      properties:
        artists:
          type: object
          additionalProperties: false
          required: [by, dir]
          properties:
            by: { type: string, enum: [name, added, plays] }
            dir: { $ref: "#/components/schemas/SortDirection" }
        albums:
          type: object
          additionalProperties: false
          required: [by, dir]
          properties:
            by: { type: string, enum: [year, name, added] }
            dir: { $ref: "#/components/schemas/SortDirection" }
    ListSort:
      type: object
      additionalProperties: false
      description: >-
        `albums.sort`: the Albums page's order, `by` one of `name`, `artist`,
        `year`, `added`, `plays` or `rating`. `artists.sort`: the Artists page's,
        `by` one of `name`, `albums`, `added` or `plays`. Name A to Z when never
        set. Ties go by name, then ID.
      required: [by, dir]
      properties:
        by: { type: string, enum: [name, artist, year, added, plays, rating, albums] }
        dir: { $ref: "#/components/schemas/SortDirection" }
    SortDirection:
      type: string
      description: Which way the order runs. What is unknown, such as a missing year, goes last either way.
      enum: [asc, desc]
    UITheme:
      type: string
      description: >-
        `ui.theme`: how the web client looks. `system` follows the light or
        dark the device shows, and changes when it does.
      enum: [system, light, dark]
    ShuffleAmount:
      type: number
      minimum: 0
      maximum: 1
      description: >-
        `shuffle.ratings`: how much ratings matter to shuffle, from
        0 (not at all) to 1; 0.5 when never set. `shuffle.flow`: how much the
        next song leans toward one that suits the last, from 0 (anything next)
        to 1; 0.3 when never set.
    UntaggedGain:
      type: number
      minimum: -20
      maximum: 0
      description: >-
        `playback.untagged_gain`: the gain in dB a song plays at while it has no
        ReplayGain, neither tagged nor measured yet; -8 when never set.
    ShuffleMemory:
      type: boolean
      description: >-
        `shuffle.memory`: whether shuffle learns from what the person skips and
        how much of a song they hear. True when never set.
    LibraryColumns:
      type: object
      additionalProperties: false
      description: >-
        `library.columns`: the person's song columns, one set for every list of
        songs. Checkbox, time and the row's menu are always shown, in their
        places, and never named here. Number and title are always shown too, and
        placed in the order.
      required: [order, artistWhenDifferent]
      properties:
        order:
          type: array
          description: >-
            The columns shown, in their order, `number` and `title` among them. A
            column left out is hidden. An order without `number` or `title`, as
            one saved before they could move, gets them back where they were:
            `number` first and `title` right after it, and reads back with them.
          uniqueItems: true
          items: { $ref: "#/components/schemas/PlacedColumn" }
        artistWhenDifferent:
          type: boolean
          description: Leave Artist empty where the track's artists are the album's.
        widths:
          type: object
          description: >-
            The widths columns were dragged to, in CSS pixels at the base size
            step, by column. A column not named has its default width, as has
            every column of a value saved without widths.
          additionalProperties: false
          properties:
            artist: { $ref: "#/components/schemas/ColumnWidth" }
            albumArtist: { $ref: "#/components/schemas/ColumnWidth" }
            album: { $ref: "#/components/schemas/ColumnWidth" }
            genre: { $ref: "#/components/schemas/ColumnWidth" }
            year: { $ref: "#/components/schemas/ColumnWidth" }
            rating: { $ref: "#/components/schemas/ColumnWidth" }
            plays: { $ref: "#/components/schemas/ColumnWidth" }
            lastPlayed: { $ref: "#/components/schemas/ColumnWidth" }
            added: { $ref: "#/components/schemas/ColumnWidth" }
            composer: { $ref: "#/components/schemas/ColumnWidth" }
            format: { $ref: "#/components/schemas/ColumnWidth" }
            bitrate: { $ref: "#/components/schemas/ColumnWidth" }
            gain: { $ref: "#/components/schemas/ColumnWidth" }
    ColumnWidth:
      type: integer
      description: A column's width, in CSS pixels at the base size step.
      minimum: 16
      maximum: 960
    PlacedColumn:
      description: A column an order may place, the always-shown number and title among them.
      oneOf:
        - { $ref: "#/components/schemas/SongColumn" }
        - { type: string, enum: [number, title] }
    SongColumn:
      type: string
      description: A song column a person may choose to show or hide.
      enum: [artist, albumArtist, album, genre, year, rating, plays, lastPlayed, added, composer, format, bitrate, gain]
    LibraryIndex:
      type: object
      additionalProperties: false
      required: [artists]
      properties:
        artists:
          type: array
          items: { $ref: "#/components/schemas/LibraryArtist" }
    LibraryArtist:
      type: object
      additionalProperties: false
      required: [name, sortName, albums]
      properties:
        id:
          type: string
          description: Absent for a group with no owner a reader shows, such as Various Artists.
        name: { type: string }
        sortName:
          type: string
          description: Who the artist files under, which decides the letter it's found at.
        albums:
          type: array
          items: { $ref: "#/components/schemas/LibraryAlbum" }
    LibraryAlbum:
      type: object
      additionalProperties: false
      required: [id, title, artist, compilation, tracks]
      properties:
        id: { type: string }
        title: { type: string }
        artist: { type: string }
        compilation: { type: boolean }
        year: { type: integer }
        artwork: { $ref: "#/components/schemas/Artwork" }
        tracks:
          type: array
          items: { $ref: "#/components/schemas/LibraryTrack" }
        discs:
          description: >-
            The album's discs, only when they say what its tracks don't: when
            it has more than one, or its one disc has a name. Absent otherwise,
            so an album on one unnamed disc costs what it did.
          type: array
          minItems: 1
          items: { $ref: "#/components/schemas/Disc" }
        after:
          type: string
          description: >-
            Only in an index of some `albums`: the album just before this one in
            the whole index, `""` when it comes first. A client that has that
            album puts this one after it: right behind it under the same
            heading, or else first under its own heading, which follows that
            album's.
    Disc:
      description: >-
        One disc of an album, in disc order: an album on one disc has one.
        When no song of the album has a disc number, they are all on disc 1.
        When some do and some don't, those that don't are a group of their
        own, after every disc, which has no `no`: its tracks come last in the
        album's order too. A disc tagged 0 has no number.
      type: object
      additionalProperties: false
      required: [songs, durationMs]
      properties:
        no:
          type: integer
          minimum: 1
          description: Absent for the songs with no disc number, beside songs that have one.
        name:
          type: string
          description: >-
            The disc's subtitle: that of its first song that has one, in the
            order the album lists them. Absent when none has one.
        songs: { type: integer, minimum: 1 }
        durationMs: { type: integer, format: int64 }
    LibraryTrack:
      type: object
      additionalProperties: false
      required: [id, title, durationMs, artists]
      properties:
        id: { type: string }
        title: { type: string }
        durationMs: { type: integer, format: int64 }
        artists:
          type: array
          items: { type: string }
        discNo: { type: integer }
        trackNo: { type: integer }
        stars:
          type: number
          minimum: 0.5
          maximum: 5
          multipleOf: 0.5
          description: The caller's rating, ½ to 5 stars in halves. Absent when the caller hasn't rated it.
        albumArtists:
          type: array
          description: With `fields=albumArtist`. Absent when the track names none.
          items: { type: string }
        displayGenres:
          type: array
          description: >-
            With `fields=genre`: the track's genres, split and spelled as
            albums' `displayGenres` are. Absent when it has none.
          items: { type: string }
        year:
          type: integer
          description: With `fields=year`. Absent when unknown.
        composers:
          type: array
          description: With `fields=composer`, as tagged. Absent when it has none.
          items: { type: string }
        format:
          type: string
          description: With `fields=format`, such as `FLAC` or `MP3`.
        sampleRate:
          type: integer
          description: With `fields=format`, in Hz. Absent when unknown.
        bitDepth:
          type: integer
          description: With `fields=format`. Absent for a lossy format.
        bitrate:
          type: integer
          description: With `fields=format` or `fields=bitrate`, in kbps. Absent when unknown.
        addedAt:
          type: string
          format: date-time
          description: With `fields=added`. When the library first saw the file.
        plays:
          type: integer
          minimum: 1
          description: With `fields=plays`. The caller's plays of it. Absent when never played.
        lastPlayedAt:
          type: string
          format: date-time
          description: With `fields=lastPlayed`. The caller's last play. Absent when never played.
        trackGain:
          type: number
          description: >-
            With `fields=gain`: the gain the track plays at, in dB, as an
            album's `replayGain.trackGain`: the file's tagged ReplayGain, or, for
            a file with no gain tagged, Kitsune's own measure of it. Absent when
            it has neither.
        trackGainSource:
          type: string
          enum: [tags, measured]
          description: >-
            With `fields=gain`, where `trackGain` comes from, as `ReplayGain`'s
            `source` says it. Present exactly when `trackGain` is.
        shuffle:
          type: object
          additionalProperties: false
          description: >-
            With `fields=shuffle`: the caller's shuffle rules on the track.
            Absent when it has none.
          properties:
            run:
              type: string
              description: The run it is combined in, with `position` and `length`.
            position: { type: integer, minimum: 1, description: Its place in the run, from 1. }
            length: { type: integer, minimum: 2, description: How many songs the run has. }
            excluded:
              type: boolean
              description: Shuffle never picks it. Absent when false.
    SearchResults:
      type: object
      additionalProperties: false
      required: [artists, albums, tracks]
      properties:
        artists:
          type: array
          items: { $ref: "#/components/schemas/ArtistLink" }
        albums:
          type: array
          items: { $ref: "#/components/schemas/AlbumEntry" }
        tracks:
          type: array
          items: { $ref: "#/components/schemas/TrackHit" }
    LibraryFacts:
      type: object
      additionalProperties: false
      required: [albums, tracks, durationMs, roots, issues, issueCounts, scan, fingerprints, loudness]
      properties:
        albums: { type: integer, format: int64 }
        tracks: { type: integer, format: int64 }
        durationMs: { type: integer, format: int64 }
        roots: { type: integer, description: The number of configured library roots. }
        issues: { type: integer, format: int64, description: Files the scanner could not read. }
        issueCounts: { $ref: "#/components/schemas/IssueCounts" }
        scan: { $ref: "#/components/schemas/ScanStatus" }
        fingerprints: { $ref: "#/components/schemas/FingerprintStatus" }
        loudness: { $ref: "#/components/schemas/LoudnessStatus" }
    LoudnessStatus:
      type: object
      additionalProperties: false
      description: >-
        The background pass that measures the loudness of albums with a song
        that has no ReplayGain tags, after a scan, so every song plays at the
        same level. `done` and `total` are 0 while no pass runs. FLAC, MP3, and
        uncompressed WAV and AIFF are measured; other formats can't be yet.
      required: [done, total, ungained, measured, unmeasurable]
      properties:
        done: { type: integer, description: Files the pass has read. }
        total: { type: integer, description: Files waiting for a measure when the pass began. }
        ungained: { type: integer, description: Songs with no ReplayGain tags. }
        measured: { type: integer, description: Of those, the ones Kitsune has measured. }
        unmeasurable: { type: integer, description: Of those, the ones it can't measure yet. }
    FingerprintStatus:
      type: object
      additionalProperties: false
      description: >-
        The background pass that fingerprints new and changed files after a scan,
        so a moved file keeps its track. Both are 0 while no pass runs. A file
        that moves before its fingerprint is made becomes a new track.
      required: [done, total]
      properties:
        done: { type: integer, description: Files the pass has read. }
        total: { type: integer, description: Files waiting for a fingerprint when the pass began. }
    IssueCounts:
      type: object
      additionalProperties: false
      required: [unreadable, corrupted, unsupported, warnings]
      properties:
        unreadable: { type: integer, format: int64, description: 'Files an I/O or permission error stopped. Tried again every scan.' }
        corrupted: { type: integer, format: int64, description: Structurally broken files. }
        unsupported: { type: integer, format: int64, description: Files of a format Kitsune can't read. }
        warnings: { type: integer, format: int64, description: Live tracks read with warnings. They play; `issues` leaves them out. }
    ScanIssues:
      type: object
      additionalProperties: false
      required: [issues, warnings]
      properties:
        issues:
          type: array
          items: { $ref: "#/components/schemas/ScanIssue" }
        warnings:
          type: array
          items: { $ref: "#/components/schemas/TrackWarned" }
    ScanIssue:
      type: object
      additionalProperties: false
      required: [path, kind, message]
      properties:
        path: { type: string, description: Relative to its library root. }
        kind: { type: string, enum: [unreadable, corrupted, unsupported] }
        message: { type: string }
    TrackWarned:
      type: object
      additionalProperties: false
      required: [trackId, path, messages]
      properties:
        trackId: { type: string }
        path: { type: string, description: Relative to its library root. }
        messages:
          type: array
          items: { type: string }
    ScanRequest:
      type: object
      additionalProperties: false
      required: [mode]
      properties:
        mode: { type: string, enum: [quick, full] }
    TrashRequest:
      type: object
      additionalProperties: false
      description: Songs, or whole albums, by ID; exactly one of the two.
      properties:
        tracks:
          type: array
          minItems: 1
          maxItems: 1000
          items: { type: string }
        albums:
          type: array
          minItems: 1
          maxItems: 1000
          items: { type: string }
    TrashRestore:
      type: object
      additionalProperties: false
      required: [tracks]
      properties:
        tracks:
          type: array
          minItems: 1
          maxItems: 1000
          items: { type: string }
    TrashEmpty:
      type: object
      additionalProperties: false
      description: Songs in the Trash by ID, or `all`; exactly one of the two.
      properties:
        tracks:
          type: array
          minItems: 1
          maxItems: 1000
          items: { type: string }
        all: { type: boolean, enum: [true] }
    TrashChange:
      type: object
      additionalProperties: false
      required: [tracks, albums]
      properties:
        tracks:
          type: array
          description: The songs that moved, every one asked for.
          items: { type: string }
        albums:
          type: array
          description: The albums they are on, each once.
          items: { type: string }
    TrashEmptied:
      type: object
      additionalProperties: false
      required: [deleted]
      properties:
        deleted: { type: integer, description: Songs deleted for good. }
    Trash:
      type: object
      additionalProperties: false
      required: [count, bytes, retentionDays, albums]
      properties:
        count: { type: integer, description: Songs in the Trash. }
        bytes: { type: integer, format: int64, description: What their files hold. }
        retentionDays:
          type: integer
          description: How many days after it came each song goes for good.
        albums:
          type: array
          description: By album, the album with the latest song first.
          items: { $ref: "#/components/schemas/TrashAlbum" }
    TrashAlbum:
      type: object
      additionalProperties: false
      required: [id, title, artist, tracks]
      properties:
        id: { type: string }
        title: { type: string }
        artist: { type: string }
        artwork: { $ref: "#/components/schemas/Artwork" }
        tracks:
          type: array
          description: In album order.
          items: { $ref: "#/components/schemas/TrashedTrack" }
    TrashedTrack:
      type: object
      additionalProperties: false
      required: [id, title, size, trashedAt, purgeAt]
      properties:
        id: { type: string }
        title: { type: string }
        size: { type: integer, format: int64, description: Bytes. }
        trashedAt: { type: string, format: date-time }
        trashedBy:
          type: string
          description: The administrator who moved it; absent once their account is gone.
        purgeAt:
          type: string
          format: date-time
          description: When it goes for good, by the server's clock.
    ScanStatus:
      type: object
      additionalProperties: false
      description: >-
        `mode`, `read`, `total` and `startedAt` describe the running scan: idle,
        the first and last are absent and the numbers are 0.
      required: [state, read, total]
      properties:
        state: { type: string, enum: [idle, running] }
        mode: { type: string, enum: [quick, full] }
        read: { type: integer, description: Files the scan has read. }
        total:
          type: integer
          description: >-
            Files the scan has to read: every file for a Full scan, new and
            changed ones for a Quick one. 0 until it has walked the roots.
        startedAt: { type: string, format: date-time }
        last: { $ref: "#/components/schemas/ScanResult" }
    ScanResult:
      type: object
      additionalProperties: false
      description: >-
        How the last scan to end went. It is held in memory: a restart starts
        over from the Quick scan every start runs.
      required: [mode, outcome, startedAt, endedAt, seen, read, added, updated, moved, missing, deleted, issues, skippedRoots]
      properties:
        mode: { type: string, enum: [quick, full] }
        outcome: { type: string, enum: [finished, failed] }
        startedAt: { type: string, format: date-time }
        endedAt: { type: string, format: date-time }
        seen: { type: integer, description: Audio files found under the roots. }
        read: { type: integer }
        added: { type: integer }
        updated: { type: integer }
        moved: { type: integer }
        missing: { type: integer, description: Tracks newly marked missing. }
        deleted: { type: integer, format: int64, description: Tracks deleted after the grace period. }
        issues: { type: integer, description: Files this scan read and could not use. }
        skippedRoots: { type: integer, description: Roots left alone because they looked like an outage. }
        error: { type: string, description: 'Why it failed, without library paths. Administrators only.' }
    ServerSettings:
      type: object
      additionalProperties: false
      required: [settings, listen, listenSource, version, folders]
      properties:
        folders:
          type: array
          description: The library.roots, in order, with what each holds now.
          items: { $ref: "#/components/schemas/LibraryFolder" }
        settings:
          type: object
          additionalProperties: false
          description: Every setting, by its key as server.toml spells it.
          required:
            - lastfm.api_key
            - lastfm.shared_secret
            - library.roots
            - library.tag_writes
            - library.quick_scan
            - library.missing_grace
            - log.level
            - server.base_url
            - server.trusted_proxies
            - organize.template
            - organize.compilations
            - organize.roots
            - organize.on_edit
            - organize.companions
            - organize.rewrite_playlists
            - metadata.remote
            - metadata.fanarttv
            - metadata.wikipedia
            - metadata.lastfm_bios
            - metadata.coverartarchive
            - metadata.language
            - fanarttv.api_key
            - fanarttv.client_key
          properties:
            lastfm.api_key: { $ref: "#/components/schemas/StringSetting" }
            lastfm.shared_secret: { $ref: "#/components/schemas/SecretSetting" }
            library.roots: { $ref: "#/components/schemas/ListSetting" }
            library.tag_writes: { $ref: "#/components/schemas/BoolSetting" }
            library.quick_scan: { $ref: "#/components/schemas/StringSetting" }
            library.missing_grace: { $ref: "#/components/schemas/StringSetting" }
            log.level: { $ref: "#/components/schemas/StringSetting" }
            server.base_url: { $ref: "#/components/schemas/StringSetting" }
            server.trusted_proxies: { $ref: "#/components/schemas/ListSetting" }
            organize.template: { $ref: "#/components/schemas/StringSetting" }
            organize.compilations: { $ref: "#/components/schemas/StringSetting" }
            organize.roots: { $ref: "#/components/schemas/ObjectSetting" }
            organize.on_edit: { $ref: "#/components/schemas/BoolSetting" }
            organize.companions: { $ref: "#/components/schemas/BoolSetting" }
            organize.rewrite_playlists: { $ref: "#/components/schemas/BoolSetting" }
            metadata.remote: { $ref: "#/components/schemas/BoolSetting" }
            metadata.fanarttv: { $ref: "#/components/schemas/BoolSetting" }
            metadata.wikipedia: { $ref: "#/components/schemas/BoolSetting" }
            metadata.lastfm_bios: { $ref: "#/components/schemas/BoolSetting" }
            metadata.coverartarchive: { $ref: "#/components/schemas/BoolSetting" }
            metadata.language: { $ref: "#/components/schemas/StringSetting" }
            fanarttv.api_key: { $ref: "#/components/schemas/SecretSetting" }
            fanarttv.client_key: { $ref: "#/components/schemas/SecretSetting" }
        listen:
          type: string
          description: >-
            The address the server listens on. Only server.toml sets it: the
            server needs it before it can open its database.
        listenSource: { type: string, enum: [server.toml, default] }
        version: { type: string }
    FolderListing:
      type: object
      additionalProperties: false
      required: [path, kind, folders, audio]
      properties:
        path: { type: string }
        parent: { type: string, description: The folder above path. Absent at /. }
        kind: { $ref: "#/components/schemas/FolderKind" }
        folders: { type: array, items: { $ref: "#/components/schemas/Folder" } }
        audio: { $ref: "#/components/schemas/AudioCount" }
    Folder:
      type: object
      additionalProperties: false
      required: [name, path, kind]
      properties:
        name: { type: string }
        path: { type: string }
        kind: { $ref: "#/components/schemas/FolderKind" }
    FolderKind:
      type: string
      enum: [folder, library, inside, holds, data, config]
      description: >-
        Only `folder` can be added. `library` is a library folder already,
        `inside` lies in one and `holds` holds one; `data` is Kitsune's data and
        `config` holds its config file.
    AudioCount:
      type: object
      additionalProperties: false
      description: >-
        The audio files under a folder and the folders that hold them. With
        `complete` false the count stopped early, and these are at least that.
      required: [files, folders, complete]
      properties:
        files: { type: integer }
        folders: { type: integer }
        complete: { type: boolean }
    LibraryFolder:
      type: object
      additionalProperties: false
      description: A library root and what it holds now. Both are 0 until a scan has read it.
      required: [path, tracks, bytes]
      properties:
        path: { type: string }
        tracks: { type: integer, format: int64, description: Live tracks under it. }
        bytes: { type: integer, format: int64, description: Their size on disk. }
        watch: { $ref: "#/components/schemas/FolderWatch" }
    FolderWatch:
      type: object
      additionalProperties: false
      description: >-
        How the server follows the folder for new music. `watching`: the OS
        reports every change, scanned about 10 s after it settles. `polling`: the
        folder is looked over every 5 minutes, because it is on a network or FUSE
        filesystem (`network`, with its `filesystem` type), or watching every
        folder would pass the OS's limit (`watch-limit`: raise
        fs.inotify.max_user_watches and restart). `off`: the folder is missing,
        unreadable or empty while the library has songs there (`missing`); the
        next scan looks again. Absent while the server hasn't looked yet.
      required: [mode]
      properties:
        mode: { type: string, enum: [watching, polling, "off"] }
        reason: { type: string, enum: [network, watch-limit, missing] }
        filesystem: { type: string, description: "The filesystem type, such as `cifs`, for `network`." }
    SettingSource:
      type: string
      enum: [default, web, server.toml, env, flag]
      description: Where the value came from. `default` means nothing has set it.
    SettingFrom:
      type: string
      description: >-
        The source named for a person: the variable, such as
        KITSUNE_LASTFM_API_KEY, the flag, or server.toml. Absent for `default`
        and `web`.
    StringSetting:
      type: object
      additionalProperties: false
      description: >-
        `library.quick_scan` is a local time as HH:MM, `library.missing_grace` a
        duration such as "720h0m0s", and `log.level` one of debug, info, warn and
        error.
      required: [value, source]
      properties:
        value: { type: string }
        source: { $ref: "#/components/schemas/SettingSource" }
        from: { $ref: "#/components/schemas/SettingFrom" }
        restartRequired: { type: boolean, description: A change applies only after a restart. }
        pendingRestart: { type: boolean, description: The value has changed since the server started. }
    ListSetting:
      type: object
      additionalProperties: false
      required: [value, source]
      properties:
        value: { type: array, items: { type: string } }
        source: { $ref: "#/components/schemas/SettingSource" }
        from: { $ref: "#/components/schemas/SettingFrom" }
        restartRequired: { type: boolean, description: A change applies only after a restart. }
        pendingRestart: { type: boolean, description: The value has changed since the server started. }
    BoolSetting:
      type: object
      additionalProperties: false
      required: [value, source]
      properties:
        value: { type: boolean }
        source: { $ref: "#/components/schemas/SettingSource" }
        from: { $ref: "#/components/schemas/SettingFrom" }
    SecretSetting:
      type: object
      additionalProperties: false
      description: A write-only setting. Nothing returns its value.
      required: [set, source]
      properties:
        set: { type: boolean }
        source: { $ref: "#/components/schemas/SettingSource" }
        from: { $ref: "#/components/schemas/SettingFrom" }
    SettingsChange:
      type: object
      additionalProperties: false
      description: The settings to change, by key. null clears one.
      properties:
        lastfm.api_key: { type: [string, "null"], maxLength: 256 }
        lastfm.shared_secret: { type: [string, "null"], maxLength: 256 }
        library.roots: { type: [array, "null"], items: { type: string }, maxItems: 64 }
        library.tag_writes: { type: [boolean, "null"] }
        library.quick_scan: { type: [string, "null"], description: A local time as HH:MM. }
        library.missing_grace: { type: [string, "null"], description: 'A duration from "0s" to "87600h".' }
        log.level: { type: [string, "null"], description: 'debug, info, warn or error, in any case.' }
        server.base_url: { type: [string, "null"] }
        server.trusted_proxies: { type: [array, "null"], items: { type: string }, maxItems: 64 }
        organize.template: { type: [string, "null"], maxLength: 2000, description: "The path template; one that doesn't parse is a 400." }
        organize.compilations: { type: [string, "null"], maxLength: 2000 }
        organize.roots:
          type: [object, "null"]
          description: Library folders with templates of their own, by folder; each must be one of `library.roots`.
          maxProperties: 64
          additionalProperties: { $ref: "#/components/schemas/OrganizeTemplates" }
        organize.on_edit: { type: [boolean, "null"] }
        organize.companions: { type: [boolean, "null"] }
        organize.rewrite_playlists: { type: [boolean, "null"] }
        metadata.remote:
          type: [boolean, "null"]
          description: >-
            The master switch for every lookup on the internet (artist art and
            bios). Off on a new server. Turned on, it sends MusicBrainz IDs to the
            sources and nothing else.
        metadata.fanarttv: { type: [boolean, "null"], description: "fanart.tv, under metadata.remote; it also needs fanarttv.api_key." }
        metadata.wikipedia: { type: [boolean, "null"], description: "Wikipedia, Wikidata and Wikimedia Commons, under metadata.remote." }
        metadata.lastfm_bios: { type: [boolean, "null"], description: "Last.fm's bio of an artist with none from its folder or Wikipedia, under metadata.remote; it also needs lastfm.api_key." }
        metadata.coverartarchive: { type: [boolean, "null"], description: "The Cover Art Archive's front cover for an album with none in its files, and its back cover for one whose folder has none, under metadata.remote." }
        metadata.language: { type: [string, "null"], description: 'A two-letter code, in any case, such as "en": the bios and art wanted.' }
        fanarttv.api_key: { type: [string, "null"], maxLength: 256, description: "The fanart.tv project key. Kitsune ships none." }
        fanarttv.client_key: { type: [string, "null"], maxLength: 256, description: "A person's own fanart.tv key, which brings new art sooner." }
    OrganizeRequest:
      type: object
      additionalProperties: false
      description: >-
        What to preview. Without `template` or `compilations`, the saved ones;
        without `tracks` and `albums`, every song in the library. At most one of
        `tracks` and `albums`.
      properties:
        template: { type: string, minLength: 1, maxLength: 2000 }
        compilations: { type: string, minLength: 1, maxLength: 2000 }
        tracks:
          type: array
          minItems: 1
          maxItems: 10000
          items: { type: string }
        albums:
          type: array
          minItems: 1
          maxItems: 1000
          items: { type: string }
    OrganizeFilter:
      type: string
      description: >-
        Which songs a page lists: `all` every move (renames and new folders),
        `rename` a new name in the same folder, `move` a new folder,
        `conflict`, `skipped`, `inPlace`.
      enum: [all, rename, move, conflict, skipped, inPlace]
    OrganizeCounts:
      type: object
      additionalProperties: false
      required: [songs, inPlace, moves, renames, newFolders, conflicts, skipped, folders]
      properties:
        songs: { type: integer, description: Every song previewed. }
        inPlace: { type: integer }
        moves: { type: integer, description: Renames and new folders together. }
        renames: { type: integer }
        newFolders: { type: integer, description: Songs that go to another folder. }
        conflicts: { type: integer }
        skipped: { type: integer }
        folders: { type: integer, description: How many folders the moves land in. }
    OrganizePreview:
      type: object
      additionalProperties: false
      required: [id, template, compilations, counts, filter, albums]
      properties:
        id: { type: string, description: The preview's ID, for its pages and its run. }
        template: { type: string }
        compilations: { type: string }
        counts: { $ref: "#/components/schemas/OrganizeCounts" }
        scope:
          type: object
          additionalProperties: false
          description: Present when the preview is of some songs, not the library.
          required: [songs, albums]
          properties:
            songs: { type: integer }
            albums: { type: integer }
            album: { type: string, description: The album's title, when the songs are on one. }
        filter: { $ref: "#/components/schemas/OrganizeFilter" }
        matching: { type: integer, description: Albums this filter and search hold, in all their pages. }
        albums:
          type: array
          items: { $ref: "#/components/schemas/OrganizeAlbum" }
        nextCursor: { type: string }
    OrganizeAlbum:
      type: object
      additionalProperties: false
      description: >-
        One album's songs in a preview, in the order a run takes them. `kind`
        is the album's when its songs share one, else `mixed`. `fromFolder`
        and `toFolder` are set when every song listed leaves one folder for
        another, so a client can show the folder change once.
      required: [id, title, artist, root, kind, songs, files, companions]
      properties:
        id: { type: string }
        title: { type: string }
        artist: { type: string }
        artwork: { $ref: "#/components/schemas/Artwork" }
        root: { type: integer, description: The album's library folder, as an index into `library.roots`. }
        kind: { type: string, enum: [rename, move, conflict, skipped, inPlace, mixed] }
        songs: { type: integer, description: The album's songs in the preview, listed or not. }
        fromFolder: { type: string }
        toFolder: { type: string }
        caseOnly: { type: boolean, description: The folder changes only in case. }
        files:
          type: array
          description: The songs this filter and search list, in disc and track order.
          items: { $ref: "#/components/schemas/OrganizeFile" }
        companions:
          type: array
          description: Files that come along with the album's songs.
          items:
            type: object
            additionalProperties: false
            required: [from, to]
            properties:
              from: { type: string }
              to: { type: string }
    OrganizeFile:
      type: object
      additionalProperties: false
      required: [track, title, from, kind]
      properties:
        track: { type: string }
        title: { type: string }
        from: { type: string, description: Where the file is, relative to its library folder. }
        to: { type: string, description: Where the template files it; absent when skipped. }
        kind: { type: string, enum: [rename, move, conflict, skipped, inPlace] }
        caseOnly: { type: boolean, description: The path changes only in case, which a run does in two steps. }
        reason:
          type: string
          description: >-
            Why a song is in conflict or skipped: `claimed` (another song is at
            the path or wants it), `unknownFile` (a file Kitsune doesn't play is
            there, named by `unknown`), `noTags` (nothing for the file's name),
            `tooLong`.
          enum: [claimed, unknownFile, noTags, tooLong]
        unknown: { type: string, description: The name of the file in the way. }
        conflict: { $ref: "#/components/schemas/OrganizeConflict" }
    OrganizeConflict:
      type: object
      additionalProperties: false
      description: >-
        A song in a `claimed` conflict, beside the songs in its way: the one
        already at the path (`here`) and any others that want it.
        `sameRecording` says they are copies of one recording, in one group of
        Duplicates (`group`): by fingerprint (`why` `digest`), by MusicBrainz
        recording (`recording`), or by artist, title and length (`tags`).
      required: [self, with, sameRecording]
      properties:
        self: { $ref: "#/components/schemas/OrganizeClaimant" }
        with:
          type: array
          items: { $ref: "#/components/schemas/OrganizeClaimant" }
        sameRecording: { type: boolean }
        why: { type: string, enum: [digest, recording, tags] }
        group: { type: string, description: "The group of duplicates, for GET /admin/duplicates/{group}." }
    OrganizeClaimant:
      type: object
      additionalProperties: false
      description: A song in a conflict, with what tells it apart. Plays and stars are the caller's.
      required: [track, title, album, albumId, path, root, format, durationMs, plays, stars, addedAt, here]
      properties:
        track: { type: string }
        title: { type: string }
        album: { type: string }
        albumId: { type: string }
        path: { type: string, description: Where it is now, relative to its library folder. }
        root: { type: integer }
        format: { type: string }
        bitrate: { type: integer, description: In kbps. }
        durationMs: { type: integer, format: int64 }
        plays: { type: integer }
        stars: { type: number, minimum: 0, maximum: 5, multipleOf: 0.5 }
        addedAt: { type: string, format: date-time }
        here: { type: boolean, description: It is at the path already. }
    OrganizeRunRequest:
      type: object
      additionalProperties: false
      description: The preview to run, all of its moves or only those of some songs or albums in it.
      required: [previewId]
      properties:
        previewId: { type: string }
        tracks:
          type: array
          minItems: 1
          maxItems: 10000
          items: { type: string }
        albums:
          type: array
          minItems: 1
          maxItems: 1000
          items: { type: string }
    OrganizeRun:
      type: object
      additionalProperties: false
      description: >-
        A run, an undo of one (`undoOf`), or one song moved after a tag edit
        (`edit`). `done` counts songs dealt with of `total`, moved or not.
        `undoable` while an undo would put something back.
      required: [id, kind, state, startedAt, template, total, done, moved, folders, conflicts, left, failed, companions, undoable]
      properties:
        id: { type: string }
        kind: { type: string, enum: [run, undo, edit] }
        state: { $ref: "#/components/schemas/OrganizeState" }
        startedAt: { type: string, format: date-time }
        finishedAt: { type: string, format: date-time }
        by: { type: string, description: The administrator who ran it, while their account is. }
        template: { type: string }
        total: { type: integer }
        done: { type: integer }
        moved: { type: integer }
        folders: { type: integer, description: The folders its songs landed in. }
        conflicts: { type: integer, description: Songs in conflict, which stayed where they were. }
        left: { type: integer, description: Songs it skipped, which stayed where they were. }
        failed: { type: integer, description: Songs whose move failed and were put back. }
        companions: { type: integer, description: Files that came along. }
        playlists: { type: integer, description: Playlist files it rewrote. }
        album: { type: string, description: The album it is moving now. }
        stopping: { type: boolean }
        undoable: { type: boolean }
        undoOf: { type: string }
        undoneBy: { type: string }
    OrganizeState:
      type: string
      description: "`running`, `done`, `stopped` (by Stop, or by the server stopping), or `undone`."
      enum: [running, done, stopped, undone]
    OrganizeRuns:
      type: object
      additionalProperties: false
      required: [runs]
      properties:
        runs:
          type: array
          items: { $ref: "#/components/schemas/OrganizeRun" }
    OrganizeRunDetail:
      type: object
      additionalProperties: false
      required: [run, left]
      properties:
        run: { $ref: "#/components/schemas/OrganizeRun" }
        left:
          type: array
          description: Songs the run left where they were, at most 500, each with why.
          items:
            type: object
            additionalProperties: false
            required: [track, title, from, reason]
            properties:
              track: { type: string }
              title: { type: string }
              from: { type: string }
              to: { type: string }
              root: { type: integer }
              reason:
                type: string
                enum: [claimed, unknownFile, noTags, tooLong, otherFilesystem, changed, missing, failed, movedSince, taken]
    OrganizeTemplateProblem:
      type: object
      required: [type, title, status, field, at]
      properties:
        type: { type: string, format: uri-reference }
        title: { type: string }
        status: { type: integer }
        detail: { type: string, description: What is wrong, for a person. }
        requestId: { type: string }
        field: { type: string, enum: [template, compilations] }
        at: { type: integer, description: Where, in characters from the start. }
    DuplicateCounts:
      type: object
      additionalProperties: false
      description: >-
        A find's totals. `groups`, `songs` and `pairs` leave out what was
        dismissed; `audio`, `recording` and `probably` count groups by
        confidence. `library` counts the live songs and `checked` those the
        fingerprint pass has read, which alone can be found as the same audio.
      required: [groups, songs, pairs, audio, recording, probably, dismissed, library, checked]
      properties:
        groups: { type: integer }
        songs: { type: integer }
        pairs: { type: integer }
        audio: { type: integer }
        recording: { type: integer }
        probably: { type: integer }
        dismissed: { type: integer }
        library: { type: integer }
        checked: { type: integer }
    DuplicateAlbum:
      type: object
      additionalProperties: false
      required: [id, title, artist]
      properties:
        id: { type: string }
        title: { type: string }
        artist: { type: string }
        year: { type: integer }
        artwork: { $ref: "#/components/schemas/Artwork" }
    DuplicateGroupSummary:
      type: object
      additionalProperties: false
      description: >-
        A group as the list shows it: each copy's format and length in order,
        the albums each once, and everyone's plays across the copies. `pair`
        names the album pair it belongs to.
      required: [key, title, artist, confidence, copies, formats, albums, durationMs, plays]
      properties:
        key: { type: string }
        title: { type: string }
        artist: { type: string }
        confidence: { type: string, enum: [audio, recording, probably] }
        copies: { type: integer }
        formats: { type: array, items: { type: string } }
        albums: { type: array, items: { $ref: "#/components/schemas/DuplicateAlbum" } }
        durationMs: { type: array, items: { type: integer, format: int64 } }
        plays: { type: integer }
        pair: { type: string }
        dismissed: { type: boolean }
    DuplicatePairSummary:
      type: object
      additionalProperties: false
      description: >-
        An album pair as the list shows it. `both` counts the songs in both,
        and `only` each album's songs the other lacks, at the same index.
      required: [key, albums, both, only]
      properties:
        key: { type: string }
        albums:
          type: array
          minItems: 2
          maxItems: 2
          items: { $ref: "#/components/schemas/DuplicateAlbum" }
        both: { type: integer }
        only:
          type: array
          minItems: 2
          maxItems: 2
          items: { type: integer }
        dismissed: { type: boolean }
    DuplicateList:
      type: object
      additionalProperties: false
      required: [counts, filter, matching, pairs, groups]
      properties:
        counts: { $ref: "#/components/schemas/DuplicateCounts" }
        filter: { type: string, enum: [all, audio, recording, probably, pairs, dismissed] }
        matching: { type: integer, description: Groups and pairs under the filter. }
        pairs: { type: array, items: { $ref: "#/components/schemas/DuplicatePairSummary" } }
        groups: { type: array, items: { $ref: "#/components/schemas/DuplicateGroupSummary" } }
        nextCursor: { type: string }
    DuplicateCopy:
      type: object
      additionalProperties: false
      description: >-
        One copy, as a group's page compares it. `path` is relative to the
        library folder `root` indexes in `library.roots`. `plays` are
        everyone's, `raters` how many people rated it, and `stars` the
        caller's own (0 for none). `inPlace` says it sits where the
        organizer's template puts it, and `original` that it is on an album
        its own artist released, not a compilation, best-of or soundtrack.
      required: [track, title, album, path, root, format, lossless, durationMs, plays, stars, raters, playlists, addedAt, inPlace, original]
      properties:
        track: { type: string }
        title: { type: string }
        album: { $ref: "#/components/schemas/DuplicateAlbum" }
        disc: { type: integer }
        trackNo: { type: integer }
        path: { type: string }
        root: { type: integer }
        format: { type: string }
        bitrate: { type: integer, description: In kb/s. }
        sampleRate: { type: integer }
        bitDepth: { type: integer }
        lossless: { type: boolean }
        durationMs: { type: integer, format: int64 }
        plays: { type: integer }
        stars: { type: number, minimum: 0, maximum: 5, multipleOf: 0.5 }
        raters: { type: integer }
        playlists: { type: integer }
        addedAt: { type: string, format: date-time }
        inPlace: { type: boolean }
        original: { type: boolean }
    MergePlan:
      type: object
      additionalProperties: false
      description: >-
        What a merge moves, as its confirm words it: counts, the caller's own
        stars, and the names of the caller's own playlists and the file
        playlists that hold a trashed copy. Other people's ratings and
        playlists are only counted. A merge is sent back with the plan its
        confirm showed.
      required: [plays, listens, stars, loves, hearts, entries, playlists, otherPlaylists, excluded, runs, queues]
      properties:
        plays: { type: integer }
        listens: { type: integer }
        stars:
          type: object
          additionalProperties: false
          description: >-
            `yours` is the caller's own in a merge of one group in which they
            rated a trashed copy: the keeper's, the highest a trashed copy had,
            and the keeper's after (0 for none). `come` counts the ratings
            that come over (higher, or the keeper unrated), and `stay` those
            where the keeper's own is as high; for one group, not the caller's.
          required: [come, stay]
          properties:
            yours:
              type: object
              additionalProperties: false
              required: [keeper, other, after]
              properties:
                keeper: { type: number, minimum: 0, maximum: 5, multipleOf: 0.5 }
                other: { type: number, minimum: 0, maximum: 5, multipleOf: 0.5 }
                after: { type: number, minimum: 0, maximum: 5, multipleOf: 0.5 }
            come: { type: integer }
            stay: { type: integer }
        loves: { type: integer, description: Last.fm loves the stars that come over queue. }
        hearts: { type: integer, description: Hearts kept from before that move. }
        entries: { type: integer, description: Playlist entries repointed, in any playlist. }
        playlists:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [id, name]
            properties:
              id: { type: string }
              name: { type: string }
              file: { type: boolean }
        otherPlaylists: { type: integer }
        excluded: { type: integer, description: People a trashed copy was excluded from shuffle for. }
        runs: { type: integer, description: Places in Combine runs that move or go. }
        queues: { type: integer, description: People whose remembered queue names a trashed copy. }
    KeepPlan:
      type: object
      additionalProperties: false
      description: What keeping one copy, or one album of a pair, would move.
      required: [keep, plan]
      properties:
        keep: { type: string }
        plan: { $ref: "#/components/schemas/MergePlan" }
    DuplicateGroup:
      type: object
      additionalProperties: false
      description: >-
        A group, its copies side by side. `keeper` is the copy suggested and
        `reasons` why: each way it beats every other copy, in the order they
        decide (`lossless`, `original`, `bitrate`, `inPlace`, `plays`,
        `earlier`). `plans` say what keeping each copy would move.
      required: [key, title, artist, confidence, keeper, reasons, copies, plans]
      properties:
        key: { type: string }
        title: { type: string }
        artist: { type: string }
        confidence: { type: string, enum: [audio, recording, probably] }
        dismissed: { type: boolean }
        pair: { type: string }
        keeper: { type: string }
        reasons:
          type: array
          items: { type: string, enum: [lossless, original, bitrate, inPlace, plays, earlier] }
        copies: { type: array, items: { $ref: "#/components/schemas/DuplicateCopy" } }
        plans: { type: array, items: { $ref: "#/components/schemas/KeepPlan" } }
    DuplicatePair:
      type: object
      additionalProperties: false
      description: >-
        An album pair, its track lists matched row by row: each row holds the
        copy on each album at the same index, or null where only the other
        album has the song. `keeper` is the album suggested.
      required: [key, albums, keeper, rows, plans]
      properties:
        key: { type: string }
        albums:
          type: array
          minItems: 2
          maxItems: 2
          items: { $ref: "#/components/schemas/DuplicateAlbum" }
        dismissed: { type: boolean }
        keeper: { type: string }
        rows:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [copies]
            properties:
              group: { type: string }
              copies:
                type: array
                minItems: 2
                maxItems: 2
                items:
                  oneOf:
                    - $ref: "#/components/schemas/DuplicateCopy"
                    - type: "null"
        plans: { type: array, items: { $ref: "#/components/schemas/KeepPlan" } }
    DuplicateDetail:
      type: object
      additionalProperties: false
      description: A group (`kind` `group`) or an album pair (`pair`).
      required: [kind]
      properties:
        kind: { type: string, enum: [group, pair] }
        group: { $ref: "#/components/schemas/DuplicateGroup" }
        pair: { $ref: "#/components/schemas/DuplicatePair" }
    MergeRequest:
      type: object
      additionalProperties: false
      required: [keep, trash, plan]
      properties:
        keep: { type: string }
        trash:
          type: array
          minItems: 1
          maxItems: 64
          items: { type: string }
        plan: { $ref: "#/components/schemas/MergePlan" }
    Merged:
      type: object
      additionalProperties: false
      required: [kept, trashed]
      properties:
        kept: { type: array, items: { type: string } }
        trashed: { $ref: "#/components/schemas/TrashChange" }
    PlanChangedProblem:
      type: object
      description: An RFC 9457 problem; when the plan changed, `plan` is what the merge would move now.
      required: [type, title, status]
      properties:
        type: { type: string, format: uri-reference }
        title: { type: string }
        status: { type: integer }
        detail: { type: string, description: What is wrong, for a person. }
        requestId: { type: string }
        plan: { $ref: "#/components/schemas/MergePlan" }
    EventOrganize:
      type: object
      additionalProperties: false
      description: >-
        A run's progress, to administrators: at its start, about every second,
        after each album, and at its end. `albumsDone` counts the albums it has
        finished, in the preview's order; `album` is the one in hand. Never a
        path.
      required: [run, state, done, total, albumsDone]
      properties:
        run: { type: string }
        state: { $ref: "#/components/schemas/OrganizeState" }
        done: { type: integer }
        total: { type: integer }
        albumsDone: { type: integer }
        album: { type: string }
    MetadataStatus:
      type: object
      additionalProperties: false
      description: >-
        `nextRefresh` is when the next artist falls due, absent when none
        waits.
      required: [remote, language, pass, sources, artists, albums]
      properties:
        remote: { type: boolean, description: "metadata.remote: off, nothing is asked." }
        language: { type: string, description: The two-letter language bios and art are wanted in. }
        pass: { $ref: "#/components/schemas/MetadataPass" }
        sources:
          type: array
          items: { $ref: "#/components/schemas/MetadataSource" }
        artists: { $ref: "#/components/schemas/MetadataArtists" }
        albums: { $ref: "#/components/schemas/MetadataAlbums" }
        nextRefresh: { type: string, format: date-time }
    MetadataPass:
      type: object
      additionalProperties: false
      description: >-
        The pass: `done` of the `total` artists, then albums (`phase`), it set
        out to ask about, and the one in hand (`artist` or `album`). All zero
        while none runs.
      required: [running, phase, done, total]
      properties:
        running: { type: boolean }
        phase: { type: string, enum: [artists, albums] }
        done: { type: integer }
        total: { type: integer }
        artist: { $ref: "#/components/schemas/ArtistLink" }
        album: { $ref: "#/components/schemas/AlbumLink" }
    MetadataSource:
      type: object
      additionalProperties: false
      description: >-
        `state`: `on` (asked as artists and albums fall due), `off` (its
        switch or the master switch), `needsKey` (fanart.tv without its project
        key, which Kitsune doesn't ship, or Last.fm without lastfm.api_key),
        `refused` (it refused the key: asked no more
        until a setting changes) or `resting` (down or busy: asked again at
        `until`). `key` and `clientKey` are `set`, `missing`, or `none` for a
        source that takes none; a key's value is never sent.
      required: [name, enabled, state, key, clientKey]
      properties:
        name: { type: string, enum: [musicbrainz, wikipedia, fanarttv, lastfm, coverartarchive] }
        enabled: { type: boolean, description: Its own switch, under the master switch. }
        state: { type: string, enum: [on, "off", needsKey, refused, resting] }
        key: { $ref: "#/components/schemas/KeyState" }
        clientKey: { $ref: "#/components/schemas/KeyState" }
        until: { type: string, format: date-time }
        failure: { $ref: "#/components/schemas/MetadataFailure" }
    KeyState:
      type: string
      enum: [none, set, missing]
    MetadataFailure:
      type: object
      additionalProperties: false
      description: The last thing that went wrong, in words that never hold a key, a URL or a path; `status` the HTTP status when there was one.
      required: [words, at]
      properties:
        words: { type: string }
        status: { type: integer }
        at: { type: string, format: date-time }
    MetadataArtists:
      type: object
      additionalProperties: false
      description: >-
        The library's album artists: all of them; those with a MusicBrainz ID
        the pass may ask about; those every source on has answered about; those
        with an image or a bio from anywhere; those every source answered with
        nothing; and those with no MusicBrainz ID, which only matching their
        albums gives one.
      required: [albumArtists, withMbid, lookedUp, withArt, foundNothing, withoutMbid]
      properties:
        albumArtists: { type: integer }
        withMbid: { type: integer }
        lookedUp: { type: integer }
        withArt: { type: integer }
        foundNothing: { type: integer }
        withoutMbid: { type: integer }
    MetadataAlbums:
      type: object
      additionalProperties: false
      description: >-
        The library's albums: all of them; those with a release MusicBrainz ID,
        which the Cover Art Archive is asked by; those whose cover is the Cover
        Art Archive's; and those with no cover at all.
      required: [albums, withMbid, fromArchive, withoutCover]
      properties:
        albums: { type: integer }
        withMbid: { type: integer }
        fromArchive: { type: integer }
        withoutCover: { type: integer }
    AlbumLink:
      type: object
      additionalProperties: false
      required: [id, name]
      properties:
        id: { type: string }
        name: { type: string }
    ReplayGainStatus:
      type: object
      additionalProperties: false
      description: >-
        What a ReplayGain run would write now: `songs` measured songs with no
        ReplayGain of their own on `albums` albums, their `formats`, most songs
        first, and the four albums with the most (`biggest`). `waiting` songs
        still wait for the loudness pass to measure them or pool their album;
        `unmeasurable` ones can't be measured. `run` is the run going, and
        `runs` the last 10, a running one first, then newest first.
      required: [songs, albums, formats, biggest, waiting, unmeasurable, runs]
      properties:
        songs: { type: integer }
        albums: { type: integer }
        formats:
          type: array
          items: { type: string }
        biggest:
          type: array
          maxItems: 4
          items: { $ref: "#/components/schemas/GainAlbum" }
        waiting: { type: integer }
        unmeasurable: { type: integer }
        run: { $ref: "#/components/schemas/GainRun" }
        runs:
          type: array
          maxItems: 10
          items: { $ref: "#/components/schemas/GainRun" }
    GainAlbum:
      type: object
      additionalProperties: false
      description: An album with songs a run writes or wrote; `songs` counts those.
      required: [id, title, artist, formats, songs]
      properties:
        id: { type: string }
        title: { type: string }
        artist: { type: string }
        year: { type: integer }
        artwork: { $ref: "#/components/schemas/Artwork" }
        formats:
          type: array
          items: { type: string }
        songs: { type: integer }
    GainRunRequest:
      type: object
      additionalProperties: false
      description: The albums to write, by ID, at most 1,000; none writes every album that can be.
      properties:
        albums:
          type: array
          maxItems: 1000
          items: { type: string }
    GainState:
      type: string
      description: "`running`, `done`, `stopped` (by Stop, or by the server stopping), or `undone`."
      enum: [running, done, stopped, undone]
    GainRun:
      type: object
      additionalProperties: false
      description: >-
        A run, or an undo of one (`undoOf`). `done` counts the songs dealt with
        of `total`; `written` the files it wrote (for an undo, put back), `left`
        the songs it left as they were and `failed` those whose write failed.
        `albums` counts its albums, `albumsDone` those finished, and `album` is
        the one in hand. `undoable` while an undo would take something out.
      required: [id, kind, state, startedAt, total, done, written, left, failed, albums, albumsDone, undoable]
      properties:
        id: { type: string }
        kind: { type: string, enum: [run, undo] }
        state: { $ref: "#/components/schemas/GainState" }
        startedAt: { type: string, format: date-time }
        finishedAt: { type: string, format: date-time }
        by: { type: string, description: The administrator who ran it, while their account is. }
        total: { type: integer }
        done: { type: integer }
        written: { type: integer }
        left: { type: integer }
        failed: { type: integer }
        albums: { type: integer }
        albumsDone: { type: integer }
        album: { type: string }
        stopping: { type: boolean }
        undoable: { type: boolean }
        undoOf: { type: string }
        undoneBy: { type: string }
    GainRunDetail:
      type: object
      additionalProperties: false
      required: [run, albums, left]
      properties:
        run: { $ref: "#/components/schemas/GainRun" }
        albums:
          type: array
          description: The run's albums in the order it takes them.
          items:
            type: object
            additionalProperties: false
            required: [id, title, artist, formats, songs, state, written, left]
            properties:
              id: { type: string }
              title: { type: string }
              artist: { type: string }
              year: { type: integer }
              artwork: { $ref: "#/components/schemas/Artwork" }
              formats:
                type: array
                items: { type: string }
              songs: { type: integer }
              state: { type: string, enum: [written, writing, waiting, left] }
              written: { type: integer }
              left: { type: integer }
        left:
          type: array
          description: Songs the run left as they were, at most 500, each with why.
          items:
            type: object
            additionalProperties: false
            required: [track, title, path, root, reason]
            properties:
              track: { type: string }
              title: { type: string }
              path: { type: string, description: Relative to its library folder. }
              root: { type: integer, description: Its library folder, as an index into `library.roots`. }
              reason:
                type: string
                description: >-
                  `changed`: the file isn't as the last scan found it, or
                  another tool put ReplayGain in it; `unwritable`: the file
                  can't be written; `stale`: its measure is out of date;
                  `trashed`, `missing`; `retagged` (an undo): its tags no
                  longer read what the run wrote; `interrupted`: the server
                  stopped before it was written; `failed`.
                enum: [changed, unwritable, stale, trashed, missing, retagged, interrupted, failed]
    EventReplayGain:
      type: object
      additionalProperties: false
      description: >-
        A ReplayGain run's progress, to administrators: at its start, about
        every quarter second, after each album, and at its end. `albumsDone`
        counts the albums it has finished; `album` is the one in hand. Never a
        path.
      required: [run, state, done, total, albumsDone]
      properties:
        run: { type: string }
        state: { $ref: "#/components/schemas/GainState" }
        done: { type: integer }
        total: { type: integer }
        albumsDone: { type: integer }
        album: { type: string }
    ObjectSetting:
      type: object
      additionalProperties: false
      description: "`organize.roots`: the library folders with templates of their own, by folder."
      required: [value, source]
      properties:
        value:
          type: object
          additionalProperties: { $ref: "#/components/schemas/OrganizeTemplates" }
        source: { $ref: "#/components/schemas/SettingSource" }
        from: { $ref: "#/components/schemas/SettingFrom" }
    OrganizeTemplates:
      type: object
      additionalProperties: false
      required: [template, compilations]
      properties:
        template: { type: string }
        compilations: { type: string }
    OrganizeExamples:
      type: object
      additionalProperties: false
      required: [songs]
      properties:
        songs:
          type: array
          items: { $ref: "#/components/schemas/OrganizeExample" }
    OrganizeExample:
      type: object
      additionalProperties: false
      required: [track, title, artist, album, from, root, song]
      properties:
        track: { type: string }
        title: { type: string }
        artist: { type: string, description: Who it is by, to show. }
        album: { type: string }
        from: { type: string, description: Where the file is, relative to its library folder; the extension is its last. }
        root: { type: integer }
        song: { $ref: "#/components/schemas/OrganizeSong" }
    OrganizeSong:
      type: object
      additionalProperties: false
      description: What a template reads of a song, as `internal/organize` takes it.
      required: [title, album, albumArtist, artists, genre, discName, format, year, originalYear, disc, discs, track, discSongs, compilation]
      properties:
        title: { type: string }
        album: { type: string }
        albumArtist: { type: string }
        artists: { type: array, items: { type: string } }
        genre: { type: string }
        discName: { type: string }
        format: { type: string }
        year: { type: integer }
        originalYear: { type: integer }
        disc: { type: integer }
        discs: { type: integer }
        track: { type: integer }
        discSongs: { type: integer }
        compilation: { type: boolean }
