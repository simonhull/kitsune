name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  GO_VERSION: '1.27'
  BUN_VERSION: '1.4.4'
  GOVULNCHECK_VERSION: v1.9.0
  # A static ffmpeg for the perf libraries, pinned by build and checksum.
  FFMPEG_URL: https://github.com/BtbN/FFmpeg-Builds/releases/download/autobuild-2026-11-11-12-39/ffmpeg-N-128790-g9bee1e603c-linux64-gpl.tar.xz
  FFMPEG_SHA256: f5752bf3597cbc9fc7a60fe5cea3522797a5ea2493d91cffb6f13e5b4c861233

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
    - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
      with:
        go-version: ${{ env.GO_VERSION }}
        check-latest: true
    - name: Build
      run: CGO_ENABLED=0 go build ./... && go build -race ./...
    - name: Test
      run: go test -race -shuffle=on ./...
    - name: Vulnerability scan
      run: go run golang.org/x/vuln/cmd/govulncheck@${{ env.GOVULNCHECK_VERSION }} ./...

  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
    - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
      with:
        go-version: ${{ env.GO_VERSION }}
        check-latest: true
    - name: golangci-lint
      uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
      with:
        version: v2.15.0
    - name: go.mod tidy
      run: go mod tidy -diff
    - name: tools go.mod tidy
      run: go -C tools mod tidy -diff
    - name: sqlc output is current
      run: |
        CGO_ENABLED=0 go -C tools tool sqlc generate -f ../internal/store/sqlc.yaml
        git status --porcelain
        test -z "$(git status --porcelain)"
    - name: go vet
      run: go vet ./...
    - name: Modernizers
      run: go fix -diff ./...
    - name: No C interop
      run: sh scripts/nocgo.sh

  web:
    name: Web
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
    - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      with:
        bun-version: ${{ env.BUN_VERSION }}
    - name: Install
      run: bun install --frozen-lockfile
    - name: Lint
      run: bun run lint
    - name: Type check
      run: bun run check
    - name: Test
      run: bun run test
    - name: Build
      run: bun run build
    - name: Browser
      run: bunx playwright install --with-deps chromium && bun run e2e

  image:
    name: Image
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
    - name: Build
      run: docker build -t kitsune .
    - name: Smoke test
      run: sh scripts/smoke-image.sh kitsune

  perf:
    name: Perf
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
    - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
      with:
        go-version: ${{ env.GO_VERSION }}
        check-latest: true
    - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      with:
        bun-version: ${{ env.BUN_VERSION }}
    - name: Tools
      run: |
        echo "KITSUNE_PERF_DIR=$RUNNER_TEMP/kitsune-perf" >> "$GITHUB_ENV"
        # ffmpeg and Chromium come from GitHub and Playwright, never apt: a runner that can't reach
        # Ubuntu's archive must not hang the job.
        if ! command -v ffmpeg; then
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/ffmpeg.tar.xz" "$FFMPEG_URL"
          echo "$FFMPEG_SHA256  $RUNNER_TEMP/ffmpeg.tar.xz" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/ffmpeg"
          tar -xJf "$RUNNER_TEMP/ffmpeg.tar.xz" -C "$RUNNER_TEMP/ffmpeg" --strip-components=1
          echo "$RUNNER_TEMP/ffmpeg/bin" >> "$GITHUB_PATH"
        fi
        cd web && bun install --frozen-lockfile && bunx playwright install chromium
    - name: Server
      run: |
        printf '### Server, ms\n\n| Interaction | median | p95 | Budget (p95) |\n|---|--:|--:|--:|\n' >> "$GITHUB_STEP_SUMMARY"
        go test -count=1 -run 'Speed$' -v ./internal/server
    - name: Build
      if: ${{ !cancelled() }}
      run: sh scripts/build.sh "$KITSUNE_PERF_DIR/kitsune-server"
    - name: Browser
      if: ${{ !cancelled() }}
      working-directory: web
      run: bunx playwright test -c perf/playwright.config.ts
