name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  GO_VERSION: '1.27'
  GOVULNCHECK_VERSION: v1.9.0

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
    - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
      with:
        go-version: ${{ env.GO_VERSION }}
        check-latest: true
    - name: Build
      run: CGO_ENABLED=0 go build ./... && go build -race ./...
    - name: Test
      run: go test -race -shuffle=on ./...
    - name: Vulnerability scan
      run: go run golang.org/x/vuln/cmd/govulncheck@${{ env.GOVULNCHECK_VERSION }} ./...

  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
    - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
      with:
        go-version: ${{ env.GO_VERSION }}
        check-latest: true
    - name: golangci-lint
      uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
      with:
        version: v2.15.0
    - name: go.mod tidy
      run: go mod tidy -diff
    - name: tools go.mod tidy
      run: go -C tools mod tidy -diff
    - name: sqlc output is current
      run: |
        CGO_ENABLED=0 go -C tools tool sqlc generate -f ../internal/store/sqlc.yaml
        git status --porcelain
        test -z "$(git status --porcelain)"
    - name: go vet
      run: go vet ./...
    - name: Modernizers
      run: go fix -diff ./...
    - name: No C interop
      run: sh scripts/nocgo.sh
